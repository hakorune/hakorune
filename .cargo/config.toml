# Cargo configuration for Nyash project

[build]
# The normal development host has 32 GiB RAM; allow dependency/test crates to
# build in parallel while keeping one top-level Cargo process. Override with
# CARGO_BUILD_JOBS=1 or =2 for a large first build or under pressure.
jobs = 4

[target.x86_64-unknown-linux-gnu]
# Use clang as the linker driver and lld for faster linking.
linker = "/usr/bin/clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[alias]
# Daily development shortcuts for the lightweight profile.
quick-build = "build --profile quick"
quick-test = "test --profile quick"
