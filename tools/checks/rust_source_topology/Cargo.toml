[workspace]

[package]
name = "rust-source-topology-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cargo_metadata = "0.23.1"
cfg-expr = "0.20"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "visit"] }
toml = "0.8"
