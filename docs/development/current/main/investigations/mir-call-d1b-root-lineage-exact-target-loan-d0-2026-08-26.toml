  "ResolvedFallthroughForbidden",
]
terminal_policy = "ShadowCallObserved requires OwnerSiteSessionBrandMatched and one finite disposition. DispositionReady may only enter atomic scratch-to-loan construction. KnownNonDirectDisposition exits through its existing typed owner; ParkedCompatibility/ParkedRawCompatibility are explicit outside terminals. RawLoanIncomplete and every missing/foreign/duplicate/ambiguous/collapsed/source-only failure reach PackageAbortBeforeInstall or TypedRejectBeforeArguments. RawLoanInstalled requires exact-site take_once; RawLoanConsumed authorizes exactly one TargetedExistingLoan argument descent and Call; adapter completion reaches RawLoanExhausted. Only TargetedExistingLoan crosses into ordinary argument descent. ResolvedFallthroughForbidden and residual loan rows are guard failures, never terminals."

[subtasks]
entrance_census = "Classify SelectedCallable, InstanceConstructor, and the older normal_callable_semantic_source ingress as production, compatibility, or caller-zero with finite evidence; raw Builder remains a consumer/bridge."
observation_issuer = "Design one same-session pre-argument observation/disposition issuer for ordinary FunctionCall. Keep Brand, builtin/typeop/math/fastmem, ExplicitExtern, and ASTNode::Call cohorts outside ordinary inventory with explicit owners."
owner_lineage_co_seal = "Map Cataloged and TopLevel through the existing selected batch/map and InstanceConstructor through source_id/forest root; use OwnedExprSiteV1 only as private validation key and preserve RawInvocationRootLineageV1 without caller=None collapse."
transient_lifecycle = "If existing products cannot carry rows, allow only issuer-local DirectCallInventoryScratchV1 containing owner/site/source identity/session/brand/disposition; require consume/drop before package publication and forbid RawInvocationRootLineageV1, Callee, target synthesis, AST rescan, or second resolver."
preinstall_abort = "Make prepare_install/commit impossible for an unconsumed or incomplete direct-call inventory; missing/foreign/mixed-brand/duplicate/ambiguous/lineage-collapsed rows reject or enter an explicit external ParkedSealed owner before body or argument effects."
raw_loan_boundary = "After semantic co-seal only, design the single package-to-raw preflight loan. Physical lowering may consume an already-decided disposition once; it may not resolve, classify, or recover."
sealed_bundle = "Keep IssuedCallablePackageWithScratchV1, InstallableCallablePackageWithDirectCallsV1, and InstalledCallablePackageWithDirectCallsV1 private, non-Clone/non-Copy, without into_parts or package-only getters, and #[must_use]; no caller may drop scratch and invoke the old package-only install path."
recursive_reborrow = "Thread one affine RawDirectCallDispositionLoanV1 by &mut reborrow through RawInvocationChildPortV1; recursive frames borrow the same loan and never clone, copy, or allocate a child ledger."
old_direct_payload = "Delete the Cataloged Targeted direct Callee payload when the first loan cell lands; retaining both payloads is a NoSafeSlice because the old handoff remains a second authority."

[ordered_rows]
governance = "Keep the existing investigation-ledger topology D0 separate: stable row identity and edge roles must eventually distinguish parent, evidence, prerequisite, and disposition. Do not create another D1B semantic card or rename future-dated cards in this row."
observation_d0 = "Use the existing ordinary FunctionCall observation issuer/boundary cards as evidence: classify SelectedCallable, InstanceConstructor, and parked legacy entrances; define one Shadow observation before semantic argument traversal without opening the profile alone."
inventory_d0 = "Continue MIR-CALL-D1B-DIRECT-CALL-SOURCE-INVENTORY-COSEAL-D0: every observed site receives Direct, KnownNonDirect, TypedReject, or Parked disposition in the same resolver session."
lineage_d1 = "Continue MIR-CALL-D1B-DIRECT-CALL-SOURCE-OWNER-LINEAGE-COSEAL-D1: co-seal owner/site/source identity/session/brand and map to RawInvocationRootLineageV1 once at the package-to-raw boundary; caller=None is forbidden for source-backed roots."
precedence_d1 = "Close this root-lineage exact-target matrix: only existing same-session relations may become Targeted; all other rows reject/park before drive_call_arguments_v1."
d0_sig = "No code: freeze concrete DirectCallInventoryScratchV1 and RawDirectCallDispositionLoanV1 fields, finite disposition states, exact site/lineage key, named Callee issuer, sealed bundle signatures, pre-install abort result, and completion/residual proof. Generic RawDirectCallDispositionLoan<Callee> is forbidden."
s0_shape = "Behavior-neutral BoxShape split only for owner-specific siblings: semantic scratch/inventory, pre-install handoff, raw loan, and recursive child reborrow. Do not add semantic meaning, #[path] bridges, or a public package field; each touched/new source stays below 760 lines."
i0_cataloged = "First implementation cell only: move the already-issued Cataloged Callee into RawDirectCallDispositionLoanV1, delete the old Targeted { callee, arguments } direct payload, preserve BuiltinGlobal > CurrentOwnerStatic > LocalValue > Extern > UniqueOtherStatic > TypedReject, and prove take_once/residual-zero. No Shadow, Selected, TopLevel, Constructor, profile widening, or Call schema."
i1_observation = "One atomic production family: Shadow observation -> DirectCallInventoryScratchV1 -> owner/site/source/session/brand co-seal -> unique lineage mapping -> RawDirectCallDispositionLoanV1 or typed terminal -> pre-install abort on incomplete inventory. Scratch-only publication is forbidden."
i2_installed_loan = "Consume the installed wrapper into begin_lowering and lend RawDirectCallDispositionLoanV1 as &mut through RawInvocationChildPortV1::reborrow; exact-site take_once is the only raw target operation and completion requires zero residual rows."
i3_promotion = "Promote Cataloged, then only independently accepted exact-relation rows (GC, exact TopLevel self/sibling, other Selected, InstanceConstructor ordinary relation). Source-only TopLevel/Constructor remains reject/park."
ret_source = "After all installed lineages are total, delete caller=None collapse, Resolved, post-argument resolve/unique-static/tail recovery, name-Const target carrier, and legacy Call publication in one retirement family."
first_code_cell = "Only after D0-SIG/S0/I0 gates close: the Cataloged preflight Callee direct handoff is consumed once through RawDirectCallDispositionLoanV1 and the old direct payload is absent. This cell does not use Shadow observation, open SelectedCallable, add a general index, change Cataloged precedence, delete Resolved, or change Call schema."
selected_cells = "Then admit one Selected or Constructor production edge per bounded row, each with exact relation, positive/negative/parity, registered guard, and old-edge deletion."
retirement = "After installed source-backed callers are total, delete caller=None -> Resolved, post-argument resolve/unique-static/tail/name-Const/legacy-Call edges; Method(None)/methodize and mandatory-Callee remain later atomic rows."

