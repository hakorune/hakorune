[d0_sig_resolution]
install_boundary = "Adopt C': package module keeps prepare_install/commit private and owns semantic completeness/catalog publication; one crate::mir bridge callback is the only handoff. The callback transfers the installed package by value into a Builder-private sealed bundle with RawDirectCallDispositionLoanV1. A bare package-only install result is never returned to a caller."
mapper_owner = "The sole mapper owner is the private sibling builder/normal_callable_semantic_loan_port/direct_call_handoff.rs, invoked by the C' callback before NormalCallableSemanticPackagePortAdapterV1::new. The adapter instance is a consumer of the installed bundle, not the mapper authority."
raw_loan_owner = "RawDirectCallDispositionLoanV1 remains under Builder/calls and is never moved into the semantic package or a neutral crate. The Builder bundle owns package and loan by value; lowering lends only a short Option<&mut RawDirectCallDispositionLoanV1> to RawInvocationChildPortV1."
callback_closure = "The C' bridge must be a one-shot, owner-private callback/token surface that accepts the whole installed package and returns only the Builder bundle/result. It must not expose prepare_install, commit, package-only getters, into_parts, Clone, or a second semantic receipt. Exact Rust visibility/token spelling is D0-SIG-CLOSE-F, not an implementation claim."
rejected_shapes = "Builder bundle plus public pub(crate) package install is rejected; package-owned bundle containing raw lineage/loan is rejected; a bare callback returning InstalledNormalCallableSemanticPackageV1 is rejected unless immediately consumed into the Builder-private bundle within the same one-shot boundary."

[d0_sig_callback]
bridge_signature = "Concrete bridge shape: package::with_normal_callable_install_once(self, context: &mut CompilationContext, consumer: BuilderInstallConsumerV1) -> Result<BuilderPrivateInstalledCallableBundleV1, NormalCallableSemanticPackageInstallIssueV1>. The bridge accepts one opaque Builder consumer object, never an arbitrary FnOnce or generic R, and returns only the Builder bundle; a bare installed package cannot escape."
consumer_surface = "BuilderInstallConsumerV1 is an owner-private one-shot handle constructed with the existing RawDirectCallDispositionLoanV1. The package bridge creates BuilderInstallTokenV1, invokes consumer.seal(installed, token), and consumes the handle; there is no ignored-token callback, second consumer, or alternate install return."
token_rule = "BuilderInstallTokenV1 is created only inside the package bridge, has private fields, no Clone/Copy, and is accepted only by BuilderInstallConsumerV1::seal(installed, token, raw_loan). A caller cannot fabricate, duplicate, or retain the token after sealing. The token type is crate::mir-visible only as a capability; its constructor remains package-private."
bundle_rule = "BuilderPrivateInstalledCallableBundleV1 owns InstalledNormalCallableSemanticPackageV1 and RawDirectCallDispositionLoanV1 by value, is #[must_use], non-Clone/non-Copy, has no into_parts or package-only getter, and exposes only begin_lowering(&mut self, context) -> adapter plus complete(self)."
mode_lifetime = "NormalCallableSemanticPackageMode::Installed becomes a mutable borrow of BuilderPrivateInstalledCallableBundleV1. The bundle's begin_lowering borrows package immutably for NormalCallableSemanticPackagePortV1 and raw_loan mutably for Option<&mut RawDirectCallDispositionLoanV1>; the adapter and recursive children cannot create a second bundle borrow."
aliasing_rule = "The consumer object owns only the raw loan and token capability; it does not capture &mut MirBuilder or &mut CompilationContext. The package bridge's &mut CompilationContext ends before Builder lowers through the returned bundle, so the compiler need not accept overlapping Builder/comp_ctx borrows."
test_boundary = "Package cfg(test) uses a package-owned closure helper or the same opaque consumer surface that keeps install, lowering, and completion inside the helper; it never returns InstalledNormalCallableSemanticPackageV1. External reference fixtures migrate after the single production bridge and remain outside the first production cell."
callback_acceptance = "D0-SIG-CLOSE-F is accepted only when the bridge has one production consumer, the opaque consumer/token/bundle types are private and non-splittable, package-only install call sites are zero outside package/test helper scope, and the compiler can reject a second mutable begin_lowering while the first adapter lives."

