[entrance_census]
boundary = "semantic source/resolver entrance -> package classification -> raw FunctionCall terminal; includes SelectedCallable, InstanceConstructor, Main exact-i64, Main/instance FullFunction, old normal_callable_semantic_source, raw Builder, Brand/special/ExplicitExtern/ASTNode::Call; excludes JSON/VM/backend and indirect non-FunctionCall lowering"
selected_callable = "production issuer count 1 through normal semantic package; ordinary FunctionCall is currently profile-closed and Brand catalog calls are the only exception."
instance_constructor = "production issuer count 1 through the same package; constructor source identity exists, but no ordinary exact-target relation is co-sealed."
main_exact_i64 = "production resolver count 1 with its own VerifiedCallableIndexV1; ParkedSealed outside this general lane and never an index donor."
full_function = "production resolve_forest callers count 2 for Main and instance plans; separate owner, ParkedSealed until a same-session FullFunction direct-call authority exists."
legacy_semantic_source = "VerifiedNormalCallableSemanticSourceV1::seal and extend_complete_dynamic_sources have production caller count 0 in this bounded census; retain ParkedSealed with a new-production-caller reopen trigger rather than deleting from text-only evidence."
raw_builder = "raw_expression_dispatch has one production ASTNode::FunctionCall entry and is a physical consumer/bridge, never the semantic observation or target issuer."
outside = "Brand, TypeOp, Math, FastMem, str/1, GC, ExplicitExternCall, and ASTNode::Call keep their typed owners; they do not enter ordinary direct-call inventory by name shape."

[private_bridge_design]
semantic_scratch = "DirectCallInventoryScratch is issuer-local only: FunctionOwnerIdV1, SourceExprSiteV1, selected/constructor source identity, resolver session/catalog brand, and finite disposition evidence. It carries no RawInvocationRootLineageV1, Callee, ValueId, EffectMask, physical symbol, AST node, or synthesized target."
raw_loan = "RawDirectCallDispositionLoan is Builder-private and affine. A Targeted row contains the already-issued Callee itself, never CallTarget, catalog key, name/arity, or a resolver recipe. It is keyed by existing RawInvocationRootLineageV1 plus exact site, taken once, and the consumer cannot resolve or reclassify. Reject/KnownNonDirect/Parked rows carry no Callee."
target_issue_rule = "A future Targeted scratch row must reference an existing same-session exact relation whose named owner can issue Callee during atomic handoff. If no such issuer exists, the row is TypedReject/Parked; the mapper cannot turn source identity, relation key, name, or physical state into Callee. Cataloged first-cell Callee is already issued by its landed preflight before wrapping."
lineage_mapper = "NormalCallableSemanticPackagePortAdapterV1 owns one private map_direct_call_inventory_to_raw_loan_v1 boundary. It consumes semantic owner/site/source identity/session/brand plus the already-installed source scope lineage and validates exactly one Cataloged/TopLevel/InstanceConstructor mapping through the existing selected batch map or constructor source_id. Missing/foreign/mixed/duplicate mapping aborts; it never reconstructs lineage from name, arity, box, symbol, or collector order."
atomic_handoff = "The selected lifecycle uses private tuple signatures, not a public package field: issue returns (package, scratch); seal_direct_call_handoff consumes both and returns either (package, raw_loan) or an error with no install; prepare_install_with_direct_call_loan consumes that tuple and preserves the loan beside the prepared/installed package until begin_lowering. Scratch consumption and loan creation are one atomic operation, so scratch-consumed-without-loan is impossible."
lifecycle = "same Shadow traversal -> (package, scratch) -> owner/site/session/brand and finite disposition validation -> atomic scratch-to-loan mapping -> reject before prepare_install if incomplete -> install tuple -> begin_lowering moves loan into adapter -> exact site take_once -> TargetedExistingLoan only lowers arguments -> MirInstruction::call -> adapter completion proves zero residual rows."
cataloged_first_cell = "The first future code cell does not depend on SelectedCallable Shadow observation or semantic scratch. It wraps the existing production Cataloged preflight result Callee in RawDirectCallDispositionLoan, replaces the direct unguarded handoff, proves take-once/residual-zero, and preserves the landed BuiltinGlobal > CurrentOwnerStatic > LocalValue > Extern > UniqueOtherStatic > TypedReject behavior."
package_rule = "VerifiedNormalCallableSemanticPackageV1 gains no public direct-call map. The selected package lifecycle cannot call prepare_install/commit outside the private tuple wrapper once that later row lands; post-install AST scan or ledger lookup is forbidden. Other package callers require a finite census before API restriction."
visibility_rule = "The two private bridge types live in owner-specific sibling modules. They are not public Verified*/Prepared* receipts and do not become a second semantic or physical target authority."

