verdict = "NoSafeSlice remains, but the design is now bounded. The semantic issuer needs one private validation scratch and the Builder needs one affine disposition loan; neither is a public receipt or target issuer. General Selected/TopLevel/Constructor exact target relations do not exist today, exact-i64 cannot be borrowed sideways, package install lacks direct-call coverage, and source-backed lineages still collapse into post-argument recovery."
design_worker = "Separate the bounded Cataloged infrastructure cell from future semantic observation: Cataloged wraps its already-issued Callee directly in the affine loan; later Selected/Constructor rows use same Shadow traversal, private scratch, atomic tuple handoff, the unique lineage mapper, and pre-install completeness before the same loan consumer."
adversary_worker = "Raw lineage cannot enter semantic scratch directly; co-seal semantic source identity first, then map once at the package-to-raw boundary. The raw loan carries the already-issued Callee itself and the consumer never reruns CalleeResolverBox. No BodyEffect reconstruction, AST rescan, cross-session index borrowing, post-install ledger target lookup, CallTarget/name carrier, or raw reclassification."
tests_worker = "Existing tests prove package selected/constructor lifecycle and bounded Cataloged/GC target consumption, but not ordinary observation, direct-call inventory, transient consume/drop, incomplete-inventory pre-install abort, package-derived raw loan, or all-lineage recovery zero."
entrance_worker = "Finite boundary: Selected and Constructor are production; Main exact-i64 and FullFunction are separate production cohorts; old semantic-source seal is caller-zero candidate but ParkedSealed; raw dispatcher is the sole physical FunctionCall entry; typed non-direct families stay outside."
target_worker = "Only Cataloged same-brand self/unique sibling and landed GC have current final exact relations. Cataloged local/Extern stay RetainGuarded for first-cell parity only; TopLevel, Constructor, non-Cataloged bare local/Extern, FullFunction, and other builtins reject/park until their own source-bound relation exists."
ssot_worker = "Do not add another semantic card. Keep this active card as the integrated owner, treat observation/inventory/lineage cards as prerequisite evidence, and route future-date/edge-role/card-graph cleanup through the existing investigation-ledger topology D0."

