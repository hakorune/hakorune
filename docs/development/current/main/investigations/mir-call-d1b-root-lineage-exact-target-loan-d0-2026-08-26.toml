[precedence]
required_rows = [
  "exact same-occurrence relation versus local Value relation",
  "exact self versus exact sibling static relation",
  "builtin and explicit Extern relation versus same-name static declaration",
  "unique static catalog relation versus foreign/ambiguous relation",
  "InstanceConstructor source-only versus an already-existing ordinary callable relation",
]
rule = "Brand and typed special/ExplicitExtern/indirect owners are classified outside ordinary inventory first. The landed Cataloged child keeps BuiltinGlobal > CurrentOwnerStatic > LocalValue > Extern > UniqueOtherStatic > TypedReject unchanged for its first affine-loan cell. CurrentOwnerStatic and UniqueOtherStatic are pre-effect same-catalog lookups; LocalValue and Extern are RetainGuarded transitional issuers and are not generalized as package source authority. TopLevel, Constructor, bare non-Cataloged local/Extern, and other builtin rows reject/park until a distinct exact relation exists."
unknown = "Until every remaining row has a named same-session relation and negative witness, remain NoSafeSlice and do not transport a lineage into Resolved."

[exact_target_matrix]
cataloged_self = "same-brand VerifiedSameModuleCallableDeclarationCatalogV1 current-owner exact row -> TargetedExistingLoan"
cataloged_sibling = "same-brand static_candidates(name, arity) with exactly one canonical key -> TargetedExistingLoan; zero/multiple/foreign -> reject"
gc_builtin = "landed gc_collect/gc_stats typed owner -> TargetedExistingLoan; no general builtin inference follows"
local_value = "Cataloged first-cell parity retains the existing variable_map -> CallTarget::Value -> Callee::Value issuer as RetainGuarded transitional behavior. It is not package semantic authority; non-Cataloged or future general rows without a source-bound callable binding relation reject/park."
explicit_extern = "Cataloged first-cell parity retains existing CallName classification -> Callee::Extern behavior as RetainGuarded transitional behavior. The exact source-site symbol relation remains ASTNode::ExplicitExternCall-only; non-Cataloged bare FunctionCall cannot borrow it."
top_level = "SelectedTopLevelFunctionKeyV1 is source identity only; no exact target relation today -> reject/park"
instance_constructor = "ConstructorSourceIdV1/constructor symbol is provenance and construction authority only -> reject/park ordinary Call unless a distinct exact callable relation already exists"
main_exact_i64 = "separate VerifiedCallableIndexV1 cohort -> ParkedSealed, never borrowed sideways"
full_function = "separate forest/source-plan owner without callable index -> ParkedSealed or typed reject"
negative = "missing, foreign session/brand/site, duplicate, ambiguous, constructor-only, or lineage-collapsed -> package abort before effects"
unique_static_split = "Cataloged UniqueOtherStatic is a pre-effect same-catalog unique key and remains in parity. Resolved unique-static recovery runs after arguments without caller authority and belongs to the retirement delete set; the two states never share an acceptance claim."

