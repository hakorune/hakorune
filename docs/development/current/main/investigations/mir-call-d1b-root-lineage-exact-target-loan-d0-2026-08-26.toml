terminal_policy = "ShadowCallObserved requires OwnerSiteSessionBrandMatched and one finite disposition. DispositionReady may only enter atomic scratch-to-loan construction. KnownNonDirectDisposition exits through its existing typed owner; ParkedCompatibility/ParkedRawCompatibility are explicit outside terminals. RawLoanIncomplete and every missing/foreign/duplicate/ambiguous/collapsed/source-only failure reach PackageAbortBeforeInstall or TypedRejectBeforeArguments. RawLoanInstalled requires exact-site take_once; RawLoanConsumed authorizes exactly one TargetedExistingLoan argument descent and Call; adapter completion reaches RawLoanExhausted. Only TargetedExistingLoan crosses into ordinary argument descent. ResolvedFallthroughForbidden and residual loan rows are guard failures, never terminals."

