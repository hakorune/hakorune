[entrance_census]
boundary = "semantic source/resolver entrance -> package classification -> raw FunctionCall terminal; includes SelectedCallable, InstanceConstructor, Main exact-i64, Main/instance FullFunction, old normal_callable_semantic_source, raw Builder, Brand/special/ExplicitExtern/ASTNode::Call; excludes JSON/VM/backend and indirect non-FunctionCall lowering"
selected_callable = "production issuer count 1 through normal semantic package; ordinary FunctionCall is currently profile-closed and Brand catalog calls are the only exception."
instance_constructor = "production issuer count 1 through the same package; constructor source identity exists, but no ordinary exact-target relation is co-sealed."
main_exact_i64 = "production resolver count 1 with its own VerifiedCallableIndexV1; ParkedSealed outside this general lane and never an index donor."
full_function = "production resolve_forest callers count 2 for Main and instance plans; separate owner, ParkedSealed until a same-session FullFunction direct-call authority exists."
legacy_semantic_source = "VerifiedNormalCallableSemanticSourceV1::seal and extend_complete_dynamic_sources have production caller count 0 in this bounded census; retain ParkedSealed with a new-production-caller reopen trigger rather than deleting from text-only evidence."
raw_builder = "raw_expression_dispatch has one production ASTNode::FunctionCall entry and is a physical consumer/bridge, never the semantic observation or target issuer."
outside = "Brand, TypeOp, Math, FastMem, str/1, GC, ExplicitExternCall, and ASTNode::Call keep their typed owners; they do not enter ordinary direct-call inventory by name shape."

[private_bridge_design]
semantic_scratch = "DirectCallInventoryScratchV1 is issuer-local only: FunctionOwnerIdV1, SourceExprSiteV1, selected/constructor source identity, resolver session/catalog brand, and finite disposition evidence. It carries no RawInvocationRootLineageV1, Callee, ValueId, EffectMask, physical symbol, AST node, or synthesized target."
raw_loan = "RawDirectCallDispositionLoanV1 is Builder-private and affine. A Targeted row contains the already-issued Callee itself, never CallTarget, catalog key, name/arity, or a resolver recipe. It is keyed by existing RawInvocationRootLineageV1 plus exact site, taken once, and the consumer cannot resolve or reclassify. Reject/KnownNonDirect/Parked rows carry no Callee."
scratch_fields = "D0-SIG fields: owner: FunctionOwnerIdV1; source_site: SourceExprSiteV1; source_identity: selected/constructor identity; resolver_session: same-session resolver identity; catalog_brand: same-brand catalog identity; disposition: one finite Direct/ KnownNonDirect/ TypedReject/ Parked state. No raw lineage field is stored here."
loan_fields = "D0-SIG fields: one private finite row collection keyed by (RawInvocationRootLineageV1, SourceExprSiteV1), with Targeted { callee: Callee, taken: false } or a terminal row with no Callee. The concrete type is RawDirectCallDispositionLoanV1, not RawDirectCallDispositionLoan<Callee> or any target-generic container."
bundle_signatures = "D0-SIG lifecycle signatures: issue -> IssuedCallablePackageWithScratchV1; seal_direct_call_handoff(IssuedCallablePackageWithScratchV1) -> Result<InstallableCallablePackageWithDirectCallsV1, owner-private typed inventory failure>; install(InstallableCallablePackageWithDirectCallsV1) -> Result<InstalledCallablePackageWithDirectCallsV1, owner-private typed install failure>; begin_lowering(InstalledCallablePackageWithDirectCallsV1) -> adapter with Option<&mut RawDirectCallDispositionLoanV1>. Error types remain owner-private until implementation permission."
target_issue_rule = "A future Targeted scratch row must reference an existing same-session exact relation whose named owner can issue Callee during atomic handoff. If no such issuer exists, the row is TypedReject/Parked; the mapper cannot turn source identity, relation key, name, or physical state into Callee. Cataloged first-cell Callee is already issued by its landed preflight before wrapping."
lineage_mapper = "NormalCallableSemanticPackagePortAdapterV1 owns one private map_direct_call_inventory_to_raw_loan_v1 boundary. It consumes semantic owner/site/source identity/session/brand plus the already-installed source scope lineage and validates exactly one Cataloged/TopLevel/InstanceConstructor mapping through the existing selected batch map or constructor source_id. Missing/foreign/mixed/duplicate mapping aborts; it never reconstructs lineage from name, arity, box, symbol, or collector order."
sealed_bundle = "Use private sealed lifecycle bundles, not destructurable tuples: IssuedCallablePackageWithScratchV1 { package, scratch } -> InstallableCallablePackageWithDirectCallsV1 { package, direct_calls } -> InstalledCallablePackageWithDirectCallsV1 { package, direct_calls }. Fields stay private; no Clone, Copy, into_parts, package-only getter, or public semantic receipt; mark bundles #[must_use]."
atomic_handoff = "The selected lifecycle consumes the whole private bundle at each boundary: issue creates IssuedCallablePackageWithScratchV1; seal_direct_call_handoff consumes it and returns either InstallableCallablePackageWithDirectCallsV1 or an error with no install; install consumes that bundle and returns InstalledCallablePackageWithDirectCallsV1 until begin_lowering. Scratch consumption and loan creation are one atomic operation, so scratch-consumed-without-loan is impossible."
lifecycle = "same Shadow traversal -> IssuedCallablePackageWithScratchV1 -> owner/site/session/brand and finite disposition validation -> atomic seal_direct_call_handoff -> reject before prepare_install if incomplete -> InstallableCallablePackageWithDirectCallsV1 -> install -> InstalledCallablePackageWithDirectCallsV1 -> begin_lowering lends the loan through a scoped &mut raw-port reborrow -> exact site take_once -> TargetedExistingLoan only lowers arguments -> MirInstruction::call -> adapter completion proves zero residual rows."
mapper_timing = "map_direct_call_inventory_to_raw_loan_v1 runs before the adapter instance is constructed, in an owner-specific sibling such as builder/normal_callable_semantic_loan_port/direct_call_handoff.rs. The adapter instance receives only the installed wrapper; it is not the pre-install mapper owner."
raw_port_reborrow = "RawInvocationChildPortV1 receives Option<&mut RawDirectCallDispositionLoanV1> and reborrow() passes self.direct_call_dispositions.as_deref_mut() into recursive child frames. No Clone, Copy, Rc, Arc, RefCell, copied ledger, or per-child loan is permitted."
cataloged_first_cell = "The first future code cell does not depend on SelectedCallable Shadow observation or semantic scratch. It wraps the existing production Cataloged preflight result Callee in RawDirectCallDispositionLoanV1, replaces the direct unguarded handoff, proves take-once/residual-zero, and preserves the landed BuiltinGlobal > CurrentOwnerStatic > LocalValue > Extern > UniqueOtherStatic > TypedReject behavior."
direct_payload_delete = "The first Cataloged cell must delete PreparedRawOrdinaryFunctionCompletionV1::Targeted { callee, arguments } as an unguarded direct payload and replace it with an exact-site RawDirectCallDispositionLoanV1 take. Direct Callee handoff count is zero after the cell; resolver invocation, argument descent, Call emission, and residual-loan checks are each exactly one/zero as applicable."
package_rule = "VerifiedNormalCallableSemanticPackageV1 gains no public direct-call map. The selected package lifecycle cannot call prepare_install/commit outside the private sealed lifecycle bundles once that later row lands; post-install AST scan or ledger lookup is forbidden. Other package callers require a finite census before API restriction."
visibility_rule = "The two private bridge types and three lifecycle bundles live in owner-specific sibling modules. They are not public Verified*/Prepared* receipts and do not become a second semantic or physical target authority."

