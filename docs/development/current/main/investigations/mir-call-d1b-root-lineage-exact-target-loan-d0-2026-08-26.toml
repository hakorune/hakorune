[brief]
decision = "Select typed structural B for canonical Global targets; String is owner-private compatibility input only. Before any D1B loan, close the observer-only FunctionCall completion transition and total pre-install disposition."
source_authority = "Exact source-site/declaration or builtin relation, plus owner-private typed ingress. Existing keys are source material only until a named family issuer validates namespace/owner/name/arity at the same site/session."
canonical_issuer = "One family-specific source/ingress issuer creates CanonicalGlobalTargetV1; MirInstruction::call stores an already-decided Callee and never classifies."
non_authority = "Raw name/arity, CanonicalSameModuleCallableKeyV1 alone, mir_symbol_projection, ModuleInvocationBrand, physical symbol, EffectMask, caller=None, registry, collector order, methodize, args[0], and backend retry."
fail_fast = "Missing, foreign, duplicate, ambiguous, wrong namespace/arity, unsupported wire/backend, incomplete observation, residual loan, or missing receiver terminates before arguments, MIR mutation, package install, wire, or backend effects."
smallest_next_slice = "B0 read-only finite Global family/issuer/wire/projector census. implementation_permission remains false."
non_claims = "No typed schema code, observation implementation, affine loan, cross-module feature, Method/receiver change, JSON/backend change, or warning cleanup."

[final_architecture]
global_target = "Callee::Global(CanonicalGlobalTargetV1), a self-describing wire-stable structural value; never an opaque ID, hidden registry key, physical symbol, or Legacy(String)."
minimum_families = [
  "Builtin(CanonicalBuiltinGlobalV1)",
  "SameModuleStatic { owner, name, arity }",
]
conditional_families = "Imported/free static and runtime/helper rows exist only if B0 production census proves a distinct semantic family and names its issuer."
method = "Method receiver is non-optional and is the sole semantic receiver; Call.args contains source arguments only."
construction = "NewBox/NewClosure own construction; closure invocation uses Callee::Value. Constructor/Closure descriptors do not survive in final Call."
call = "Call { dst, callee: Callee, args, effects }; func, Option<Callee>, optional receiver, target sentinels, and runtime repair are absent."
compatibility = "Legacy String -> owner-private exact resolution -> typed target -> canonical Call. Invalid explicit v1 never retries through v0."

[global_target_b0]
task_id = "MIR-CALL-GLOBAL-TARGET-B0-FINITE-IDENTITY-DECISION"
status = "selected_design_only"
primary_missing_boundary = "SemanticAuthorityMissing"
selected_option = "B: typed structural Global identity in canonical core. A is retained only as owner-private legacy ingress text; no new canonical String issuer is introduced."
reason = "Global(String) mixes builtin, qualified static, runtime/helper, and compatibility meanings. A new String issuer would be a transitional second authority and would still require later cross-cutting retirement."
implementation_gate = "false; B0 must close all production family issuers, typed schema fields, alias/collision/arity rules, wire ownership, every compiled schema-consumer disposition, selected terminal parity, and old-edge disposition first."
required_rows = [
  "Builtin: finite source owner, enum identity, wire row, compiled consumers, selected terminal",
  "SameModuleStatic: exact call-site/declaration relation, structural owner/name/arity, module domain, compiled consumers, physical projection",
  "Runtime/helper: classify as builtin/static/Extern or prove a distinct family",
  "Compatibility: owner-private text resolution and invalid-input terminal",
  "Additional producer: accepted typed family or ParkedSealed with owner and reopen trigger",
]
forbidden = [
  "GlobalTarget::Legacy(String), String newtype, Unknown/Default/sentinel",
  "session-local numeric identity or process-global registry",
  "source key formatted to a physical symbol and later reparsed",
  "consumer-side target classification, alias repair, methodize, or retry",
]

