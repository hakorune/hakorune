[final_architecture]
global_target = "Callee::Global(CanonicalGlobalTargetV1), defined serde-free in hakorune_mir_defs/global_target.rs; never an opaque ID, hidden registry key, physical symbol, or Legacy(String)."
families = [
  "Builtin(Print), accepted only for exact print/1",
  "SameModule(FreeFunction { name, arity })",
  "SameModule(StaticBoxMethod { owner, method, arity })",
]
family_disposition = "Exact bare panic/1 and exit/1 -> same-name Extern; bare error and now -> reject; explicit declared env/nyash.console.error -> Extern; math is Method; construction is NewBox/NewClosure; GC Global publication retires; imports need an exact final-module declaration; JoinIR will use a co-sealed FreeFunction; no additional variant."
projection = "B1 installs the sole one-way target-to-physical projection under resolved_semantics/callable_symbol and one MirModule structural lookup; it deletes/delegates CanonicalSameModuleCallableKeyV1::mir_symbol_projection, and collision rejects before module publication."
method = "Method receiver is non-optional and is the sole semantic receiver; Call.args contains source arguments only."
construction = "NewBox/NewClosure own construction; closure invocation uses Callee::Value. Constructor/Closure descriptors do not survive in final Call."
call = "Call { dst, callee: Callee, args, effects }; func, Option<Callee>, optional receiver, target sentinels, and runtime repair are absent."
wire = "Exact schema_version=2.0 owns structural Global, required args/effects, canonical effect order, and no func/flags/aliases. Exact v1.0 and v0 are owner-private compatibility only."
wire_cohort = "B1 v2 is bounded to const, copy, copy_owned, destroy_owned, newbox, field_get, binop, compare, branch, jump, phi, ret, and mir_call. Any other op is an unsupported-v2 terminal; full MIR vocabulary is not claimed."
wire_call_shape = "One flat object only: op=mir_call; dst is required integer-or-null; callee, args, and effects are required; mir_call nesting, func, flags, aliases, and duplicate placement are forbidden."
wire_global_objects = [
  "{type:Global,target:{family:builtin,builtin:print}}",
  "{type:Global,target:{family:same_module,kind:free_function,name:<source-name>,arity:<u32>}}",
  "{type:Global,target:{family:same_module,kind:static_box_method,owner:<source-owner>,method:<source-method>,arity:<u32>}}",
]
wire_effect_order = ["pure", "mut", "io", "control", "read", "write", "p2p", "ffi", "panic", "alloc", "global", "async", "unsafe", "debug", "barrier"]
compatibility = "Legacy text -> owner-private exact resolution -> typed target -> canonical Call. The JSON root is parsed once and an explicit schema failure never retries through another parser."

