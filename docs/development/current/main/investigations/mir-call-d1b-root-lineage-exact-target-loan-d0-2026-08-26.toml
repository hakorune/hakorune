  "InstanceConstructor source-only versus an already-existing ordinary callable relation",
]
rule = "Brand and typed special/ExplicitExtern/indirect owners are classified outside ordinary inventory first. The landed Cataloged child keeps BuiltinGlobal > CurrentOwnerStatic > LocalValue > Extern > UniqueOtherStatic > TypedReject unchanged for its first affine-loan cell. CurrentOwnerStatic and UniqueOtherStatic are pre-effect same-catalog lookups; LocalValue and Extern are RetainGuarded transitional issuers and are not generalized as package source authority. TopLevel, Constructor, bare non-Cataloged local/Extern, and other builtin rows reject/park until a distinct exact relation exists."
