[boundary]
starts = "RawInvocationRootLineageV1::{ScriptRoot, Main, Cataloged, TopLevel, InstanceConstructor, NestedBoxMethod} plus Unlocated/Relationless compatibility at brand_call_authority_v1"
ends = "a total pre-effect disposition: TargetedExistingLoan, BoundedGcPreEffectTargeted (existing affine-loan-external route), KnownNonDirect, TypedReject, ParkedCompatibility, or an explicitly tracked CutoverBlockerOpen old edge immediately before drive_call_arguments_v1"
includes = [
  "function_call_brand_source_demand.rs InstalledNonBrand lineage collapse",
  "function_call_preflight_route.rs caller/lineage consumption and Resolved fallthrough",
  "SelectedTopLevelFunctionKeyV1 source occurrence and NormalTopLevelFunctionDraftAdmissionV1 physical projection",
  "ProgramRootWorkPlanAdmissionV1 SelectedNormal versus RawCompatibility",
  "NormalInstanceConstructorSourceKeyV1 constructor-only relation and existing callable relation lookup",
  "finite precedence for exact self/sibling, builtin, local Value, Extern, and unique static relations",
]
excludes = [
  "new Verified*/Prepared* semantic receipt, name/arity target synthesis, and collector replacement as authority",
  "Method(None), methodize, JSON/VM/backend, final Call schema, CallFlags, and constructor emission changes",
  "post-argument recovery deletion implementation; this design only forbids its re-entry",
]

[brief]
decision = "Preserve each live root lineage once, then let one named pre-adapter issuer co-seal an exact static relation and issue one Callee before lending it. TopLevel and InstanceConstructor source keys remain provenance; they never become Global/Value targets by formatting. A missing, duplicate, foreign, or constructor-only relation terminates before argument effects as TypedReject or an explicitly owned ParkedCompatibility state."
source_authority = "current_source_context_v1.root plus a same-session exact source relation and the named issuer capable of issuing its Callee. Today only the landed GC builtin rows have a final pre-effect relation; same-brand Cataloged declaration rows are a candidate relation, not yet a call-site issuer. VerifiedCallableIndexV1/ResolvedDirectCallTargetV1 belong to the separate exact-i64 cohort and cannot be lent sideways to general SelectedNormal or InstanceConstructor. General rows first require observation, owner/site/session/brand co-seal and one canonical issuance; otherwise they reject or park before effects."
canonical_issuer = "No final non-empty Cataloged issuer exists at the observed HEAD. prepare_cataloged_target_v1 -> CalleeResolverBox is a RetainGuarded transitional per-call reclassifier: it lacks SourceExprSiteV1, catalog brand, and resolver/session witnesses and reads raw variable_map state. A future pre-adapter root owner becomes the canonical issuer only after a same-traversal source observation and session/brand co-seal; it must validate the exact static relation with RawInvocationRootLineageV1::Cataloged(caller)/SourceExprSiteV1 and issue one Callee before the affine loan. CallTarget, CanonicalSameModuleCallableKeyV1, name/arity, mir_symbol_projection, and raw-side resolver retry are forbidden loan payloads and are not issuers by themselves."
non_authority = [
  "SelectedTopLevelFunctionKeyV1 name/arity, NormalInstanceConstructorSourceKeyV1 box/symbol, LegacySymbol, collector last-wins, caller=None, current_static_box, has_method, StaticMethodId, registry, env, args[0], or post-argument values",
]
fail_fast = "Root lineage, exact relation, duplicate policy, and builtin/local/Extern/static precedence must be total before drive_call_arguments_v1. Installed lineage may not fall through to PreparedRawOrdinaryFunctionCompletionV1::Resolved."
smallest_next_slice = "D0-SIG-I canonical-issuer target-relation census: keep implementation_permission=false, prove whether an existing source-owned relation already carries an authoritative target payload, and reject key/name/symbol projection until one private issuer can issue Callee exactly once before the loan. G/H remain prerequisites; J/K and implementation stay closed."
non_claims = [
  "TopLevel/InstanceConstructor source keys become canonical targets",
  "transport-only implementation is safe (it would create an unconsumed product and return to Resolved)",
  "InstanceConstructor ordinary calls can use constructor symbols as Globals",
]

[observed]
cataloged = "Cataloged(CanonicalSameModuleCallableKeyV1) is the only root lineage currently forwarded into the landed exact-target child."
top_level = "TopLevel(SelectedTopLevelFunctionKeyV1) carries statement occurrence/name/arity but is not registered as a CanonicalSameModuleCallableKeyV1 target."
top_level_physical = "NormalTopLevelFunctionDraftAdmissionV1 projects a legacy symbol; duplicate source occurrences may share that symbol and collector replacement is not target authority. No general TopLevel exact-target relation exists today; name/arity/symbol cannot be formatted into one."
instance_constructor = "InstanceConstructor(NormalInstanceConstructorSourceKeyV1) identifies constructor emission and has no ordinary FunctionCall target relation by itself."
resolver = "CalleeResolverBox preserves a supplied CallTarget; it does not prove physical uniqueness or source occurrence."
package_gap = "normal_callable_semantic_package::issuer.rs:134-161 issues catalog/batch/selected/constructor products but no direct-call inventory; install.rs:273-333 checks catalog vacancy and publishes without direct-call coverage."
lineage_collapse = "function_call_brand_source_demand.rs:75-91 keeps Cataloged caller identity but collapses TopLevel/InstanceConstructor into InstalledNonBrand { caller: None }, which can enter Resolved rather than a typed terminal."
late_recovery = "function_call_preflight_route.rs:239-267 and calls/build.rs:104-124 still permit Resolved -> drive_call_arguments_v1 -> resolve/unique-static/tail/name-Const/legacy Call."
selected_gate = "SelectedCallableV1 remains a semantic acceptance gate for ordinary FunctionCall, but a same-shadow-traversal observation side-channel may record direct_calls into issuer-local scratch before canonicalize_draft. No profile widening, post-install AST rescan, or BodyEffect(Call)-only inference is allowed."
same_session_index_limit = "ResolvedDirectCallTargetV1 is issued only by the exact-i64 callable-index cohort; Selected/Constructor batches run with callable_index=None and cannot borrow that relation across resolver sessions or brands."
raw_consumer_gap = "RawInvocationChildPortV1 can expose owner/site, but no explicit package-to-raw disposition loan exists; adding a direct-call map to physical lowering or using post-install ledger queries would duplicate semantic authority."
