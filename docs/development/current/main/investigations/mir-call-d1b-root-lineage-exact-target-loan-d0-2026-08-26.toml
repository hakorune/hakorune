[private_bridge_design]
phase_boundary = "The original bundle-with-loan sketch is superseded by the F transition amendment: BridgeReadyPackageOnly is package-only; CatalogedI0Provision owns the first non-empty raw loan in a later row."
semantic_scratch = "DirectCallInventoryScratchV1 is issuer-local only: FunctionOwnerIdV1, SourceExprSiteV1, selected/constructor source identity, resolver session/catalog brand, and finite disposition evidence. It carries no RawInvocationRootLineageV1, Callee, ValueId, EffectMask, physical symbol, AST node, or synthesized target."
raw_loan = "RawDirectCallDispositionLoanV1 is a later CatalogedI0 product, not a BridgeReadyPackageOnly field. It is Builder-private and affine; a Targeted row contains only the Callee issued by the named canonical issuer, never CallTarget, catalog key, name/arity, or a resolver recipe. It is keyed by the co-sealed RawInvocationRootLineageV1 plus exact site, taken once, and the consumer cannot resolve or reclassify. Reject/KnownNonDirect/Parked rows carry no Callee."
scratch_fields = "D0-SIG fields: owner: FunctionOwnerIdV1; source_site: SourceExprSiteV1; source_identity: selected/constructor identity; resolver_session: same-session resolver identity; catalog_brand: same-brand catalog identity; disposition: one finite Direct/ KnownNonDirect/ TypedReject/ Parked state. No raw lineage field is stored here."
loan_fields = "D0-SIG fields: one private finite row collection keyed by (RawInvocationRootLineageV1, SourceExprSiteV1), with Targeted { callee: Callee, taken: false } or a terminal row with no Callee. The concrete type is RawDirectCallDispositionLoanV1, not RawDirectCallDispositionLoan<Callee> or any target-generic container."
bundle_signatures = "D0-SIG split: BridgeReadyPackageOnly consumes the installed semantic package through a private one-shot callback and returns BuilderPrivateInstalledCallablePackageBundleV1 with no direct-call loan; CatalogedI0Provision later adds its own non-empty RawDirectCallDispositionLoanV1 handoff after a named raw-preflight issuer exists. Error types remain owner-private until implementation permission."
target_issue_rule = "A future Targeted scratch row is issued only by the named pre-adapter canonical issuer, after a same-traversal source observation and exact same-session relation are co-sealed; the issuer issues Callee during one atomic handoff. No current Cataloged path satisfies that complete contract: if the source-bound relation or issuer is absent, the row is TypedReject/Parked; a mapper cannot turn source identity, CanonicalSameModuleCallableKeyV1, name, or physical state into Callee. The loan may wrap only the Callee issued by that co-seal."
lineage_mapper = "A future private pre-adapter sibling (builder/normal_callable_semantic_loan_port/direct_call_handoff.rs) owns map_direct_call_inventory_to_raw_loan_v1. The named canonical issuer first co-seals the exact source-bound relation and issues Callee; this mapper only moves that issued output, then consumes semantic owner/site/source identity/session/brand plus the installed source-scope lineage and validates exactly one Cataloged/TopLevel/InstanceConstructor mapping through an existing batch map or constructor source_id. NormalCallableSemanticPackagePortAdapterV1 is only a downstream consumer; missing/foreign/mixed/duplicate mapping aborts, and lineage is never reconstructed from name, arity, box, symbol, or collector order."
sealed_bundle = "BridgeReadyPackageOnly uses a private non-destructurable BuilderPrivateInstalledCallablePackageBundleV1 containing only the installed package; no Clone, Copy, into_parts, package-only getter, or public semantic receipt, and mark it #[must_use]. CatalogedI0Provision later seals its separately-issued non-empty raw loan without changing the bridge bundle contract."
atomic_handoff = "BridgeReadyPackageOnly consumes the installed package exactly once and returns only the Builder-private package bundle. CatalogedI0Provision is a later atomic raw-preflight handoff: the named issuer co-seals the exact static relation and issues one Callee into RawDirectCallDispositionLoanV1 before arguments. Scratch/loan creation is never represented by an empty or default product."
lifecycle = "BridgeReadyPackageOnly: package install -> one-shot HRTB source scope -> Builder-private package bundle -> lowering. CatalogedI0Provision later: exact Cataloged source/site -> named raw-preflight issuer -> non-empty affine loan -> scoped &mut raw-port reborrow -> exact take_once -> arguments once -> MirInstruction::call -> residual zero. BoundedGcPreEffectTargeted remains outside the loan."
mapper_timing = "map_direct_call_inventory_to_raw_loan_v1 runs before the adapter instance is constructed, in an owner-specific sibling such as builder/normal_callable_semantic_loan_port/direct_call_handoff.rs. The adapter instance receives only the installed wrapper; it is not the pre-install mapper owner."
raw_port_reborrow = "RawInvocationChildPortV1 receives Option<&mut RawDirectCallDispositionLoanV1> and reborrow() passes self.direct_call_dispositions.as_deref_mut() into recursive child frames. No Clone, Copy, Rc, Arc, RefCell, copied ledger, or per-child loan is permitted."
cataloged_first_cell = "The first future code cell does not depend on SelectedCallable Shadow observation or semantic scratch. It is narrowly limited to same-brand CurrentOwnerStatic/self or unique-sibling exact relations: the named pre-adapter issuer co-seals the relation and issues one Callee, moves that Callee into RawDirectCallDispositionLoanV1, replaces the direct unguarded handoff, and proves take-once/residual-zero. BuiltinGlobal, LocalValue, Extern, and other precedence arms retain parity as transitional rows until each has its own exact issuer; they are not widened into I0 by name or resolver reuse."
direct_payload_delete = "The first Cataloged cell must delete PreparedRawOrdinaryFunctionCompletionV1::Targeted { callee, arguments } as an unguarded direct payload and replace it with an exact-site RawDirectCallDispositionLoanV1 take. Direct Callee handoff count is zero after the cell; resolver invocation, argument descent, Call emission, and residual-loan checks are each exactly one/zero as applicable."
package_rule = "VerifiedNormalCallableSemanticPackageV1 gains no public direct-call map. BridgeReadyPackageOnly removes package-only prepare_install/commit escape without provisioning a loan; CatalogedI0Provision later obtains its non-empty loan from the named raw-preflight owner. Post-install AST scan or ledger target lookup is forbidden."
visibility_rule = "The package bridge is owned by normal_callable_semantic_package/install.rs and re-exported with restricted visibility. Its package-only bundle/token are private, non-Clone/non-Copy, non-destructurable, and expose no AST/source getter. RawDirectCallDispositionLoanV1 is Builder-private and does not appear in the BridgeReadyPackageOnly signature; it is introduced only by CatalogedI0Provision. No public Verified*/Prepared* receipt or second target authority is added."

