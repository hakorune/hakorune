ends = "a total pre-effect disposition: TargetedExistingLoan, BoundedGcPreEffectTargeted (existing affine-loan-external route), KnownNonDirect, TypedReject, ParkedCompatibility, or an explicitly tracked CutoverBlockerOpen old edge immediately before drive_call_arguments_v1"
