[brief]
decision = "Use one explicit aggregate-node row for core/phase2050/run_all.sh with fate ExplicitOnlyAggregate and child_suite phase2050-owner-pack. Normal integration discovery excludes only that exact path; the five child leaves remain normal integration leaves, and direct aggregate execution uses the existing quick runtime plus integration owner-pack."
