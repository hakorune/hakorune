canonical_issuer = "The existing smoke runner's discovery loop issues the leaf list after applying the exact exclusion; no new semantic or runtime executor is introduced."
non_authority = [
  "basename run_all.sh alone",
  "wildcard/filter text",
  "aggregate echo output",
  "leaf runtime result",
  "other phase wrappers inferred by naming",
]
fail_fast = "Missing/duplicate/foreign/absolute aggregate rows, child-suite contamination, exclusion of a leaf, or a phase2050 wrapper invocation count other than one fails before any test effect."
smallest_next_slice = "Add the single aggregate-node data row, load it in the existing discovery helper, skip only the exact phase2050 wrapper in normal integration discovery, and extend the reusable linkage guard."
non_claims = [
  "does not decide the fate of the other eight integration aggregates",
  "does not change quick runtime policy or owner-pack membership",
  "does not claim execution-green from dry-run evidence",
]

[acceptance]
positive = [
  "normal integration dry-run changes 963 to 962",
  "phase2050 paths in normal integration are exactly the five leaves",
  "owner-pack dry-run remains exactly five leaves",
  "phase2050 run_all.sh invokes the owner pack exactly once",
  "legacy same-profile nested suites remain unchanged",
]
