  "RuntimeRetiring",
]
observed = "The dispatcher currently distinguishes root-only Main rejection, App static no-op, non-App static legacy capture, instance method legacy capture, and instance-constructor loose freeze. These are observations, not permission to add a new success route."
owner_ready = "A named runtime owner supplies exact source context plus symbol/physical-arity before body effects; AST/name/params.len() recomputation is not an issuer."
collector_ready = "The runtime child has one named capture/commit owner on the recursive module_port and cannot drain the root outer collector."
constructor_freeze = "The runtime constructor currently reaches loose-instance-input; keep it a negative state until root/runtime callers and a source/shape owner are separated."
retiring = "An explicit route-retirement row owns deletion; this card does not infer retirement from caller counts or a loose freeze."

