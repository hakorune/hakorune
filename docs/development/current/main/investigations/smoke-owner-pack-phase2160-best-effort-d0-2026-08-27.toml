[boundary]
starts = "integration profile phase2160/run_all.sh and its twenty direct child edges"
ends = "a finite fate decision for a side-effecting best-effort aggregate without false green"
includes = [
  "the phase2160 run_all.sh child inventory and exact order",
  "child || true behavior and post-failure status handling",
  "chmod +x side effects and generated/synthetic MIR repair paths",
  "normal discovery versus any future explicit aggregate route",
  "the distinction between a reference best-effort probe and a passing owner pack",
]
excludes = [
  "phase2170 official owner pack already landed",
  "phase2100 role buckets, filter-driven cohorts, pure-legacy, and phase2050",
  "leaf semantic repair, VM/AOT/LLVM behavior, Cargo, or MirBuilder changes",
  "new aggregate fate implementation, broad runner changes, and mass chmod",
]

[brief]
decision = "Select final fate B: retire phase2160/run_all.sh and return the twenty children to explicit leaf owners. Its aggregate is not an exact positive owner pack because every child is best-effort (|| true), some paths chmod files, and registry/builder probes can synthesize a passing MIR after the real route fails."
source_authority = "phase2160/run_all.sh, each checked-in child body, exact nested command edges, and the existing runner's discovery behavior"
canonical_issuer = "Leaf-specific strict/negative owners after a separate census; phase2160/run_all.sh has no canonical issuer and is retired after successor closure."
non_authority = [
  "[PASS] echo text after || true",
  "exit status observed after a swallowed failure",
  "chmod success, synthetic MIR output, and missing-tool SKIP",
  "phase name, run_all basename, quick zero-match, or inherited env",
]
fail_fast = "An implementation remains stopped while child failure is swallowed, synthetic repair can replace the real route, side effects are implicit, or the aggregate fate is not represented by an explicit owner."
smallest_next_slice = "Freeze the twenty-child body-derived inventory, classify each child as strict/negative/ParkedSealed/Retired, census shared repair callers, and record the exact wrapper delete/successor edges before any discovery change."
non_claims = [
  "does not make phase2160 a passing owner pack",
  "does not infer semantics from zero-match or [PASS] output",
  "does not change child scripts, chmod behavior, fallback, or synthetic repair",
  "does not generalize phase2050/phase2170 policy to this cohort",
]

[observed]
run_all = "tools/smokes/v2/profiles/integration/core/phase2160/run_all.sh"
child_count = 20
aggregate_edge = "run_all.sh -> twenty direct children"
child_fate_observation = "all twenty child edges use || true; several registry/builder probes synthesize minimal MIR after route failure"
side_effect_observation = "run_all and/or children chmod non-executable scripts before execution"
status_observation = "some rc values are captured after || true, so a swallowed failure cannot be used as a positive result"
runtime_profile = "integration discovery; execution fate is undecided and must not be silently promoted"

[finite_state]
strict_child = "child returns a meaningful nonzero failure and has no swallowed or synthetic success path"
best_effort_child = "child intentionally continues after a failed probe; result is observation-only"
synthetic_repair_child = "child can emit a minimal MIR/[PASS] after the real path fails; product proof is forbidden"
side_effecting_child = "child or wrapper changes executable bits or other workspace state"
missing_or_unknown = "missing, duplicate, foreign, stale, or unclassified child -> blocker before any owner route"
aggregate_fate_open = "no exact positive owner-pack fate exists until the above states and cleanup policy are decided"

[required_decisions]
selected_fate = "Retire phase2160/run_all.sh after all twenty children have an explicit successor or ParkedSealed/Retired disposition."
fate_options_rejected = [
  "retain a best-effort aggregate as a passing owner pack",
  "force all twenty heterogeneous leaves into one strict pack",
]
forbidden_shortcuts = [
  "accept || true as green",
  "read rc after a swallowed command and call it parity",
  "hide synthetic repair behind a normal owner-pack",
  "make chmod or missing-tool SKIP an implicit success",
]

[acceptance]
positive = [
  "all twenty child paths and nested edges are body-derived and duplicate-free",
  "each child has one explicit finite state and owner/fate, or remains a named blocker",
  "best-effort, synthetic-repair, chmod, and skip behavior are visible in the decision",
  "normal discovery and any future aggregate exclusion are scoped to the exact phase2160/run_all.sh path",
]
negative = [
  "quick zero-match and [PASS] echo are not execution evidence",
  "the twenty children are not admitted to the phase2170 or phase2050 owner packs",
  "no product/LLVM claim is made from a best-effort VM probe",
  "no new aggregate fate or runner implementation is added during this D0",
]
parity = "Compare child membership and fate classification only; runtime parity requires a later strict child row and is out of scope."
guard = "Reuse the existing manifest/pilot guard style only after a fate is selected; do not add twenty per-child guards during census."

[implementation_gate]
permission = false
no_safe_slice = [
  "any child remains || true without an explicit observation-only fate",
  "synthetic MIR repair can produce a passing result for a failed route",
  "workspace chmod side effects are hidden from the contract",
  "normal discovery and explicit aggregate membership are both active without a duplicate policy",
]

