[task_steps]
items = [
  "1. Freeze and author the tracked observation-receipt schema/provenance projection; raw scanner stdout cannot satisfy this precondition.",
  "2. Import exactly the 185 scanner DeadCodeAllowance observations without changing scanner scope or parser code; reject the three observed path/item_key collisions unless the full canonical key differs.",
  "3. Freeze row_kind + path + source byte range + attribute_kind as the canonical key; retain item_key and line range only as consistency fields, and bind the map to scanner/scope/source/evidence hashes.",
  "4. Classify compile_domain and role independently; use explicit registration/owner evidence for mixed, generated, compatibility, guard, test, and runtime sites.",
  "5. Assign owner_ref, successor_status/successor_ref, evidence_refs, and classification-only retirement_status for every row; never invent a successor or retirement outcome.",
  "6. Validate exact receipt/map coverage, provenance, duplicate/foreign detection, tracked references, and unknown-successor rejection. Any missing row keeps this D0 blocking.",
  "7. Close the map as a non-authority input, then reopen CHRONIC-MEASUREMENT-EXPECTATION-I0 to co-seal one TSV and the force receipt.",
]

[acceptance]
positive = [
  "a tracked receipt preserves all 185 scanner DeadCodeAllowance observations under one canonical range/attribute site key, and the map adds explicit owner/role/successor/status evidence",
  "mixed file roles are split at item/range level and generated-included rows remain explicit retained states",
  "provenance hashes bind the receipt and map to the exact scanner/scope/source report, and evidence references resolve to tracked registration/owner artifacts rather than grep-only absence",
  "the map is an input to one future TSV and is not registered as an executable guard or semantic receipt",
]
negative = [
  "no owner inferred from filename, warning count, stale threshold, or file-level mixed label",
  "no missing receipt, partial map, duplicate canonical key, unclassified site, guessed successor, unknown required successor, expectation pin, or deletion",
  "no second Rust parser, force-specific TSV, guard/source edit, or backend/compiler behavior change",
]

