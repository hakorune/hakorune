title = "Chronic measurement site owner map D0"
status = "accepted_design_parked"
observed_commit = "2caa46d8cd"
observed_at = "2026-08-27"
implementation_permission = false
current_execution_row = "CHRONIC-MEASUREMENT-SITE-OWNER-MAP-D0"
parent_row = "docs/development/current/main/investigations/chronic-measurement-reconciliation-d0-2026-08-27.toml"
successor_card = "CHRONIC-MEASUREMENT-EXPECTATION-I0"

[boundary]
starts = "the 185 allowance observations and site events emitted by the landed chronic Rust scanner within the reconciled 1434-file scope"
ends = "one explicit item/range owner map that the future shared expectation TSV can consume without inferring production ownership from filenames or mixed file labels"
includes = [
  "allowance/site key = path + item_key + byte/line range + attribute kind",
  "compile_domain and role for each site, independent of one another",
  "named owner, successor, retirement_status, and evidence reference",
  "generated-included registry rows and compatibility/guard/test-support rows as explicit retained states",
  "unmapped/duplicate/foreign/ambiguous site detection before expectation pinning",
]
excludes = [
  "creating the expectation TSV, changing scanner model/parser code, stale-threshold edits, guard registration, or source/guard deletion",
  "turning a file-level role=mixed or unclassified_count=0 into site-level production evidence",
  "caller-zero inferred from text absence, filename suffixes, allow(dead_code), or old numeric thresholds",
  "force-hv1 route/fate changes, backend behavior, semantic receipts, or a second force-specific manifest",
]

[brief]
decision = "Make site ownership an explicit classification input before expectation pinning. The scanner remains a neutral observation issuer; this map supplies only owner/role/successor evidence for each site and may retain an unresolved site as blocking. It does not issue deletion authority or semantic meaning."
source_authority = "The deterministic scanner report/ranges, module/path/include registrations, existing owner READMEs/cards, generated registry ownership, and explicit compatibility/test/guard evidence."
canonical_issuer = "This D0 owns the reviewed site-map artifact; CHRONIC-MEASUREMENT-EXPECTATION-I0 later co-seals its rows with scanner and force hashes. No consumer may synthesize an owner from a filename or warning count."
non_authority = [
  "file-level compile_domain/role, raw grep/rg totals, filename conventions, stale thresholds, profile declarations, unregistered guards, or local green tests",
  "absence of textual callers without mod/pub use/trait/feature/generated/include/fixture/compatibility analysis",
  "force_hv1 fate/expected_counts, MIR/VM/AOT behavior, or any target/name/string reconstruction",
]
fail_fast = "Every site entering the future TSV must resolve exactly once to an owner, compile_domain, role, successor, and retirement_status. Missing/duplicate/foreign/ambiguous evidence or an unclassified site remains blocking and no partial map is accepted."
smallest_next_slice = "Design-only: freeze the map key/schema, owner evidence sources, retained-state vocabulary, and exact coverage of the 185 observations. Do not create the map or expectation TSV while implementation_permission is false."
non_claims = [
  "does not claim any allowance is dead, stale, production-live, or deletable",
  "does not change scanner scope, force-hv1 fate, guard behavior, compiler/MIR/VM/AOT code, or source files",
  "does not replace the scanner's observation authority or create a second parser",
]

[artifact]
path = "tools/checks/manifests/chronic_measurement_site_owners_v1.toml"
role = "owner-evidence input; not a measurement expectation or executable guard manifest"
schema = "schema_version=1 with one [[sites]] row per scanner site; path/item_key/range/attribute_kind is the unique key"
required_fields = [
  "path",
  "item_key",
  "byte_start",
  "byte_end",
  "line_start",
  "line_end",
  "attribute_kind",
  "compile_domain",
  "role",
  "owner",
  "successor",
  "retirement_status",
  "evidence",
]
allowed_roles = ["runtime", "test_support", "fixture", "compatibility", "guard_evidence", "generated_registry", "mixed"]
allowed_compile_domains = ["production_default", "cfg_test", "feature_nonselected", "generated_included"]
allowed_retirement_status = ["Unknown", "Retain", "RetirementCandidate", "CallerZeroSuccessorReady", "Retired", "ExplicitTombstone"]
coverage_rule = "The map must cover every scanner DeadCodeAllowance observation that enters the future TSV exactly once; non-allowance call/module rows remain scanner-only until an owner explicitly selects them."
evidence_rule = "Evidence names a tracked owner file/section or registration edge; a bare path, warning count, or text-search result is insufficient."

[census]
scanner_scope_files = 1434
scanner_allowance_observations = 185
mixed_role_allowances = "60 observations / 38 files"
generated_registry_allowances = "79 observations in src/mir/compiler/module_registry.in.rs"
unmapped_site_rows = "185 until the map is authored and reviewed"
scope_difference = "all src 4304 files; frozen scope 1434; outside 2870; historical exact 180 frozen + 154 outside; inclusive 185 frozen + 166 outside"

[finite_state]
states = [
  "ObservationMissing",
  "SiteKeyReady",
  "OwnerMapped",
  "RetainedWithEvidence",
  "ReadyForExpectation",
  "DuplicateSite",
  "ForeignSite",
  "MissingOwner",
  "MissingSuccessor",
  "UnclassifiedSite",
  "ScopeDrift",
]
terminal = ["ReadyForExpectation", "RetainedWithEvidence"]
blocking = ["ObservationMissing", "DuplicateSite", "ForeignSite", "MissingOwner", "MissingSuccessor", "UnclassifiedSite", "ScopeDrift"]

[task_steps]
items = [
  "1. Freeze the unique path/item/range/attribute site key and import the 185 scanner observations without changing scanner scope or parser code.",
  "2. Classify compile_domain and role independently; use explicit registration/owner evidence for mixed, generated, compatibility, guard, test, and runtime sites.",
  "3. Assign owner, successor, and retirement_status for every row. Use Retain or Unknown when deletion evidence is absent; never invent a successor.",
  "4. Validate exact coverage, duplicate/foreign detection, and evidence references. Any missing row keeps this D0 blocking.",
  "5. Close the map as a non-authority input, then reopen CHRONIC-MEASUREMENT-EXPECTATION-I0 to co-seal one TSV and the force receipt.",
]

[acceptance]
positive = [
  "all 185 scanner allowance observations have one unique site key and explicit owner/role/successor/status evidence",
  "mixed file roles are split at item/range level and generated-included rows remain explicit retained states",
  "path-level evidence references tracked registration/owner artifacts rather than grep-only absence",
  "the map is an input to one future TSV and is not registered as an executable guard or semantic receipt",
]
negative = [
  "no owner inferred from filename, warning count, stale threshold, or file-level mixed label",
  "no partial map, duplicate key, unclassified site, guessed successor, expectation pin, or deletion",
  "no second Rust parser, force-specific TSV, guard/source edit, or backend/compiler behavior change",
]

[guard]
reuse = "Use the landed chronic scanner report and existing registration/owner artifacts; no new executable guard is added by this D0."
required = "A future validator must reject missing/duplicate/foreign site rows and verify scanner scope/evidence hashes before expectation pinning."
no_safe_slice = [
  "the 185 observations cannot be covered exactly once",
  "owner/successor evidence is unavailable without guessing",
  "role or compile_domain is inferred from filename or file-wide mixed labels",
  "the map becomes a deletion or semantic authority",
]

[worker_receipt]
agent = "chronic_measurement_scope_audit"
status = "accepted_as_next_design_row"
finding = "The 185 allowance observations are all missing site-level owner/successor/status; 60 are in mixed-role files and 79 are generated-registry rows. A separate owner map is the smallest safe precondition for the expectation TSV."
evidence = [
  "tools/checks/rust_source_topology/src/chronic_measurement/model.rs:31-58 reports file/path/range facts but no owner/successor",
  "tools/checks/rust_source_topology/src/chronic_measurement/scan.rs:71-73 counts only file-level unknown domain/role",
  "tools/checks/manifests/chronic_measurement_scope_v1.toml:13-17 assigns builder directory role=mixed",
  "docs/development/current/main/investigations/chronic-measurement-reconciliation-d0-2026-08-27.toml [observed]",
]
latest_finding = "Keep expectation pin and deletion blocked until the site owner map is complete and independently reviewed."

[closeout]
status = "pending"
required = "Record exact 185-row coverage, owner evidence, retained states, and scope/hash validation. Then move the pointer to CHRONIC-MEASUREMENT-EXPECTATION-I0; no expectation TSV or deletion is allowed from this row."
