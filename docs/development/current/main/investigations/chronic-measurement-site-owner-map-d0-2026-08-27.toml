  "force-hv1 route/fate changes, backend behavior, semantic receipts, or a second force-specific manifest",
]

[brief]
decision = "Make site ownership an explicit classification input before expectation pinning. The scanner remains a neutral observation issuer; this map supplies only owner/role/successor evidence for each DeadCodeAllowance site and may retain an unresolved site as blocking. It does not issue deletion authority or semantic meaning."
source_authority = "The deterministic scanner report/ranges, module/path/include registrations, existing owner READMEs/cards, generated registry ownership, and explicit compatibility/test/guard evidence."
canonical_issuer = "This D0 owns the reviewed site-map artifact; its provenance binds scanner_version, scope_id, scope_manifest_hash, source_scope_hash, and evidence_hash. CHRONIC-MEASUREMENT-EXPECTATION-I0 later co-seals these rows with the force receipt. No consumer may synthesize an owner from a filename or warning count."
non_authority = [
  "file-level compile_domain/role, raw grep/rg totals, filename conventions, stale thresholds, profile declarations, unregistered guards, or local green tests",
  "absence of textual callers without mod/pub use/trait/feature/generated/include/fixture/compatibility analysis",
  "force_hv1 fate/expected_counts, MIR/VM/AOT behavior, or any target/name/string reconstruction",
]
fail_fast = "Every site entering the future TSV must resolve exactly once to an owner_ref, compile_domain, role, successor_status, successor_ref, retirement_status, and evidence_refs under the bound scanner/scope/source hashes. Missing/duplicate/foreign/ambiguous evidence, unknown required successor, or an unclassified site remains blocking and no partial map is accepted."
smallest_next_slice = "Design-only closeout: the evidence matrix is complete at 185/185 (A=79, B=46, C=60), while validator-only A0 still proves syntax rather than pinned Git anchors. Freeze CHRONIC-MEASUREMENT-SITE-OWNER-MAP-REFERENCE-A1-D0: normalize the candidate references, resolve revision/path/anchor evidence, and add an independent hash vector before any tracked map authoring. Keep the map, expectation TSV, guard registration, and source deletion closed while implementation_permission is false."
non_claims = [
  "does not claim any allowance is dead, stale, production-live, or deletable",
  "does not change scanner scope, force-hv1 fate, guard behavior, compiler/MIR/VM/AOT code, or source files",
  "does not replace the scanner's observation authority or create a second parser",
]

