fail_fast = "Missing/foreign/mixed identity, owner, session, brand, root, site, or body-kind rejects before package install, body/argument/effect descent, collector mutation, or MIR publication."
smallest_next_slice = "Specify one private root callback, its exact existing caller, and a same-session witness; root-only is the first supported scope and any nested direct-call observation remains the existing forest-wide typed reject."
non_claims = "No target/Callee issuer, package+loan bundle, raw dispatcher, Call schema, Resolved recovery retirement, VM/backend change, or canonical-core route connection."

[boundary]
