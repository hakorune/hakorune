[brief]
decision = "Design the smallest existing-product handoff that makes the normal App Main root raw lineage exact; do not implement the ScriptRoot-to-Cataloged semantic switch in this row."
source_authority = "AppMainCatalogCoSealV1 owns parser identity/catalog key/brand; VerifiedSemanticOwnerForestV1 owns FunctionOwnerId/root/nested structure; RawInvocationSourceTransportV1 owns raw lineage; the installed package/root callback is only the private co-seal consumer."
