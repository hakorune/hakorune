  "existing Main parser identity, catalog key/brand, forest root, nested-owner observation gate, and raw source context",
  "one-shot private callback and same-session/co-brand proof without a public session ID",
  "root-only initial scope and compatibility route separation",
]
excludes = [
  "ScriptRoot or Main(locator) compatibility, ProgramRuntime, selected static children, canonical-core dispatch, target issuance, loan/dispatcher, and argument lowering",
