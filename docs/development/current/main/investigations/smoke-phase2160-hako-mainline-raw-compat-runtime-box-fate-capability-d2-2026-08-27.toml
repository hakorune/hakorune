[brief]
decision = "F/I/H have no named product or reference owner. Retire/Frozen is selected for the phase2160 RawCompatibility route, but only through one private move-only fate capability scoped to that route. Generic RawInvocation must remain usable by SelectedNormal and other owners."
source_authority = "The admitted phase2160 RawCompatibility capture scope is the sole issuer of the route seal; F/I/H entry evidence and test contracts are observations, not target or semantic authority."
canonical_issuer = "A private RawCompatibilityRuntimeBoxFateV1::Retire capability is issued once by the phase2160 capture owner and consumed before any runtime Box effect. It carries no Callee, ValueId, AST, shape, symbol, or lineage."
non_authority = [
  "generic RawInvocation type identity, RawLegacy fallback, SelectedNormal forwarding, caller counts, fixture names, AST/name/arity inference, params.len(), format! symbols, loose freeze, and route rc",
  "RawInvocationRootLineageV1 as a target authority, VM/AOT availability, backend behavior, or a test-only success contract without a named owner",
  "ambient bools, downcasts, Clone/Rc/RefCell capability copies, retry from RawInvocation to RawLegacy, and root I1 reuse",
]
fail_fast = "The phase2160 RawCompatibility capture must arm the capability before runtime Box lowering. Missing, foreign, second, or mixed capability use rejects before prefix/body/capture/collector effects. Generic RawInvocation, SelectedNormal, RawLegacy, and root I1 are unarmed and unchanged."
smallest_next_slice = "Freeze the capability API, lifetime, branch matrix, zero-delta test conversion, and one reusable guard. Do not implement until a fast row explicitly opens the route-scoped capability."
census_boundary = "phase2160 RawCompatibility capture -> runtime Box F/I/H pre-effect fate; includes recursive RawInvocation reborrow and four explicit test contracts; excludes RawLegacy, SelectedNormal, root I1, and all downstream execution."
non_claims = [
  "does not claim language-level runtime Box semantics are removed everywhere",
  "does not authorize a new semantic receipt, source shape issuer, lineage loan, collector transaction, or Call schema change",
  "does not delete the RawLegacy facade, change root Main behavior, or make lexical absence a caller-zero proof",
]

[authority_chain]
capture = "phase2160 RawCompatibility root/capture owner"
capability = "private move-only RawCompatibilityRuntimeBoxFateV1::Retire route seal"
consumer = "RawInvocation child scope consumes the capability only for F/I/H before declaration/prefix/body/capture/collector"
terminal = "typed Retire/Frozen rejection with zero module/function/instruction/metadata/collector delta"
successor_rule = "If a future product/reference owner is proven, open a separate source-shape-lineage-collector design; never repurpose this retirement capability."

[capability_shape]
fields = [
  "private route seal proving phase2160 RawCompatibility ownership",
  "private Retire marker with no payload",
]
required_properties = [
  "move-only; no Clone or Copy",
  "no Rc, Arc, RefCell, Option-as-authority, or child ledger copies",
  "no public package getter, into_parts, or independently callable install path",
  "#[must_use] equivalent lifecycle enforcement and explicit second-take rejection",
]
scope = "with_runtime_box_fate_v1-style closure on the RawCompatibility capture; recursive RawInvocation children receive only a short &mut reborrow and cannot retain it after the scope"
no_safe_slice = [
  "the capability must be stored in a broad ambient Builder field",
  "generic RawInvocation or SelectedNormal must be armed to make the route compile",
  "a child requires Clone/Rc/RefCell or a separate per-child ledger",
  "the capability contains Callee, ValueId, AST, name, arity, symbol, or RawInvocationRootLineageV1",
]

[implementation_api]
issuer_site = "program_root_lowering.rs:321-326 only: the phase2160 RawCompatibility ScriptRuntime arm creates a scoped child; arming the broader 282-294 Compatibility block is forbidden because it would include immediate/deferred root work."
scoped_entry = "with_phase2160_raw_compat_runtime_box_fate_v1(|scoped| scoped.lower_body(...))-style closure. The parent RawInvocationChildPortV1 is not globally armed; the closure owns the route seal for exactly one lowering scope."
scope_shape = "private RuntimeBoxFateScopeV1<'scope> = Unarmed | Phase2160(&'scope mut RawCompatibilityRuntimeBoxFateV1). The Phase2160 variant is the only state that can reach F/I/H; it is reborrowed for a shorter recursive child scope without a third lifetime on RawInvocationChildPortV1."
fate_shape = "private RawCompatibilityRuntimeBoxFateV1 { state: Armed | Consumed }, #[must_use]-equivalent, move-only, no Clone/Copy/into_parts/getter. Retire is a zero-payload marker."
reborrow = "RawInvocationChildPortV1::reborrow() carries the scoped fate as a short &mut borrow when armed and remains Unarmed otherwise; no Rc/Arc/RefCell, copy, or child ledger is introduced."
f_consumption = "nonmain_static_box_lifecycle.rs:43-47: preserve App no-op, then consume Retire immediately before register_user_box and before method/body descent."
i_h_consumption = "raw_expression_dispatch/mod.rs:511-523 dispatches the instance branch into a fate check before lower_raw_with_port_v1; this check precedes register_user_box_declared_fields, metadata, prefix mutation, constructors, methods, and body/capture/collector effects."
no_capability_consumption = "sync/Main A/B, App E, and empty K keep their existing terminals and do not issue or consume the capability."
test_sibling = "Move the four existing success-contract tests to a sibling runtime_box_fate_tests.rs behavior-neutrally before converting them to typed negatives; module_lowering_invocation_reentrant_tests.rs is 761 lines and must not receive new semantic code."

[delta_snapshot]
definition = "Zero-delta is measured from a snapshot taken immediately before the F/I/H fate check, not from an absolute-empty module. Earlier RawCompatibility statements may already have produced root instructions or metadata."
observables = [
  "ModuleLoweringPortV1 header symbol/function count",
  "current module function/block/instruction counts",
  "comp_ctx user-box/declaration/metadata state",
  "pending child and outer collector rows",
]
retire_result = "Every observable equals the pre-check snapshot after typed Retire/Frozen; no child/body/capture/commit/prefix/metadata/collector/module delta is allowed."
auxiliary = "Dedicated one-Box tests may additionally assert absolute zero, but that is supplemental and cannot replace the pre-check snapshot contract."

[finite_state]
states = [
  "UnarmedNonCompatibility",
  "CompatibilityFateArmed",
  "FateConsumed",
  "RetiredBeforeEffects",
  "MissingCapabilityReject",
  "ForeignCapabilityReject",
  "SecondTakeReject",
  "MixedCapabilityReject",
  "SelectedNormalNoInheritance",
  "RawLegacyNoInheritance",
]
meaning = "Only the phase2160 RawCompatibility capture can move Unarmed to CompatibilityFateArmed. F/I/H consume exactly once and terminate before effects. All other owners remain unarmed; invalid scope or reuse is a typed reject."

[branch_policy]
a_sync_reject = "Retain the existing typed sync rejection; no fate capability is needed."
b_nested_main = "Retain root-only rejection; do not arm F/I/H fate for nested Main."
e_app_noop = "Retain the existing App no-op and existing owner; no runtime Box capability inheritance."
f_static_nonapp = "Consume Retire before register_user_box or body descent; no child, outer, symbol, or collector publication."
i_instance_ctor_zero = "Consume Retire before declaration/metadata/body; no constructor or method child publication."
h_instance_with_constructors = "Consume Retire before prefix mutation; no prefix, constructor, method, metadata, or collector publication."
k_empty_box = "Retain existing empty completion owner; no capability is issued or copied."
cross_route = "RawInvocation cannot retry through RawLegacy, and RawLegacy cannot borrow the phase2160 capability."

