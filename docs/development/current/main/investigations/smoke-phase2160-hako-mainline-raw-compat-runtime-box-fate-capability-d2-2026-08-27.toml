phase = "implementation-row only; do not register or run as a green implementation claim during D2"
contract = "Parse the phase2160 capture arm and F/I/H function intervals, prove issuer=1 at program_root_lowering.rs:321-326, verify typed Unarmed/Phase2160 reborrow and no forbidden capability payload, check F after App-before-register and I/H before prefix, reject adapter/RawLegacy/SelectedNormal/root-I1 inheritance, and assert the four retired tests are explicit typed negatives with snapshot zero-delta."
