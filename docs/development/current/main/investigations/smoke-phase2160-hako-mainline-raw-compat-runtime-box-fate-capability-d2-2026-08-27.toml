[zero_delta]
before_fate = "No register_user_box, declared-field registration, prefix mutation, function/block/instruction insertion, metadata update, source capture, child commit, outer collector drain, or module publication."
after_fate = "The typed Retire/Frozen result is the only observable outcome; residual child/module/function/collector state is empty and root I1/RawLegacy parity is unchanged."
parity = "Existing phase2160 Main-only smoke, root I1, RawLegacy C/G/J, SelectedNormal, sync/Main/missing-mode, App no-op, and empty K behavior remain byte-for-byte on their existing owners."

