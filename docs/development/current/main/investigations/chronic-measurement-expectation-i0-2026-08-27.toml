[task_steps]
items = [
  "1. Reconcile the scanner's 1434-file/185-allowance finite scope with the older 334/351 all-src diagnostics; if the boundary changes, reopen a scope D0 instead of changing an expectation in place.",
  "2. Produce and track one observation receipt with deterministic 185-row canonical keys, source/scope/scanner/evidence hashes, before authoring owner-map or TSV rows.",
  "3. Freeze the union TSV header, row_kind grammar, owner/successor fields, and canonical force/observation receipt projections; reject duplicate/unknown columns and mixed summary/site rows.",
  "4. Produce one summary row plus deterministic site rows from the bound observation receipt, owner map, and body-derived force manifest. Pin source, scope, scanner, owner-map, observation, force receipt, and evidence hashes only after reconciliation.",
  "5. Extend only the existing force-hv1 lifecycle consumer seam to validate the exact TSV and legacy/support non-growth fields. It must not re-scan, reclassify, retry, or change force fate.",
  "6. Add focused positive/negative evidence for missing/duplicate/foreign owner, missing/drifted observation receipt, scope/hash drift, unclassified rows, force receipt drift, legacy growth, and support-only growth. No source or guard deletion in this row.",
  "7. Close the expectation row, then open ASTCLEAN-STALE-GUARD-SUPERSEDE-R0. Only that successor may classify old numeric guards for tombstone or successor-backed retirement; this TSV never issues those outcomes.",
]

[acceptance]
positive = [
  "exactly one shared TSV is produced with deterministic header, rows, bound observation/owner-map scope/scanner/source/force hashes, and unclassified_count=0",
  "the historical 334/351 values are either explicitly reconciled to the finite boundary or remain diagnostics; no denominator is silently swapped",
  "force-hv1 body facts are consumed by exact receipt id/hash and mismatch fails before route/test effects",
  "legacy production growth fails while support-only growth is reported as a distinct terminal state",
  "site rows have canonical range/attribute identity plus explicit owner_ref, role, compile_domain, successor status/ref, evidence_refs, and classification-only retirement_status; caller-zero is never inferred from text count",
]
negative = [
  "no untracked observation report, second force-specific TSV, per-file guard, Rust parser, source deletion, warning cleanup, or stale-threshold relaxation",
  "no expectation value edited together with its acceptance proof to manufacture green",
  "no force-hv1 fallback/retry/reclassification or compiler/MIR/VM/AOT behavior change",
  "no 185/334/351 number is presented as production-live or deletion-ready without owner and successor evidence",
]

[guard]
reuse = "Reuse the existing force-hv1-caller-lifecycle row and lifecycle owner; the TSV is a data artifact, not a new executable guard row."
required = "The expectation consumer must be fail-closed, exact-hash based, and independently reviewable. A green scanner report alone never opens stale-guard or source-retirement work."
no_safe_slice = [
  "the finite scanner boundary cannot be reconciled with the prior all-src diagnostics",
  "the existing force manifest cannot issue a deterministic body-derived receipt hash without including fate/expected-value authority",
  "the lifecycle guard would need a second parser, route retry, or fate reclassification",
  "summary/site rows cannot be validated as one fixed union schema",
  "owner/successor/caller-zero evidence is missing for a proposed deletion",
  "the 185-row observation receipt is missing, unbound, or not reproducible from the scanner schema",
]

[closeout]
status = "pending"
required = "First close CHRONIC-MEASUREMENT-RECONCILIATION-D0 with explicit scope/owner/revision evidence. Then record the one TSV path/header, exact scanner/force receipt hashes, validator tests, and existing lifecycle guard result. Only after that move the pointer to ASTCLEAN-STALE-GUARD-SUPERSEDE-R0; do not delete source or guards from this row."
next_row = "CHRONIC-MEASUREMENT-RECONCILIATION-D0"

[reconciliation_gate]
status = "blocking_precondition"
required = [
  "a tracked 185-row observation receipt with canonical keys, raw_condition, receipt_hash, and scanner/scope/source/evidence provenance exists before any owner-map or TSV row",
  "the single receipt consumer verifies the frozen scope hashes, receipt hash, source revision, canonical order, and non-empty ranges without rescanning or reimplementing hash semantics",
  "site-level owner and role classification for every allowance/site that would enter the TSV, supplied by CHRONIC-MEASUREMENT-SITE-OWNER-MAP-D0",
  "site-owner map canonical key, provenance hashes, tracked-reference grammar, and classification-only retirement vocabulary are frozen before TSV rows are authored",
  "path-level inclusion/exclusion table explaining the 185 frozen-scope observations versus 334/351 all-src diagnostics",
  "separate scanner observation revision, force manifest source revision, and TSV measurement source revision",
  "canonical force receipt projection that excludes fate_review and expected_counts",
  "existing lifecycle consumer responsibility fixed without a second parser or force-specific guard",
]
