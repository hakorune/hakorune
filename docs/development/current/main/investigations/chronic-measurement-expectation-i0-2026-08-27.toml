[consumer]
owner = "tools/checks/lib/force_hv1_caller_manifest_guard.py"
mode = "receipt consumer only; it may verify exact TSV scope/scanner/force hashes and ratchet fields but may not re-scan Rust or change fate"
registration = "reuse the existing force-hv1-caller-lifecycle guard row; no new per-metric or force-specific guard row"
allowed_effect = "a mismatch returns typed/current-change failure before route/test effects; no retry, fallback, or reclassification"

