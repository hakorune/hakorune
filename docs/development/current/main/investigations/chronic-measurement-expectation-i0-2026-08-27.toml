[boundary]
starts = "the tracked chronic measurement observation receipt, the frozen scope manifest, and the body-derived force-hv1 leaf receipt"
ends = "one scope-labeled expectation TSV whose hashes, summary rows, site rows, and owner classifications are consumed by the existing force-hv1 lifecycle guard"
includes = [
  "the exact scope manifest and scanner report hashes from CHRONIC-RUST-TOKEN-SCANNER-I0",
  "the tracked 185-row observation receipt and its canonical site-key/provenance hash",
  "the body-derived force-hv1 leaf manifest and a deterministic receipt id/hash for its observed facts",
  "legacy production versus support source/dead_code rows with explicit compile_domain and role",
  "panic/unwrap/expect/todo summary and per-site observation rows from the scanner",
  "one fail-closed validator/consumer seam in the existing force-hv1 lifecycle owner",
]
excludes = [
  "source, guard, allow, or stale-threshold deletion; warning cleanup; compiler/MIR/VM/AOT behavior; and force-hv1 fate changes",
  "a second force-specific TSV, a second Rust parser, a semantic Verified/Prepared receipt, or a global src non-growth claim",
  "copying the historical 334/351 all-src diagnostic into this finite scope without reconciliation",
  "treating a pinned count, profile declaration, or local green test as caller-zero or retirement permission",
]

[brief]
decision = "Co-seal exactly one expectation TSV from the landed token scanner and the existing body-derived force-hv1 receipt. The artifact records observations and owner classifications only; it never issues target, route, semantic, or retirement authority. Keep the current lifecycle guard as the sole execution consumer and fail closed on any hash/scope/row drift."
source_authority = "The tracked chronic scope manifest, the scanner-issued tracked observation receipt, the checked-in force-hv1 body-derived manifest, and explicit owner-reviewed legacy/support classifications."
canonical_issuer = "CHRONIC-RUST-TOKEN-SCANNER-I0 issues lexical observations; CHRONIC-MEASUREMENT-SITE-OWNER-MAP-D0 issues only the reviewed owner/classification rows after the observation receipt is bound; the CHRONIC-MEASUREMENT-EXPECTATION-I0 owner co-seals the TSV and receipt hash; force_hv1_caller_manifest_guard.py consumes that exact receipt but does not re-scan or reclassify it."
non_authority = [
  "raw rg/grep totals, old ASTCLEAN thresholds, total src LOC, filename prefixes, profile names, expected values edited in the same commit, or a hand-written card",
  "the force-hv1 fate disposition, route selector, Rust VM/AOT behavior, or any target/name/string reconstruction",
  "the scanner's 185 in-scope allowance count treated as the historical 334/351 all-src baseline without an explicit scope reconciliation",
]
fail_fast = "Missing/duplicate observation receipt or TSV rows, missing owner/successor, source/scope/scanner/force/owner-map receipt hash drift, unclassified observations, legacy/support scope mixing, stale force receipt, or a validator that accepts a partial report must fail before any stale-guard or source-retirement decision."
smallest_next_slice = "NoSafeSlice until CHRONIC-MEASUREMENT-SITE-OWNER-MAP-D0 supplies a strict receipt consumer (schema/hash/frozen-scope/non-empty-range validation) and then a tracked 185-row owner map with canonical range/attribute keys, provenance/ref grammar, classification-only states, and exact owner evidence alongside the reconciled 185-versus-334/351 boundary. Only then freeze the TSV union schema and consumer seam; do not create the TSV or edit code while implementation_permission is false."
non_claims = [
  "does not claim the observed counts are production-live, stale, or deletable",
  "does not authorize ASTCLEAN threshold supersession, dead_code removal, panic cleanup, guard removal, or phase2160 reduction",
  "does not add a force-specific measurement owner or let force-hv1 fate change on measurement mismatch",
]

[artifact]
path = "tools/checks/manifests/chronic_measurement_expectations_v1.tsv"
role = "one shared measurement artifact; not semantic or retirement authority"
format = "UTF-8 TSV with one fixed union header; row_kind distinguishes summary from site rows and no second file is permitted"
row_kinds = ["summary", "call_site", "dead_code_allowance", "module_edge", "opaque_macro"]
required_columns = [
  "source_commit",
  "observation_receipt_id",
  "observation_receipt_hash",
  "scope_id",
  "scope_manifest_hash",
  "source_scope_hash",
  "scanner_version",
  "scanner_evidence_hash",
  "site_owner_map_id",
  "site_owner_map_hash",
  "boundary_start",
  "boundary_end",
  "force_hv1_receipt_id",
  "force_hv1_receipt_hash",
  "legacy_src_lines",
  "legacy_allow_dead_code",
  "support_src_lines",
  "support_allow_dead_code",
  "panic_count",
  "unwrap_count",
  "expect_count",
  "todo_count",
  "unclassified_count",
  "status",
  "evidence_hash",
]
site_columns = [
  "row_kind",
  "path",
  "item_key",
  "byte_start",
  "byte_end",
  "line_start",
  "line_end",
  "attribute_kind",
  "compile_domain",
  "role",
  "owner_ref",
  "metric",
  "successor_status",
  "successor_ref",
  "retirement_status",
  "evidence_refs",
]
site_key_rule = "Each site row's canonical key is row_kind + path + byte_start + byte_end + attribute_kind; item_key and line_start/line_end are retained consistency fields. Duplicate canonical keys, range drift, or attribute drift fail closed."
owner_map_rule = "site_owner_map_id/hash bind every owner_ref, successor_status/successor_ref, retirement_status, and evidence_refs field to the amended owner-map artifact; owner-map statuses are classification-only Unknown/Retain/Candidate."
union_header_rule = "The header contains row_kind plus every required/site column exactly once; summary rows leave site-only cells empty and site rows leave summary-only cells empty. Unknown columns, duplicate headers, mixed row shapes, missing range/attribute identity, and unbound owner-map provenance fail closed."
force_receipt_rule = "force_hv1_receipt_id names the existing body-derived manifest plus source revision; force_hv1_receipt_hash is SHA-256 over a canonical JSON projection of schema, source_commit, leaf_paths, observations, and observed_counts sorted by key. Fate_review/expected_counts are not semantic source facts and are excluded from the receipt."
tracked_reference_rule = "owner_ref/evidence_refs use <tracked-path>#<stable-anchor>@<revision>; successor_status=required requires successor_ref in the same form, while successor_status=not_required requires none_required and unknown is blocking."

