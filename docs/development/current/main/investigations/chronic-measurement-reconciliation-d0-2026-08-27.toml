[force_receipt_projection]
owner = "existing force-hv1 body-derived manifest owner"
id_rule = "force-hv1-caller-disposition-manifest-v1:<force_manifest_source_revision>"
include = ["schema", "version", "source_commit", "leaf_paths", "observations", "observed_counts"]
exclude = ["fate_review", "expected_counts", "task_order", "acceptance", "no_safe_slice"]
encoding = "canonical JSON with sorted object keys, stable leaf/observation order, compact separators, then SHA-256"
status = "projection frozen in design; receipt hash not yet issued or consumed"

[consumer_boundary]
owner = "tools/checks/lib/force_hv1_caller_manifest_guard.py"
role = "future exact receipt consumer only; no Rust re-scan, site reclassification, route retry, fallback, or fate mutation"
registration = "reuse the existing force-hv1-caller-lifecycle row; no new per-metric or force-specific guard row"
precondition = "reconciliation complete and expectation TSV exists with exact scope/scanner/force hashes"

[finite_state]
states = [
  "ScopeObserved",
  "ScopeDifferenceMapped",
  "SiteOwnersMapped",
  "RevisionRolesSeparated",
  "ForceProjectionReady",
  "ReconciliationComplete",
  "ScopeMismatch",
  "MissingOwner",
  "UnclassifiedSite",
  "RevisionConflation",
  "ProjectionIncludesFate",
]
terminal = ["ReconciliationComplete"]
blocking = [
  "ScopeMismatch",
  "MissingOwner",
  "UnclassifiedSite",
  "RevisionConflation",
  "ProjectionIncludesFate",
]

[task_steps]
items = [
  "1. Freeze the observed 4304/1434/2870 and 180+154 / 185+166 split, then record the path-level difference table against the historical 334/351 diagnostics.",
  "2. Open CHRONIC-MEASUREMENT-SITE-OWNER-MAP-D0 and map each of the 185 allowance observations to item/range owner, compile_domain, role, successor, and retirement_status. Mixed file labels are not sufficient.",
  "3. Separate scanner observation revision, current tree revision, force manifest source revision, and future measurement source revision; reject implicit `source_commit` reuse.",
  "4. Freeze the canonical force receipt projection over body-derived facts only, excluding fate_review and expected_counts; do not issue the hash until the projection is independently reviewable.",
  "5. Confirm the existing force-hv1 lifecycle guard can consume the exact future TSV receipt without a second parser or reclassification. If not, return to design stop rather than patching around it.",
  "6. Close this D0 with a complete reconciliation receipt, then reopen CHRONIC-MEASUREMENT-EXPECTATION-I0 implementation design. No TSV, guard edit, stale-threshold change, or deletion belongs here.",
]

