[boundary]
starts = "the landed chronic scanner report, its tracked scope manifest, the older all-src diagnostic tuple, and the body-derived force-hv1 manifest"
ends = "an explicit reconciliation receipt that names the finite measurement boundary, maps each included observation to an owner/role, separates source revisions, and freezes the canonical force receipt projection; no TSV or deletion is issued here"
includes = [
  "the 1434-file scanner root set and its 185 dead_code allowance observations",
  "the path-level difference between the frozen scope and the older 334/351 all-src diagnostics",
  "site-level compile_domain, role, owner, successor, and retirement_status inputs for every future TSV row",
  "scanner implementation/report revision, current tree revision, force manifest source revision, and measurement source revision as separate fields",
  "the canonical JSON projection used later to hash body-derived force facts",
]
excludes = [
  "creating or pinning chronic_measurement_expectations_v1.tsv, changing guard code, stale-threshold supersession, or source/guard deletion",
  "treating file-level role=mixed or unclassified_count=0 as proof that each site is legacy/support classified",
  "using old 334/351 values as a baseline without a path-level inclusion/exclusion explanation",
  "including force fate_review/expected_counts, route selection, compiler/MIR/VM/AOT behavior, or semantic receipts in measurement authority",
]

[brief]
decision = "Split reconciliation from expectation pinning. The scanner's file-level compile_domain/role fields are neutral observations, but they do not classify the 185 allowance sites into legacy production versus support. Before any TSV exists, produce a path-level difference table, explicit site owners, separate source revisions, and a force receipt projection. If the boundary cannot be reconciled, reopen the scope D0 instead of pinning a convenient number."
source_authority = "The tracked chronic scope manifest, deterministic scanner JSON/hash, older diagnostic inventories as labeled observations, the checked-in force-hv1 body-derived manifest, and owner-reviewed classification inputs."
canonical_issuer = "This D0 issues only the reconciliation boundary and finite readiness state. CHRONIC-MEASUREMENT-TOKEN-SCANNER-I0 remains the lexical observer; CHRONIC-MEASUREMENT-EXPECTATION-I0 later co-seals the TSV; force_hv1_caller_manifest_guard.py remains a receipt consumer."
non_authority = [
  "file-level role=mixed, unclassified_count=0, raw grep totals, total src LOC, filename conventions, stale thresholds, profile names, or a card edited with its proof",
  "the force-hv1 fate disposition, expected_counts, route selector, backend behavior, or any textual caller count",
  "scanner report commit or force manifest source_commit used implicitly as the measurement source revision",
]
fail_fast = "Missing path-difference evidence, an allowance without an explicit owner/role, conflated source revisions, a force projection that includes fate authority, or a scope expansion without a new D0 remains blocking. No expectation or deletion may proceed from an unresolved reconciliation."
smallest_next_slice = "NoSafeSlice until a site-owner map supplies item/range owner, role, successor, and retirement_status for every future row. The next design card must also freeze the finite scope difference, three revision roles, and force receipt projection; do not create the TSV or modify code."
non_claims = [
  "does not claim 185, 334, or 351 is production-live, stale, or deletable",
  "does not authorize guard/source removal, ASTCLEAN supersession, panic cleanup, or force-hv1 fate changes",
  "does not add a second scanner, force-specific TSV, semantic receipt, or runtime fallback",
]

