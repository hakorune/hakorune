[precedence_decision]
name = "D1B-ROW-B-PRE-EFFECT-TARGET-PRECEDENCE-D0"
status = "accepted_decision_with_remaining_row_blockers"
order = [
  "BuiltinGlobal",
  "CurrentOwnerStatic(same-brand, exact owner/name/arity)",
  "LocalValue",
  "Extern",
  "UniqueOtherStatic(same-brand, exact name/arity)",
  "TypedReject",
]
source_rule = "CurrentOwnerStatic requires RawInvocationRootLineageV1::Cataloged caller owner plus catalog.declaration_for(StaticBoxMethod, owner, name, arity); UniqueOtherStatic reuses BareStaticRecoveryDecisionV1 only after LocalValue and Extern absence."
positive = [
  "builtin + same-name local/catalog -> BuiltinGlobal",
  "current-owner exact + same-name local -> qualified current-owner Global",
  "no current-owner exact + local + unique other-owner static -> LocalValue",
  "local env.* + Extern spelling -> LocalValue; no local -> Extern",
  "no local/Extern + unique static -> qualified Global",
]
negative = [
  "foreign/missing brand or caller lineage -> pre-effect typed reject",
  "current-owner method family with no exact arity -> no local/unique fallback",
  "ambiguous or arity-overflow unique static -> typed reject; no retry",
]
parity = "Preserve builtin > current-static > local > Extern > unique-static semantics; only valid current-static representation changes from Method(None) to qualified Global."
collision_zero_claim = "not accepted; existing source facts do not prove zero and method_resolution.rs:126-154 contains a real static/local collision."

