implementation_permission = false

[boundary]
starts = "function_call_preflight_route::Ordinary / Builder call target selection"
ends = "Builder physical Call publication after resolver, recovery, and name-Const paths"
includes = [
  "src/mir/builder/calls/method_resolution.rs:31-55",
  "src/mir/builder/calls/unified_emitter.rs:409-463",
  "src/mir/builder/calls/build.rs:104,307-364",
