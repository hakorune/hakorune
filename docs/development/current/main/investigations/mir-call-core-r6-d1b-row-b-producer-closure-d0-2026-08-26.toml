[brief]
decision = "The two Builder Method(None) producer literals are an exhausted syntactic census, but Row B semantic closure is NoSafeSlice until exact catalog provenance and pre-effect precedence are supplied."
source_authority = "same-brand declaration/source catalog -> CanonicalSameModuleCallableKeyV1 -> mir_symbol_projection()"
canonical_issuer = "qualified CallTarget::Global(owner.method/arity) -> CalleeResolverBox -> MirInstruction::call"
non_authority = [
  "current_static_box and hardcoded has_method",
  "StaticMethodId parsing, methodize env/trace, variable/name/Const text",
  "tail/module lookup, registry, receiver autoscan, args[0] recovery",
]
fail_fast = "owner/method/arity/brand and local-shadow precedence must settle before build.rs argument descent, child effects, name Const allocation, block insertion, or physical publication"
smallest_next_slice = "Design-only census of the two producers' exact input provenance, precedence, RuntimeData Global cohort, and post-argument recovery delete set; no code or guard expansion yet."
non_claims = [
  "the two literal sites alone prove caller-zero or semantic closure",
  "D1C1 bare FunctionCall target claim",
  "Builder-external Method(None) or ingress/runtime retirement",
  "fallback removal, backend activation, warning cleanup, or schema cutover",
]

[census]
syntactic_producer_count = 2
syntactic_producers = [
  "method_resolution_static_none",
  "unified_emitter_methodize_none",
]
semantic_delete_boundary = [
  "build.rs post-argument unique-static recovery and direct publication",
  "build.rs target-name Const construction for this route",
  "static_resolution.rs tail/suffix alternate-target routes",
  "materializer.rs:41-119 Global recovery/materialization edge",
]
outside_blockers = [
  "JSON-v0 Method(None) ingress",
  "core_bridge Const/singleton methodize reissuers",
  "Rust VM and selected native terminal recovery",
]

[finite_state]
exact_catalog_static = "same-brand owner/method/exact arity -> preserve qualified Global"
exact_receiver = "exact source/resolver receiver -> preserve Method(Some)"
hardcoded_static_probe = "current_static_box + has_method without catalog key -> CutoverBlockerOpen; never publish Method(None)"
local_shadow = "same-name local callable -> preserve Value precedence; deletion must not reorder this branch"
catalog_absent = "absent/foreign/ambiguous/arity mismatch -> typed reject before argument effects"
runtime_data_global = "incoming qualified Global without provenance -> cohort census required; methodize mutation cannot be deleted by guess"
methodize_profile = "unset/0/1 -> canonical target and result parity; profile projection remains separate authority"
outside_builder = "Builder-external Method(None) -> retain as D1B blocker, not this row's closure"

[reaudit_2026_08_26]
decision = "NoSafeSlice remains after the formatter-only cleanup commit; no implementation or guard expansion is authorized."
head = "2e95a9fd02"
worktree = "clean after style-only commit; pointer and Call corridor guards green"
same_brand_product = "Normal package install co-seals the same-brand catalog (normal_callable_semantic_package/install.rs:308-316,388-405), but raw FunctionCall preflight has no existing transport for the brand and exact target."
normal_direct_target = "ResolvedDirectCallTargetV1 is unavailable on this normal source path because the source package is built without a callable index (normal_callable_semantic_source.rs:142-169,203-215,499-504)."
preflight_gap = "function_call_preflight_route.rs:14-42,103-203 and raw_expression_dispatch/mod.rs:341-353 reach build.rs:103-116 without an exact target product before drive_call_arguments_v1."
required_design_amendment = "Decide whether an existing same-brand token can be lent into the raw scope and retained by the existing preflight owner; do not mint a new Verified/Prepared semantic receipt before that authority decision."

[shadow_order]
status = "CutoverBlockerOpen"
observed_order = "builtin Global > hardcoded static Method(None) > local Value > Extern"
evidence = "method_resolution.rs:26-65,126-154; current collision test preserves static-over-local"
required_decision = "Choose and test one total order for builtin, local Value, exact catalog static, Extern, and reject; alternatively prove the collision cohort is zero."
non_authority = "resolver shadow observation currently records non-Brand FunctionCall without a lexical shadow fact; it cannot justify a precedence change."

[runtime_data_global]
status = "CutoverBlockerOpen"
authority_gap = "CallTarget::Global(String) and resolver.rs:67-74 erase catalog provenance before unified_emitter.rs:409-463 methodize classification."
producer_families = [
  "build/static_resolution",
  "rewrite/known.rs",
  "stmts/print_stmt.rs",
  "ops/{arithmetic,comparison,unary}.rs",
  "control_flow/plan/lowerer/{emission_port,effect_emission}.rs",
  "calls/method_call_terminal.rs",
  "calls/emit.rs",
]
required_disposition = "Inventory each family as preserve-qualified-Global, typed-reject, or outside Row B; do not delete methodize mutation by String/name inference."

[recovery_disposition]
status = "CutoverBlockerOpen"
materializer = "src/mir/builder/calls/materializer.rs:41-119"
finding = "Global resolver is currently total, so the Err-side Global recovery is structurally unreachable but remains an old edge in the delete census."
next_decision = "Mark the edge RetainGuarded with a reopen trigger or include it in the finite delete set; either choice must be documented before fast."

[acceptance]
required_before_fast = [
  "exact catalog/owner handoff is available before build.rs argument descent",
  "local Value, builtin Global, Extern, and static catalog precedence is total and tested",
  "RuntimeData qualified-Global provenance cohort is finite and its caller disposition is named",
  "post-argument recovery, name Const, tail/suffix retry, and direct publication delete set is complete",
  "methodize unset/0/1 positive parity and missing/ambiguous/foreign/arity negative pre-effect rejection are available",
  "guard is function-window scoped and does not global-grep JSON compatibility or non-Callee receiver fields",
  "dirty build.rs overlap is resolved before implementation permission (observed clean at 2e95a9fd02)",
  "the re-audit transport, shadow, RuntimeData Global, and materializer dispositions are accepted in this design card",
]
positive = [
  "exact static catalog -> same qualified Global symbol, args, dst, effects, and result",
  "instance Method(Some), local Value, builtin Global, and Extern precedence unchanged",
]
negative = [
  "hardcoded Method(None) publication = 0 for the selected Builder window",
  "absent/ambiguous/foreign/arity mismatch rejects before child effect/name Const/block publication",
  "tail/name/module/registry/receiver/args[0] retry = 0 inside the closed boundary",
]
parity = ["methodize unset vs 0 vs 1", "static/instance/local/builtin/extern target and result behavior"]
guard = "extend only a scoped existing corridor guard after the row is fast; no 760-line guard growth and no global receiver/Method(None) grep"

[reopen]
triggers = [
  "same-brand catalog product is issued before argument descent",
  "local-shadow and RuntimeData Global cohorts gain exact owner evidence",
  "a new Builder producer/recovery caller appears",
  "D1B ingress or selected terminal disposition changes",
]
