title = "MIR Call D1B direct-call source inventory co-seal design"
status = "accepted_design_no_safe_slice"
observed_commit = "f659d3f941"
observed_at = "2026-08-26"
implementation_permission = false
parent_row = "docs/development/current/main/investigations/mir-call-d1b-toplevel-direct-target-index-handoff-d0-2026-08-26.toml"
decision_id = "MIR-CALL-D1B-DIRECT-CALL-SOURCE-INVENTORY-COSEAL-D0"
safety_child = "docs/development/current/main/investigations/mir-call-d1b-index-none-direct-calls-failfast-d0-2026-08-26.toml"
observation_child = "docs/development/current/main/investigations/mir-call-d1b-call-observation-profile-d0-2026-08-26.toml"
safety_i0 = "docs/development/current/main/investigations/mir-call-d1b-index-none-direct-calls-failfast-i0-2026-08-26.toml"
decision = "Before a general identity-only callable index can exist, the same resolver session must issue a complete owner-qualified direct-call source inventory. An observed FunctionCall may become Targeted, KnownNonDirect, TypedReject, or Parked, but it may not disappear when callable_index is absent or when SelectedCallable traversal is closed."

[boundary]
starts = "selected normal-source and InstanceConstructor source bodies entering the same resolver/semantic-package session"
ends = "complete owner/site direct-call inventory and finite disposition co-sealed before package publication, body lowering, argument effects, or Call publication"
includes = [
  "SelectedCallable traversal and canonicalize_draft direct-call accounting",
  "callable_index=None with non-empty direct_calls as an explicit typed failure",
  "RawInvocationRootLineageV1 preservation for Cataloged, TopLevel, and InstanceConstructor",
  "owner-qualified SourceExprSiteV1 inventory and same-session constructor forest/root relation",
  "duplicate, missing, foreign, and ambiguous direct-call site disposition",
]
excludes = [
  "target synthesis from name, arity, physical_symbol, constructor symbol, box name, or collector order",
  "general callable-index representation or ResolvedDirectCallTargetV1 issuance",
  "Method(None), methodize, CalleeGuard, UnknownBox, JSON ingress, Call schema, VM/native, and warning cleanup",
  "RawCompatibility, special-form implementation, and existing exact-i64 index generalization",
]

[brief]
decision = "Direct-call inventory is a prerequisite to the parent identity-index handoff. The inventory owner is the existing semantic package/resolver issuer; it records source identity and disposition only, and never reconstructs a Callee. A closed traversal or an empty callable index must not silently drop an observed FunctionCall."
source_authority = "parser/source identity plus the same-brand source catalog and resolver compilation session; RawInvocationRootLineageV1 is provenance and remains intact until disposition"
canonical_issuer = "the existing normal semantic package issuer and its same-session resolver continuation co-seal an owner-qualified direct-call inventory before package publication"
non_authority = [
  "SelectedCallable rejection by itself",
  "callable_index=None -> empty map",
  "NormalTopLevelFunctionDraftAdmissionV1 physical_symbol/arity",
  "source name/arity formatting, collector last-wins, physical symbol lookup, or a second resolver continuation",
]
fail_fast = "If a FunctionCall is observed but cannot be assigned an owner-qualified disposition in the same resolver session, abort the unpublished package before install, body lowering, argument descent/effects, block mutation, or Call publication."
smallest_next_slice = "Design-only inventory matrix for SelectedNormal self/sibling, InstanceConstructor, known non-direct forms, missing/foreign/ambiguous sites, and the index-none-with-calls failure. No code, fixture, receipt, or production switch."
non_claims = [
  "the inventory does not issue a target or generalize the exact-i64 index",
  "lineage preservation does not authorize Global synthesis from names or arity",
  "no post-argument recovery deletion or mandatory-Callee cutover",
]

[observed]
selected_traversal = "SelectedCallableV1 rejects ordinary FunctionCall before child traversal in src/mir/resolved_semantics/shadow/traversal_profile.rs and shadow/expr.rs; the call is deferred rather than inventoried."
silent_drop = "resolve_selected_callable_kernel seals callable_index=None, and resolver.rs canonicalize_draft turns a non-empty draft.direct_calls into an empty BTreeMap at the None arm; CallableSemanticSourceLedgerView only sees the already-canonicalized map."
lineage_collapse = "function_call_brand_source_demand.rs preserves caller only for Cataloged and collapses TopLevel/InstanceConstructor into InstalledNonBrand { caller: None }; RawInvocationRootLineageV1 exists upstream but is lost before disposition."
package_order = "normal_callable_semantic_package issuer co-seals catalog, selected batch, and constructor batch before prepare_install/commit, but no direct-call inventory field or completeness check exists before install/body lowering."
late_route = "caller-less ordinary calls still enter PreparedRawOrdinaryFunctionCompletionV1::Resolved and can lower arguments before resolve_call_target, unique-static/tail recovery, and name-Const publication."
existing_authority = "VerifiedSelectedNormalCallableSourceInventoryV1 and VerifiedResolvedSourceSiteInventoryV1 carry source/declaration facts but no body-call inventory; the exact-i64 VerifiedCallableIndexV1 is a separate cohort and cannot be generalized sideways."
resolver_entrances = "The selected/Brand resolver, InstanceConstructor semantic batch, and older builder normal_callable_semantic_source ingress are distinct entrances; production/caller-zero classification of the older ingress is a prerequisite to any all-callers claim."
lineage_source = "RawInvocationRootLineageV1 already carries Cataloged, TopLevel, and InstanceConstructor upstream; the bounded task is to preserve this provenance through disposition without turning names, box keys, or symbols into targets."
i0_connection = "The landed index-none safety I0 is a typed abort at canonicalize_draft; it is a child safety edge and does not replace the same-session owner/site inventory or pre-shadow observation design."

[finite_state]
states = [
  "SourceInventoryUnsealed",
  "FunctionCallObserved",
  "FunctionCallDispositionMissing",
  "SelectedTraversalClosedWithCalls",
  "IndexNoneWithDirectCalls",
  "OwnerQualifiedSiteReady",
  "KnownNonDirectDisposition",
  "TopLevelLineagePreserved",
  "InstanceConstructorLineagePreserved",
  "DuplicateSite",
  "MissingSite",
  "ForeignSite",
  "AmbiguousSite",
  "ResolvedAfterArgumentsForbidden",
  "SameSessionOwnerSiteBijectionReady",
  "PackageAbortBeforeEffects",
  "InventoryCoSealed",
  "ParkedCompatibility",
]
terminal_policy = "Only InventoryCoSealed after same-session owner/site bijection is terminal for this design. Observed-but-undispositioned calls, closed traversal, index-none-with-calls, duplicate/missing/foreign/ambiguous sites, and second-session ownership remain CutoverBlockerOpen; explicit compatibility-only cohorts may be ParkedSealed."

[subtasks]
d0_a_observation_owner = "Design the single existing shadow/resolver observation point that records every ordinary FunctionCall before argument descent; no AST re-scan and no target receipt."
d0_b_lineage = "Carry RawInvocationRootLineageV1::{Cataloged,TopLevel,InstanceConstructor} through brand authority without collapsing to caller=None; keep provenance separate from target authority."
d0_c_co_seal = "Design the same-session owner-qualified (FunctionOwnerId, SourceExprSiteV1) inventory and require it before semantic package prepare_install/commit; include constructor forest owners, duplicate, missing, foreign, and ambiguous checks."
d0_d_local_value = "Decide whether LocalValue has an existing exact source relation; otherwise disposition it as typed reject or explicit park rather than consulting Builder variable_map or a name fallback."
d0_e_guard_matrix = "Specify one future guard and focused negative matrix for silent drop, index-none-with-calls, lineage collapse, second resolver, post-effect Resolved, and package/body/argument effects before co-seal."
d0_f_index_none_safety = "Track MIR-CALL-D1B-INDEX-NONE-DIRECT-CALLS-FAILFAST-D0 separately: existing DraftInvariant can close the silent empty-map edge, but it cannot claim source observation, lineage, or pre-argument resolution."

[acceptance]
positive = [
  "every selected and InstanceConstructor FunctionCall is counted exactly once with an owner-qualified source site",
  "Cataloged, TopLevel, and InstanceConstructor lineage reaches disposition without collapsing to caller=None",
  "known builtin/typeop/local/Extern/Brand special forms receive an explicit non-direct or targeted disposition from existing authority",
  "same resolver session co-seals the inventory and owner/site bijection before package publication",
]
negative = [
  "callable_index=None with non-empty direct_calls cannot become an empty successful map",
  "SelectedCallable traversal cannot silently drop FunctionCall",
  "no name/arity/physical-symbol/constructor-symbol target synthesis",
  "no second resolver continuation or post-effect recovery is introduced",
]
parity = "SelectedNormal self/sibling, InstanceConstructor, known special forms, missing/foreign/ambiguous, and an empty-call baseline remain distinguishable; no argument effect or MIR block mutation occurs for unresolved dispositions."
guard = "future guard must assert direct-call inventory coverage, zero silent drop to empty index, preserved root lineage, same-session owner/site bijection, and zero package/body/argument effects before a complete inventory."

[reopen]
triggers = [
  "SelectedCallable traversal remains closed while FunctionCall is present",
  "canonicalize_draft converts direct_calls to an empty map without a typed terminal",
  "TopLevel or InstanceConstructor lineage is collapsed to caller=None before disposition",
  "a target is synthesized from a source name, arity, physical symbol, or constructor symbol",
  "inventory is issued by a second resolver continuation or after argument effects",
]
