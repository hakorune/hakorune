items = [
  "1. A2-R0: recompute and record the candidate census from the matrix, preserving 697 candidate owner/evidence occurrences separately from three prose successor references and keeping receipt source_commit, explicit review_head, matrix hash, A1 commit, and audit HEAD as distinct provenance roles.",
  "2. A2-R1: classify each candidate as A1 pass-through, semantic-review input, or typed blocker; replace short/byte/path/range text only through an explicit reviewed decision, never by current-HEAD or grep repair.",
  "3. A2-R2: normalize the 79 A declaration rows and 46 B rows by owner/caller/cfg/route evidence; generated-included and retirement-successor labels are observations, not automatic schema roles.",
  "4. A2-R3: normalize explicit C family rows, prioritizing cfg(test) test_support and unambiguous compatibility/runtime sites; keep raw/legacy and caller-zero seams unresolved until route evidence is pinned.",
  "5. A2-R4: decompose mixed/ambiguous families at exact site ranges (A raw/source-entry, B raw/legacy, C rows 44/54/55/88/90 and the remaining unresolved rows); map only one of the seven roles when tracked evidence supports it.",
  "6. Resolve the 16 successor-required rows to one exact full-revision tracked successor_ref each; keep supporting paths in evidence_refs and leave multi-successor prose blocked.",
  "7. Re-run the landed A1 strict resolver over the fully reviewed input and preserve the independent golden result.",
  "8. Only after all states are terminal, reopen the parent D0 for one tracked 185-row owner map; expectation/reconciliation/guard/source retirement remain separate rows.",
]

