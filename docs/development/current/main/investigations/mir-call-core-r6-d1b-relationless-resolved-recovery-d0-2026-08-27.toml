[boundary]
starts = "RawBrandCallAuthorityV1::{RelationlessCompatibility or InstalledNonBrand { caller: None }} entering PreparedRawOrdinaryFunctionCompletionV1::Resolved"
ends = "the post-argument resolve_call_target/unique-static/tail/name-Const/direct-Call recovery chain, including shared Global transport callers"
includes = [
  "function_call_brand_source_demand.rs RelationlessCompatibility and InstalledNonBrand{caller:None} production callers",
  "function_call_preflight_route.rs Resolved completion and build.rs argument descent",
  "method_resolution.rs static Method(None) arm",
  "build.rs unique-static recovery and direct legacy publication",
  "static_resolution.rs tail/suffix recovery and emit_legacy_call(Global) fanout",
  "a finite caller disposition: retire, ParkedSealed, or pre-effect typed target state",
]
excludes = [
  "Cataloged Targeted child already landed at 6149d2692a",
  "unified_emitter RuntimeData methodize deletion before this lifecycle closes",
  "JSON-v0/v1, VM/native backend, final Call schema, MirCall/CallFlags, and new receipts",
  "generic plan-lowerer semantic redesign and unrelated static/operation emitters",
]

[brief]
decision = "Treat relationless compatibility resolution and every post-argument recovery as one lifecycle; do not remove Method(None) or unique/tail recovery in isolation."
source_authority = "Only the existing same-brand catalog can issue a target before argument descent; relationless input has no target authority until a finite existing product is identified."
canonical_issuer = "existing Ordinary preflight -> existing CalleeResolverBox -> MirInstruction::call; unresolved relationless states must terminalize before child effects"
non_authority = [
  "current_static_box and has_method",
  "module/header presence, suffix uniqueness, StaticMethodId parsing, name Const, registry, env flags",
  "post-argument args/effects, VM lookup, or backend acceptance",
]
fail_fast = "A relationless call without a finite builtin/local/Extern/catalog target must reject before drive_call_arguments_v1; no Method(None), name Const, unique-static retry, tail retry, or direct legacy Call may be published."
smallest_next_slice = "Read-only census and disposition only; no target transport or recovery deletion until production caller inventory is Exhausted."
non_claims = [
  "relationless calls are caller-zero",
  "the generic target claim can be invented from function name or headers",
  "methodize deletion is independently safe",
  "all emit_legacy_call(Global) transport callers are legacy dead code",
]

[lifecycle]
states = [
  "CatalogedTargetedClosed",
  "RelationlessBuiltinCandidate",
  "InstalledNonBrandUnlocated",
  "RelationlessLocalValueCandidate",
  "RelationlessExternCandidate",
  "RelationlessStaticOrUnknown",
  "PostArgumentUniqueStaticRecovery",
  "PostArgumentTailRecovery",
  "NameConstLegacyPublication",
  "TypedRejectBeforeArguments",
  "ParkedSealedCompatibilityBoundary",
]
terminal_policy = "Only the first, ninth, or explicitly ParkedSealed state may be terminal; all other states require a named existing authority or a caller disposition before implementation."

[caller_inventory]
relationless_ingress = [
  "src/mir/builder/calls/function_call_brand_source_demand.rs::RawBrandCallAuthorityV1::RelationlessCompatibility",
  "src/mir/builder/calls/function_call_brand_source_demand.rs::RawInvocationChildPortV1 -> InstalledNonBrand { caller: None } when source context is not Cataloged",
  "src/mir/builder/calls/function_call_preflight_route.rs::PreparedRawOrdinaryFunctionCompletionV1::Resolved",
]
argument_and_recovery = [
  "src/mir/builder/calls/build.rs::lower_prepared_raw_ordinary_function_completion_with_port_v1",
  "src/mir/builder/calls/build.rs::build_resolved_function_call",
  "src/mir/builder/calls/static_resolution.rs::try_unique_static_method_recovery",
  "src/mir/builder/calls/static_resolution.rs::try_tail_based_resolver",
]
transport_fanout = [
  "src/mir/builder/calls/emit.rs::emit_legacy_call(Global)",
  "static_resolution, ops, ordinary_new, and unified-disabled compatibility callers; each must be classified rather than assumed dead",
]
caller_zero_rule = "Textual absence is insufficient; the active RawInvocation route can enter Resolved through InstalledNonBrand{caller:None}, while RawLegacy is a compatibility facade. Each route and production callsite must be dispositioned by authority and lifecycle state."

[source_lineage_product]
status = "CutoverBlockerOpen"
cataloged = "RawInvocationRootLineageV1::Cataloged already carries CanonicalSameModuleCallableKeyV1 and is the only currently forwarded caller product."
top_level = "RawInvocationRootLineageV1::TopLevel carries SelectedTopLevelFunctionKeyV1 (statement index, declared name, declared arity) and allows bare calls, but brand_call_authority_v1 currently collapses it to InstalledNonBrand{caller:None}."
instance_constructor = "RawInvocationRootLineageV1::InstanceConstructor carries NormalInstanceConstructorSourceKeyV1 and allows bare calls, but the current authority port likewise does not forward a canonical caller product."
authority_gap = "Existing source keys are evidence of source identity, not automatically callable catalog targets. No name-only Global, arity guess, or new receipt may be invented to bridge the gap."
next_decision = "Preserve the existing RawInvocationRootLineageV1 through preflight exactly once; distinguish Cataloged, TopLevel, and InstanceConstructor from true RelationlessCompatibility, then either lend an existing target relation or terminalize before argument descent."
non_claims = [
  "TopLevel or InstanceConstructor source keys are already valid Callee targets",
  "SelectedTopLevelFunctionKeyV1 name/arity alone proves a target catalog row",
  "the source-key forwarding gap is caller-zero",
]

[observed_census_2026_08_27]
scope = "src/mir/builder non-test Rust callsites; tests and historical docs excluded from production disposition"
raw_dispatch_entry = "raw_expression_dispatch/mod.rs:341-353 is the sole production FunctionCall match that asks BrandConstructorSourcePortV1 for authority and invokes the preflight lowerer"
active_invocation = "RawInvocationChildPortV1 returns InstalledNonBrand{caller:None} when its callable ledger or Cataloged source lineage is absent; this is a live compatibility-shaped state, not caller-zero"
legacy_facade = "RawLegacyChildLoweringPortV1 returns RelationlessCompatibility and remains used by direct compatibility helpers; its references cannot be classified from the enum spelling alone"
resolved_completion = "build.rs:90-124 is the sole production Resolved completion callsite; it descends arguments before build_resolved_function_call"
post_argument_recovery = "build.rs:312-353 is the sole production caller of unique-static and tail recovery; static_resolution.rs definitions have no second non-test caller"
global_transport = "emit.rs::emit_legacy_call(Global) is shared transport: ordinary_new birth, fixed operator compatibility, tail recovery, and unified-disabled compatibility all enter it; transport is not target authority"
inventory_status = "Observed but not Exhausted: source contexts and compatibility modes still require owner-by-owner disposition before implementation"
source_lineage_status = "TopLevel and InstanceConstructor are live source-key lineages with bare-call admission, but their caller products are currently collapsed to caller=None; preserve the lineage in the child design row rather than treating these routes as caller-zero or deleting them."

[required_disposition]
builtin_local_extern = "Reuse an existing source-bound preflight state if one exists; otherwise remain NoSafeSlice rather than adding a name-based receipt."
static_unknown = "TypedReject before argument/effect descent unless an existing same-brand catalog product is already available."
unique_tail = "Delete only when production caller-zero is proven; otherwise ParkedSealed with an observable reopen trigger or move to a pre-effect typed state in a later bounded row."
legacy_name_const = "Zero in the closed boundary; no direct compatibility Call publication after target failure."
transport = "Retain only as a dumb inherited transport while an upstream named producer remains; never use it as target authority."

[acceptance]
design = [
  "finite production caller census covers relationless ingress, Resolved completion, Method(None), unique recovery, tail recovery, name Const, and Global transport",
  "each caller has exactly one disposition: Retire, PreserveExact, TypedReject, ParkedSealed, or Outside with owner/non-authority/reopen trigger",
  "positive/negative state matrix proves builtins/local/Extern only when an existing authority exists and rejects static/unknown before child effects",
  "no remaining route can publish Method(None), name Const, or direct legacy Call after unresolved target without an explicit accepted compatibility boundary",
]
implementation_gate = [
  "implementation_permission remains false until caller inventory is Exhausted and all open blockers are zero or ParkedSealed",
  "no new Verified*/Prepared* semantic receipt, no backend fallback, and no methodize deletion in this census row",
]
guard = "future guard must prove relationless production caller inventory, pre-effect terminal ordering, zero post-argument recovery re-entry, and inherited transport-only semantics; keep it separate from the global Call corridor guard"

[reopen]
triggers = [
  "a new RelationlessCompatibility producer or Resolved completion caller appears",
  "target resolution occurs after argument/effect descent",
  "unique/tail/name-Const recovery gains a production caller or a new fallback",
  "emit_legacy_call(Global) is treated as an issuer rather than inherited transport",
]
