title = "MIR Call D1B relationless Resolved recovery census"
status = "accepted_design_no_safe_slice"
observed_commit = "a214360982"
observed_at = "2026-08-27"
implementation_permission = false
parent_row = "MIR-CALL-CORE-R6-D1B-ROW-B-PRODUCER-CLOSURE-D0"
parent_child = "docs/development/current/main/investigations/mir-call-core-r6-d1b-methodize-provenance-disposition-d0-2026-08-27.toml"
