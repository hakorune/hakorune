[decision]
summary = "Compatibility roots must enter ProgramRootWorkPlanAdmissionV1::RawCompatibility. Source-backed roots alone may use SelectedNormal with an issued selected callable inventory and constructor source cohort. The existing lifecycle branch currently forces SelectedNormal for both, causing cohort-missing before the intended hako-mainline diagnostic."
