non_authority = [
  "hako leaf output, [PASS]/SKIP text, wrapper rc, route filename, or grep",
  "empty/default/synthetic constructor cohort",
  "AST/name/arity/symbol reconstruction",
  "cohort-missing marker as loop evidence",
  "fallback/retry/provider/delegate re-entry",
]
fail_fast = "If the compatibility/source branch and work-plan admission disagree, or SelectedNormal lacks its issued inventory/cohort, return the existing typed freeze before lowering; do not reinterpret the root."
smallest_next_slice = "Select admission from the already-installed package branch, preserve all existing arguments and terminal behavior, add one compatibility lifecycle regression, and re-run the exact hako-mainline leaf once."
non_claims = [
  "does not claim the loop blocker is fixed",
  "does not make the strict-negative leaf green",
  "does not transport parser provenance into JSON-v0",
  "does not retire hako-mainline or phase2160/run_all.sh",
  "does not change source-backed admission policy",
]

