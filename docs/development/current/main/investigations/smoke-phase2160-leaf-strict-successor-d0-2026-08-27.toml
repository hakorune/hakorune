[strict_contract]
binary = "repository target/release/hakorune only; do not accept NYASH_BIN/HAKO_BIN alias"
fixture = "repository fixture path and exact sha256 above"
timeout = "10 seconds; timeout is Timeout, never ObservedBlocker"
route_invocations = 1
expected_success = "rc != 0, not timeout, no canonical MIR mixed with the error, and the same failure window contains one LowerLoopSimpleBox.(try_lower|_lower_from_cmp|_emit_or_build_with_limit)/ marker plus one use of undefined value ValueId|Invalid value marker"
resolved_blocker = "rc=0 -> fail as blocker resolved unexpectedly"
reason_drift = "nonzero without the paired markers -> fail, never SKIP"
missing_prerequisite = "UnavailablePrerequisite non-pass terminal"
mixed_output = "nonzero plus valid MIR payload -> MixedOutput failure"
cleanup = "rm temporary files is non-semantic and may tolerate cleanup-only failure"

[strict_contract.environment]
allowlist = [
  "PATH required to launch fixed binary and helper",
  "HAKO_SELFHOST_BUILDER_FIRST=1",
  "HAKO_SELFHOST_NO_DELEGATE=1",
  "HAKO_EMIT_MIR_MAINLINE_ONLY=1",
  "HAKO_SELFHOST_TRY_MIN=0",
  "HAKO_MIR_BUILDER_LOOP_FORCE_JSONFRAG=0",
  "HAKO_MIR_BUILDER_BOX=hako.mir.builder",
  "NYASH_VM_USE_FALLBACK=0",
]
forbidden_inherited = [
  "NYASH_BIN and HAKO_BIN route aliases",
  "force/methodize/normalize variables not in the allowlist",
  "VM fallback, provider retry, min-builder retry, or delegate re-entry",
]

[finite_state]
unavailable_prerequisite = "fixed binary or fixture is absent/not executable -> non-pass unavailable terminal"
invalid_configuration = "route/env/timeout configuration is not exactly the contract -> failure"
timeout = "timeout command expires -> failure, not blocker evidence"
mixed_output = "canonical MIR and failure are both present -> failure"
observed_blocker = "single non-timeout nonzero route with the paired diagnostic markers -> strict-negative success"
wrong_failure = "nonzero route without the paired markers -> failure"
resolved = "rc=0 -> failure because the negative blocker disappeared"

[acceptance]
positive = [
  "fixed target/release/hakorune path and fixture/body hashes are checked before execution",
  "route executes exactly once with explicit no-fallback environment",
  "only the paired diagnostic in one failure window yields ObservedBlocker",
  "successor runs directly and does not depend on phase2160/run_all.sh or chmod",
  "after successor lands, the run_all child edge is removed in the same cutover evidence",
]
negative = [
  "missing binary/fixture is not rc=0 success",
  "timeout, rc=0, wrong failure, reason drift, and mixed output fail",
  "no command-level || true, retry, fallback, synthetic output, or inherited route alias",
  "no VM/product parity claim is emitted",
]
parity = "Compare the intended negative terminal and exact paired diagnostics only; no positive runtime parity is claimed."
guard = "A reusable leaf guard must derive the fixed path/hash and reject unknown environment/diagnostic states; it must not count [PASS] text or wrapper return code."

[implementation_gate]
permission = false
required_before_fast = [
  "strict owner shape and exact env allowlist are accepted",
  "UnavailablePrerequisite, Timeout, MixedOutput, WrongFailure, Resolved, and ObservedBlocker are represented distinctly",
  "direct execution is independent of run_all and chmod",
  "old wrapper edge and successor edge are ready for one atomic cutover",
]
no_safe_slice = [
  "diagnostic pair is not stable or cannot be observed in one failure window",
  "NYASH_BIN/HAKO_BIN or helper fallback is needed to reach the route",
  "timeout is treated as blocker evidence",
  "synthetic/force/min-builder behavior is required",
  "the successor keeps the child under run_all or leaves duplicate execution",
]

