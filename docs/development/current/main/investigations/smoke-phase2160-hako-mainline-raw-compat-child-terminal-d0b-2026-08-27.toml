[boundary]
starts = "RawCompatibility ProgramRootWorkPlanV1 after admission is selected and before immediate/deferred child effects"
ends = "one collector-backed compatibility terminal commit for each named child family"
includes = [
  "immediate raw top-level/static children",
  "raw instance-constructor children",
  "deferred static compatibility work",
  "App Main static child and Main materialization paths",
  "explicit admission propagation through program-root lowering",
  "source-context borrowing and existing pending-capture/LegacyReplaceWholePair lifetime",
]
excludes = [
  "source-backed SelectedNormal lowering or semantic package changes",
  "new parser/source seal, new semantic receipt, or target resolver",
  "strict-negative loop leaf, LowerLoopSimpleBox, undefined-value repair",
  "route/run_all retirement, VM/AOT/backend, Wpre, Call schema, and fallback policy",
  "wholesale RawLegacyChildLoweringPortV1 replacement",
]

[brief]
decision = "Amend the child-terminal design before implementation. RawCompatibility/SelectedNormal must be carried explicitly through immediate, deferred, App Main, and materialization branches. Only RawInvocation's dedicated compatibility terminal may invoke existing capture/commit seams; loose defaults remain negative freezes."
source_authority = "ProgramRootWorkPlanAdmissionV1 plus existing compatibility source context and the existing pending-capture/LegacyReplaceWholePair collector owner."
canonical_issuer = "Explicit RawCompatibility family branch -> borrow current raw source context -> existing pending capture -> LegacyReplaceWholePair commit once."
non_authority = [
  "Option<Cohort> or None as an implicit admission selector",
  "RawInvocationChildPortV1 loose-* defaults as a success path",
  "RawLegacyChildLoweringPortV1 wholesale substitution",
  "AST/name/arity/box-name/symbol recomputation",
  "caller=None, hako output, route filename, fallback/retry, provider, VM, or Wpre re-entry",
]
fail_fast = "Before child effects, an explicit admission and family terminal must be present. Missing/foreign source context, collector state, symbol/arity loan, or mixed SelectedNormal/RawCompatibility state freezes/rejects; it cannot fall through to a loose method or source-backed path."
smallest_next_slice = "Freeze the family matrix, dedicated terminal API, source-context borrow, and existing symbol/arity loan for one I1 row; then connect all listed compatibility families atomically with positive/negative tests and a reusable guard."
non_claims = [
  "does not claim the strict-negative loop marker",
  "does not make compatibility source-backed or issue a constructor cohort",
  "does not alter source-backed SelectedNormal behavior",
  "does not retire hako-mainline or any VM/backend route",
]

[family_matrix]
immediate_top_level_static = "program_root_work_plan.rs:516-525 -> explicit RawCompatibility terminal -> capture_static_box_method_pending_v1 -> collector commit; no generic loose-static call"
raw_instance_constructor = "program_root_work_plan.rs:69-76,458-461 and instance_box_constructor_batch.rs:121-132 -> explicit RawCompatibility terminal -> capture_normalized_instance_box_method_pending_v1 -> collector commit"
deferred_static = "program_root_work_plan.rs:98-101 plus program_root_lowering.rs:415-422 -> carry admission explicitly; RawCompatibility uses compatibility terminal, SelectedNormal keeps lower_normal_with_port_v1"
app_main_static_child = "decls.rs:69-70 plus module_lifecycle.rs:60-82 -> RawCompatibility uses the dedicated terminal; SelectedNormal keeps its typed adapter; default lower_static_box_method remains unclassified-input freeze"
main_materialization = "RawCompatibility App Main uses RawEntryMaterializationSourceReceiptV1 -> dedicated terminal -> LegacyReplaceWholePair; SelectedNormal keeps NormalEntryMaterializationSourceReceiptV1 -> existing cataloged path"
runtime_box_scope = "I1 excludes runtime ASTNode::BoxDeclaration/nested method paths at raw_expression_dispatch/mod.rs:488-524 and instance_box_method_batch.rs:71-95; they receive a separate runtime-box child-terminal D0 and are not silently included here"

[admission_transport]
immediate = "PreparedProgramRootInstanceBoxWorkV1 carries a non-optional ProgramRootWorkPlanAdmissionV1 field; normal_constructor_sources remains payload, never the selector"
deferred = "PreparedProgramDeferredStaticBoxWorkV1 carries the same non-optional admission enum; name/method vectors alone cannot select a lowering route"
app_main = "lower_program_root_work_plan_with_callable_port_v1 passes admission into App Main child and materialization dispatch; RawCompatibility and SelectedNormal cannot cross-convert"
source_context = "RawCompatibility terminal borrows the current RawInvocationSourceContextV1 for the scoped capture; it issues no new source identity. Missing context is typed freeze."
lifetime = "Direct terminal/capture state is borrowed for one recursive child. Clone/Rc/Arc/RefCell/copied ledger are forbidden for that state; the existing active_source metadata clone in RawSourceTransportPortV1 remains outside this direct-loan prohibition and is never target authority."

[terminal_api]
name = "RawCompatibilityChildTerminalPortV1"
trait_relation = "RootCallableCapturePortV1: RawBoxMethodChildPortV1 + RawAstChildLoweringPortV1 + RawCompatibilityChildTerminalPortV1"
shape = "private, nonsemantic RawCompatibilityCallableShapeV1 { symbol: Box<str>, physical_arity: usize }; no Clone/Copy/into_parts getter that permits dropping shape independently"
static_signature = "fn lower_raw_compat_static_child(&mut self, builder: &mut MirBuilder, shape: RawCompatibilityCallableShapeV1, params: Vec<String>, param_decls: Vec<ParamDecl>, return_type_name: Option<String>, body: Vec<ASTNode>, uses: Vec<String>, attrs: DeclarationAttrs) -> Result<(), String>"
instance_signature = "fn lower_raw_compat_instance_child(&mut self, builder: &mut MirBuilder, shape: RawCompatibilityCallableShapeV1, box_name: String, params: Vec<String>, param_decls: Vec<ParamDecl>, return_type_name: Option<String>, body: Vec<ASTNode>, uses: Vec<String>, attrs: DeclarationAttrs) -> Result<(), String>"
app_main_signature = "fn lower_raw_compat_app_main_static_child(&mut self, builder: &mut MirBuilder, shape: RawCompatibilityCallableShapeV1, child: &VerifiedMainStaticChildV1<'_>) -> Result<(), String>"
materialization_signature = "fn lower_raw_compat_main_materialization(&mut self, builder: &mut MirBuilder, receipt: RawEntryMaterializationSourceReceiptV1, params: Vec<String>, param_decls: Vec<ParamDecl>, return_type_name: Option<String>, body: Vec<ASTNode>, uses: Vec<String>, attrs: DeclarationAttrs) -> Result<(), String>"
raw_invocation = "RawInvocationChildPortV1 is the only production implementation in this row; it reborrows the capability, borrows source context, calls existing capture helpers, and leaves publication to LegacyReplaceWholePair"
raw_legacy = "RawLegacyChildLoweringPortV1 keeps its existing direct compatibility implementation and is not swapped in wholesale; it receives typed reject/defaults for the new dedicated capability"
selected_normal = "NormalCallableSemanticPackagePortAdapterV1 receives a typed reject/default for RawCompatibility methods; its SelectedNormal methods remain unchanged"
other_ports = "All other ports retain typed loose-static/loose-instance freezes and cannot become compatibility terminals"
commit = "Each child produces one LegacyReplaceWholePair collection; the enclosing module performs one outer collector drain/commit"

[symbol_arity]
main = "main_expansion.rs:389-396,414-417 supplies the body-side symbol/arity witness; RawCompatibilityCallableShapeV1 is the sole publication authority and the child witness is checked against it"
top_level = "PreparedProgramRootTopLevelFunctionPartsV1 stores name + params only today; I1's work-plan issuer must create RawCompatibilityCallableShapeV1 once from the existing compatibility symbol encoder and source parameter relation, then move it to the terminal"
instance_constructor = "PreparedInstanceBoxConstructorBatchV1::prepare must issue RawCompatibilityCallableShapeV1 (function symbol + physical arity) from its existing normalized constructor source owner before lower_with_port_v1; normal_instance_constructor_admission.rs:376-385 is SelectedNormal-only and cannot be reused"
collector = "recursive_child_lowering.rs commit helper consumes shape.symbol + shape.physical_arity; it is not recomputed by the terminal"
unknown = "missing, conflicting, or foreign symbol/arity -> typed freeze before capture/commit"

[compatibility_shape_issuer]
kind = "private nonsemantic transport product, not a Verified/Prepared semantic receipt and not a CallTarget"
top_level = "ProgramRootWorkPlanV1 preparation issues one RawCompatibilityCallableShapeV1 from the existing JSON-v0 physical symbol encoder plus the source parameter relation before PreparedProgramRootTopLevelFunctionPartsV1::lower_raw_with_port_v1"
constructor = "PreparedInstanceBoxConstructorBatchV1::prepare issues one RawCompatibilityCallableShapeV1 per constructor from the existing normalized constructor source/function shape before lower_with_port_v1"
deferred_static = "The deferred static preparation issues an aligned shape row per method before ProgramDeferredStaticBoxLifecycleV1 lowering; the consumer only moves the row"
fields = "symbol: Box<str> and physical_arity: usize; both are required, opaque to target resolution, and consumed together by the terminal"
ownership = "shape is move-only from source batch -> child terminal -> existing collector admission; no clone, copy, independent package getter, or consumer params.len()/params.len()+1 recomputation"
failure = "If an existing compatibility source owner cannot issue an exact shape before child effects, that family is ParkedSealed/typed freeze and is not admitted to I1"

[raw_materialization_handoff]
issuer = "RawCompatibility ingress owns an existing OwnedRawRootProjectionV1 and calls RawEntryMaterializationSourceReceiptV1::seal(projection, policy) before root lowering"
required = "RawEntryMaterializationSourceReceiptV1::App with Required policy moves into lower_raw_compat_main_materialization and then existing capture/LegacyReplaceWholePair"
omitted = "RawEntryMaterializationSourceReceiptV1::Script with Required returns None; omitted materialization performs no child terminal call"
normal = "SelectedNormal keeps NormalEntryMaterializationSourceReceiptV1 and the existing cataloged normal path"
forbidden = "RawCompatibility never constructs NormalEntryMaterializationSourceReceiptV1, NormalCatalogedBoxMethodDraftAdmissionV1, or a target from Main name/arity"
lifetime = "The raw receipt is created once at the compatibility ingress, moved into the scoped terminal call, and is not retained by the package or recursive sibling"

[source_location_contract]
allowed_roots = ["RawInvocationSourceTransportV1::Located with RawInvocationRootLineageV1::ScriptRoot and a concrete SourceNodeSiteV1"]
root_policy = "I1's hako-mainline ingress is ScriptRoot only; Main, TopLevel, Cataloged, InstanceConstructor, NestedBoxMethod, or any other root lineage is rejected until a separate row enumerates it"
unlocated = "RawInvocationSourceTransportV1::UnlocatedCompatibility, expected_lineage=None, non-ScriptRoot lineage, or missing current_source_context_v1 is typed freeze before capture; it is never upgraded to a target"
clone_boundary = "Existing RawSourceTransportPortV1 metadata reborrow/clone remains outside the direct terminal loan; only terminal/capture ownership is affine"

[app_main_shape_authority]
publication_authority = "RawCompatibilityCallableShapeV1.symbol + physical_arity"
child_witness = "VerifiedMainStaticChildV1 symbol/arity is an immutable consistency witness only; mismatch rejects before capture"
collector_input = "Only the moved RawCompatibilityCallableShapeV1 values reach LegacyReplaceWholePair; the child witness is never recomputed or published"

