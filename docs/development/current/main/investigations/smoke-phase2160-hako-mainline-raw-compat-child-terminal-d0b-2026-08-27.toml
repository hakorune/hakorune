[delete_set]
implicit_edges = [
  "None-valued constructor/source option as the only compatibility admission signal",
  "deferred lowering's unconditional lower_normal_with_port_v1",
  "RawCompatibility top-level/static -> loose lower_static_box_method default",
  "RawCompatibility instance constructor -> loose lower_instance_box_method default",
  "deferred static compatibility -> cataloged/source-backed child path",
  "App Main compatibility child -> generic static/instance loose default",
]
preserve = [
  "SelectedNormal cohort validation and source-backed lowering",
  "loose-* default methods as negative unclassified-input guards",
  "existing capture_static_box_method_pending_v1",
  "existing capture_normalized_instance_box_method_pending_v1",
  "existing commit_legacy_nested_box_method_symbol_pending_v1",
  "LegacyReplaceWholePair collector and its atomic publication contract",
]

[finite_state]
raw_ready = "Explicit RawCompatibility admission + one matrix family + borrowed source context + existing symbol/arity"
captured = "Family-specific pending capture owns one exact replacement pair; no direct source-backed Call is published"
committed = "LegacyReplaceWholePair commits once and pending residual is empty"
selected_ready = "SelectedNormal carries issued inventory/cohort and keeps the existing normal path"
selected_missing = "SelectedNormal without issued cohort -> existing typed freeze"
unclassified = "Loose static/instance child without a named compatibility family -> typed freeze"
terminal_mismatch = "foreign/duplicate/mixed admission, source context, symbol, arity, or collector state -> typed reject/freeze"
retiring = "Route retirement is a separate design row"

[acceptance]
positive = [
  "immediate top-level/static, instance-constructor, deferred-static, App Main child, and Main materialization families each have an explicit RawCompatibility branch",
  "each selected family uses existing capture/LegacyReplaceWholePair exactly once",
  "admission and source context are carried through recursive/deferred calls without copied ledgers",
  "symbol/arity come from existing owners and are moved/borrowed unchanged",
  "source-backed SelectedNormal remains green with its existing cohort requirement",
]
negative = [
  "loose-* defaults still reject unclassified input",
  "None/Option no longer silently selects a different admission",
  "missing/foreign/duplicate/mixed source or collector state rejects before child effects",
  "no AST/name/arity/box-name target synthesis, fallback, retry, provider, VM, or Wpre re-entry",
  "strict-negative leaf does not whitelist any upstream freeze marker",
]
parity = "Preserve compatibility pending pair, symbol/arity, statement/argument order, collector output, and source-backed path; loop-blocker parity is deferred."
focused_tests = [
  "module_lifecycle_capture_tests: top-level/static, instance-constructor, deferred-static, and App Main positive witnesses",
  "program_root_work_plan_tests: explicit admission propagation and SelectedNormal missing-cohort negative",
  "normal_default_root_catalog_lifecycle_tests: real compatibility root reaches the collector terminal",
  "recursive_child_lowering_rawport_tests: loose default remains a negative freeze",
]
guard = "A scoped guard must derive explicit admission branches, family-to-capture-to-LegacyReplaceWholePair edges, and zero direct loose-* success/source-backed handoff. It must not whitelist freeze text or infer completion from route rc."

[implementation_gate]
permission = false
required_before_fast = [
  "D0b family matrix and terminal API are accepted as one bounded I1 boundary",
  "admission is explicit for immediate, deferred, App Main, and materialization paths",
  "source-context borrow and symbol/arity lifetime are fixed without copied ownership",
  "all changed owners and any new sibling stay below 760 lines and 800 hard stop",
  "focused positive/negative tests and one reusable guard are named",
]
no_safe_slice = [
  "a new parser/source bridge, semantic receipt, target resolver, or source identity is needed",
  "RawLegacyChildLoweringPortV1 wholesale swap or loose default weakening is required",
  "symbol/arity cannot be borrowed from an existing owner",
  "App Main or runtime Box fate cannot be classified explicitly",
  "collector capture/commit is not atomic exactly once",
  "the row must touch loop repair, route retirement, VM/backend, or source-backed semantics",
]

