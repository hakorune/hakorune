title = "Smoke phase2160 leaf fate and repair census design"
status = "accepted_design_no_safe_slice"
observed_commit = "2437f09da4"
observed_at = "2026-08-27"
implementation_permission = false
current_execution_row = "SMOKE-PHASE2160-LEAF-FATE-CENSUS-D0"
parent_row = "docs/development/current/main/investigations/smoke-owner-pack-phase2160-best-effort-d0-2026-08-27.toml"

[boundary]
starts = "phase2160/run_all.sh and its twenty direct child scripts"
ends = "a body-derived owner/fate table that permits wrapper retirement without false green or orphaned leaves"
includes = [
  "all twenty exact child paths and their direct caller edges",
  "expected rc/tag, profile, timeout, skip, fallback, synthetic repair, and chmod effects",
  "shared helper callers such as run_registry_builder_tag_canary, ensure_phase2160_tagged_stdout_contract, synthesize_phase2160_*, and program_to_mir status handling",
  "the distinction between leaf-specific strict/negative ownership and observation-only probes",
  "the exact deletion and successor edges for phase2160/run_all.sh",
]
excludes = [
  "phase2160 code or fixture edits",
  "run_all deletion, new owner-pack implementation, or strictization before the census",
  "phase2050/2170, phase2100, filter-driven, pure-legacy, VM/AOT/LLVM, Cargo, and MirBuilder changes",
  "synthetic repair implementation or shared-helper redesign",
]

[brief]
decision = "Select final fate B: retire phase2160/run_all.sh as an aggregate authority. Do not make all twenty children one owner pack. After this census, strict positive and strict negative leaves may move to their own owners; synthetic/skip/best-effort leaves remain ParkedSealed or Retired until a real owner exists."
source_authority = "phase2160/run_all.sh and each checked-in child body, exact shared-helper definitions/callers, and the existing integration/archive profile trees"
canonical_issuer = "A leaf-specific strict runner/fixture or an explicit typed negative owner after census; the phase2160 aggregate has no canonical issuer and is retired."
non_authority = [
  "phase2160/run_all.sh [PASS] text",
  "|| true, post-swallow rc, skip output, chmod success, or synthetic MIR/tag",
  "filename/phase name, quick zero-match, inherited environment, and fallback output",
  "a shared helper name without a caller/owner relation",
]
fail_fast = "Any leaf without an owner/fate, exact expected outcome, and duplicate-free successor remains a blocker; wrapper retirement cannot proceed while a child is both aggregate-owned and independently executed."
smallest_next_slice = "Produce one twenty-row leaf table with body hash, owner candidate, expected rc/tag, runtime conditions, repair/side-effect flags, and a finite fate; then define wrapper delete and successor edges."
non_claims = [
  "does not claim any current best-effort green result is valid",
  "does not add a typed aggregate fate or owner pack",
  "does not remove synthetic repair, || true, chmod, fallback, or child scripts",
  "does not promote phase2160 behavior to product/LLVM authority",
]

[selected_fate]
aggregate = "Retired after every live child has an explicit successor or ParkedSealed/Retired disposition"
rejected_alternatives = [
  "retain a best-effort aggregate as a passing owner pack",
  "force all twenty heterogeneous leaves into one strict pack",
]
reason = "The aggregate converts failed probes into success and mixes registry, builder, selfhost, loop, and hako-mainline responsibilities; leaf ownership is the only path that removes that second authority."

