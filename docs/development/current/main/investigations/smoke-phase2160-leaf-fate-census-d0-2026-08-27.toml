diagnostic_authority = "same failure window contains LowerLoopSimpleBox.(try_lower|_lower_from_cmp|_emit_or_build_with_limit)/ and use of undefined value ValueId|Invalid value"
required_contract = "fixed target/release/hakorune and fixture; one 10s route execution; missing prerequisite is unavailable/nonpass; nonzero non-timeout plus exact diagnostic pair is the only ObservedBlocker success; rc=0, timeout, reason drift, or mixed MIR/error is failure"
required_environment = "HAKO_SELFHOST_NO_DELEGATE=1; HAKO_EMIT_MIR_MAINLINE_ONLY=1; HAKO_SELFHOST_TRY_MIN=0; HAKO_MIR_BUILDER_LOOP_FORCE_JSONFRAG=0; HAKO_MIR_BUILDER_BOX=hako.mir.builder; NYASH_VM_USE_FALLBACK=0; no inherited force/methodize env"
not_implementation_permission = "This selection opens only the next design row; no leaf edit or VM route change is authorized here."

[wrapper_retirement]
delete_edge = "phase2160/run_all.sh -> remove from integration discovery/aggregate registration after every leaf row has a successor or ParkedSealed/Retired disposition"
duplicate_proof = "normal discovery must not execute a retired wrapper and an individually owned successor for the same path"
remaining_archive = "commented archive probes stay outside this census and are not revived by wrapper retirement"

[finite_state]
unclassified = "new or changed child has no reviewed owner/fate/body hash -> CutoverBlockerOpen"
leaf_owned_strict = "exact source/fixture and expected rc/tag, no swallowed failure, no synthetic replacement, no hidden side effect"
leaf_owned_negative = "exact unsupported/error outcome is the intended proof and is checked without fallback"
parked_sealed = "owner relation exists but the leaf is conditional, synthetic, side-effecting, or not yet strict; no execution claim"
retired = "leaf or aggregate has no live production/proof caller and its deletion/successor is recorded"
aggregate_retired = "phase2160/run_all.sh is removed from default/explicit discovery only after all twenty child dispositions are closed"

[required_census]
row_fields = [
  "path",
  "body_sha256",
  "direct_caller",
  "owner_profile",
  "runtime_profile",
  "timeout",
  "expected_rc_or_tag",
  "skip_condition",
  "fallback_or_retry",
  "synthetic_repair",
  "chmod_or_workspace_side_effect",
  "successor",
  "fate",
]
shared_owner_questions = [
  "is run_registry_builder_tag_canary phase2160-only or shared?",
  "is ensure_phase2160_tagged_stdout_contract a validator or a success generator?",
  "which synthesize_phase2160_* callers remain after wrapper retirement?",
  "does program_to_mir status handling preserve the real child rc exactly once?",
]

[acceptance]
positive = [
  "all twenty child paths appear exactly once with body-derived caller/edge evidence",
  "each child has one of LeafOwnedStrict, LeafOwnedNegative, ParkedSealed, or Retired, or remains an explicit blocker",
  "shared helper callers and repair paths are classified separately from leaf names",
  "phase2160/run_all.sh has an explicit delete edge and no future aggregate owner claim",
  "integration/archive/profile crossings are visible rather than silently merged",
]
negative = [
  "[PASS], || true, skip, chmod, fallback, and synthetic output cannot close a row",
  "no child is both retained under run_all and claimed by a successor owner",
  "no phase2160 child enters the phase2050 or phase2170 owner pack",
  "no new aggregate fate or runner code is introduced by this D0",
]
parity = "Compare exact path/body-hash/owner/fate tables only; runtime parity waits for later leaf-specific rows."
guard = "Use one generated or reusable census guard after the table is accepted; do not create twenty independent guards during this design row."

[implementation_gate]
permission = false
required_before_fast = [
  "twenty-row table is complete and body hashes are current",
  "all shared repair/fallback callers have an owner or explicit blocker",
  "wrapper delete edge and duplicate-execution proof are recorded",
  "at least one strict leaf successor is selected separately from best-effort leaves",
]
no_safe_slice = [
  "a synthetic repair is needed to claim positive semantics",
  "leaf owner is inferred from filename or wrapper order",
  "wrapper retirement would orphan a child",
  "profile crossing or skip is hidden as success",
]

[ordered_followups]
next_after_design = "SMOKE-PHASE2160-LEAF-STRICT-SUCCESSOR-D0"
later = [
  "SMOKE-PHASE2160-AGGREGATE-RETIRE-R0",
  "SMOKE-OWNER-PACK-PHASE2100-ROLE-BUCKET-D0",
  "SMOKE-OWNER-PACK-PURE-LEGACY-CROSS-PROFILE-D0",
]
reopen_triggers = [
  "any phase2160 child or shared helper changes without a census refresh",
  "a child returns to run_all after its successor disposition is recorded",
  "synthetic repair, || true, chmod, or fallback is cited as positive evidence",
  "wrapper deletion would leave an ownerless or cross-profile child",
]
