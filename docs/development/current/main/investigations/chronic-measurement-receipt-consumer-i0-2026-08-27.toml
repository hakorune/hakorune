canonical_key = "row_kind + path + byte_start + byte_end + attribute_kind"
hash_bytes = "receipt_hash omitted; fixed serde struct field order; compact UTF-8 JSON; no trailing newline; SHA-256"

[implementation]
module = "tools/checks/rust_source_topology/src/chronic_measurement/observation_receipt.rs"
api = "validate_observation_receipt_json(input, expected_source_commit)"
parser_rule = "serde_json parses the tracked receipt directly with deny_unknown_fields; no scan_scope_manifest call and no stdout parse"
dependency_rule = "reuse existing serde/serde_json/sha2; no new dependency or root Cargo change"
line_budget = "existing module remains below 760 lines; 800-line hard stop"

[finite_state]
states = [
  "InputReady",
  "Parsed",
  "FrozenScopeVerified",
  "RowsVerified",
  "HashVerified",
  "UnknownField",
  "MalformedJson",
  "ScopeDrift",
  "SourceRevisionDrift",
  "ObservationDrift",
  "HashDrift",
]
terminal = ["HashVerified"]
blocking = ["UnknownField", "MalformedJson", "ScopeDrift", "SourceRevisionDrift", "ObservationDrift", "HashDrift"]

[task_steps]
items = [
  "1. Add Deserialize/deny-unknown-fields only for the neutral receipt projection and rows; keep owner fields impossible at this boundary.",
  "2. Reuse the issuer's canonical hash, key, path, and non-empty-range validation; compare all frozen contract fields and explicit source_commit.",
  "3. Add a strict JSON validator API that returns typed receipt data and never rescans or parses scanner stdout.",
  "4. Add focused positive/negative tests for the tracked 185-row artifact, unknown owner/retirement fields, scope/source/hash drift, duplicate/order/count/range drift, and deterministic revalidation.",
  "5. Close this cell without creating owner-map or expectation rows; the successor remains the site-owner-map D0.",
]

[acceptance]
positive = [
  "the tracked receipt parses and validates exactly once against the frozen contract and explicit d9cff source snapshot",
  "all 185 canonical rows remain sorted, unique, non-empty, and free of owner/retirement fields",
  "recomputed receipt_hash matches sha256:6be32f799970e883aa37f19a562f188016a06624f493f28bf57b446d27b5c63d",
]
negative = [
  "unknown top-level/row field, malformed JSON, wrong scope/hash/scanner/version, source revision mismatch, zero range, duplicate/order/count drift, or hash tamper rejects",
  "no scanner invocation, stdout reparse, cross-language hash copy, owner inference, expectation pin, guard registration, or deletion",
]
structural = [
  "observation_receipt.rs remains the only schema/hash owner",
  "new consumer code stays under the 760-line module limit and root dependencies are unchanged",
]

[guard]
