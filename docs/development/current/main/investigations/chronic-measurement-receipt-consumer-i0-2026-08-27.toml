[boundary]
starts = "the tracked chronic_measurement_observations_v1.json bytes produced by the landed neutral receipt issuer"
ends = "one reusable strict parser/validator that verifies the frozen 185-row receipt before any owner-map projection"
includes = [
  "serde JSON parsing with deny-unknown-fields for the receipt and row projection",
  "reuse of the receipt owner's canonical hash computation and row-key/range validation",
  "frozen scope/version/hash comparison and explicit expected source_commit comparison",
  "focused positive/negative tests for unknown fields, scope/hash drift, row drift, and source revision drift",
]
excludes = [
  "owner_ref, successor, role, compile_domain, retirement_status, expectation TSV, guard registration, or deletion",
  "a second scanner/parser, cross-language hash implementation, scanner scope changes, or artifact regeneration",
  "compiler/MIR/VM/AOT behavior, route/fallback changes, and any semantic receipt",
]

[brief]
decision = "Make the existing receipt issuer the sole schema/hash authority and add one strict consumer API for the future site-owner map. The consumer accepts the expected source snapshot explicitly, verifies the frozen scope contract, and returns the neutral observation rows without adding ownership meaning."
source_authority = "The tracked observation receipt artifact and the receipt issuer's canonical projection/hash rules."
canonical_issuer = "observation_receipt.rs owns both serialization and validation; the site-owner map may call the validator but may not reparse scanner output or reproduce hash bytes."
non_authority = ["raw scanner stdout", "grep/rg counts", "current HEAD as implicit source_commit", "owner guesses", "expectation/deletion state"]
fail_fast = "Reject malformed JSON, unknown fields, wrong schema/version/scanner/scope/hash, source revision mismatch, non-empty-range violations, duplicate/out-of-order/foreign rows, count drift, and receipt_hash drift before returning rows."
smallest_next_slice = "Add the strict receipt model/validator and focused tests inside the existing chronic_measurement module; do not author owner-map rows."
non_claims = [
  "does not claim any allowance is stale, dead, live, or deletable",
  "does not classify owner/role/successor or issue expectation authority",
]

[contract]
schema = "chronic-measurement-observations-v1"
schema_version = 1
scanner_version = "chronic-rust-token-scanner-v1"
scope_id = "mirbuilder-chronic-rust-v1"
scope_manifest_hash = "sha256:be3a81afd0be8a2934b21fabcb0c43cb6d530462da7fdbe87ec1afdae126425f"
source_scope_hash = "sha256:8d7db05c42c007e556b15bc98fa3fbefbb69c5556b4733d838ccb5fd7cfeca39"
