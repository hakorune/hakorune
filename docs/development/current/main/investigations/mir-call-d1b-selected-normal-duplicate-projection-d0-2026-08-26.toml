[boundary]
starts = "VerifiedSelectedNormalCallableSourceInventoryV1 / NormalTopLevelFunctionDraftAdmissionV1 duplicate projections"
ends = "ProgramRootWorkPlanAdmissionV1 SelectedNormal preparation before the first top-level body lowering"
includes = [
  "selected_source_inventory.rs duplicate same-name/same-arity source occurrences",
  "NormalTopLevelFunctionDraftAdmissionV1 name/arity -> LegacySymbol projection",
  "ProgramRootWorkPlanAdmissionV1::SelectedNormal versus RawCompatibility",
  "module_draft_collector CanonicalRejectDuplicate versus LegacyReplaceWholePair",
  "existing tests and reference acceptance that currently allow duplicate SelectedNormal symbols",
]
excludes = [
  "exact self/sibling target loan after duplicate policy",
  "InstanceConstructor ordinary target relation",
  "Method(None), methodize, JSON/VM/backend, final Call schema, and CallFlags",
  "collector implementation, fixture rewrite, or production switch in this design row",
]

[brief]
decision = "SelectedNormal source occurrences that project to one effective same-name/same-arity LegacySymbol are an ambiguous direct target and must be typed-rejected before top-level body lowering. RawCompatibility may retain LegacyReplaceWholePair only under its existing owner; declaration order, collector last-wins, and retry into RawCompatibility are not SelectedNormal authority."
source_authority = "SelectedNormal source inventory plus NormalTopLevelFunctionDraftAdmissionV1 physical projection and the existing program work-plan admission policy."
canonical_issuer = "none in this design child; ProgramRootWorkPlan preparation is the candidate pre-body validator, while Call target issuance remains downstream and blocked."
non_authority = [
  "collector last-wins/replacement, LegacySymbol text, name/arity formatting, statement order, test success, or compatibility labels",
]
fail_fast = "Duplicate/conflicting SelectedNormal physical projections must be classified before any top-level body/argument lowering and before an ordinary Call target can be borrowed."
smallest_next_slice = "A separate I0 may add one ProgramRootWorkPlan pre-body validator and convert the duplicate work-plan witness into a negative; exact target loan remains downstream."
non_claims = [
  "the current implementation already rejects duplicate SelectedNormal work plans",
  "RawCompatibility is the only duplicate cohort in the repository",
  "exact self/sibling target loans, constructor targets, or mandatory-Callee cutover",
]

[observed]
source_inventory = "SelectedTopLevelFunctionKeyV1 distinguishes statement occurrence but does not own a MIR symbol."
draft_projection = "NormalTopLevelFunctionDraftAdmissionV1 maps each source key to name/arity LegacySymbol; multiple occurrences can share it."
selected_normal_acceptance = "ProgramRootWorkPlanAdmissionV1::SelectedNormal currently admits the cohort and tests permit duplicate same-name/same-arity projections; this is an observed migration behavior, not the accepted semantic contract."
raw_compatibility_owner = "ProgramRootWorkPlanAdmissionV1::RawCompatibility plus LegacyReplaceWholePair is the existing legacy owner; it cannot silently authorize SelectedNormal."
normative_reference = "docs/reference/language/function-call-evaluation.md: SelectedNormal same effective name/arity is ambiguous and rejects before body/argument evaluation; different arity remains distinct."
compatibility_review = "Parser/AST transport may preserve duplicate occurrences, but no repository compatibility contract requires SelectedNormal last-wins execution; RawCompatibility remains the sole owner of legacy replacement."

[finite_state]
states = [
  "SelectedNormalUniqueProjection",
  "SelectedNormalDuplicateProjection",
  "SelectedNormalPhysicalConflict",
  "RawCompatibilityDuplicateProjection",
  "ForeignOrMissingProjection",
  "TypedRejectBeforeBodyLowering",
  "ParkedRawCompatibility",
  "TargetLoanDecisionUnblocked",
]
terminal_policy = "Only SelectedNormalUniqueProjection may proceed to a later target-loan design. SelectedNormalDuplicateProjection and SelectedNormalPhysicalConflict terminate with a typed reject before body lowering. RawCompatibilityDuplicateProjection may remain ParkedRawCompatibility under its existing owner and cannot re-enter SelectedNormal."

[decision_matrix]
unique = "one source occurrence -> one physical projection with no competing planned producer: candidate for later exact loan"
duplicate_selected = "two or more SelectedNormal occurrences -> one effective physical projection: typed reject before body lowering; no declaration-order winner, collector replacement, or RawCompatibility retry"
duplicate_raw = "RawCompatibility duplicate: retain only under existing LegacyReplaceWholePair owner with reopen trigger"
conflict = "same occurrence has conflicting physical rows: typed reject before body lowering"
missing = "source occurrence lacks physical relation: NoSafeSlice, no name/arity synthesis"

[acceptance]
design = [
  "the Decision distinguishes SelectedNormal duplicate from RawCompatibility duplicate",
  "the reference/acceptance owner records SelectedNormal duplicate as an ambiguous direct target rejected before body/argument evaluation",
  "pre-body fail-fast boundary and impact on existing duplicate tests/fixtures are named",
  "a later exact self/sibling target-loan child can rely on a unique SelectedNormal projection without collector last-wins",
]
negative = [
  "no code, fixture, collector policy, or production switch in this design row",
  "no implicit conversion of duplicate to RawCompatibility, no collector winner as authority, and no target inference",
]
implementation_gate = "false for this design row; the separate I0 card names the only permitted pre-body validator, while exact target loan remains a downstream design row."
guard = "future guard must assert SelectedNormal duplicate projections are rejected before body lowering; no duplicate may reach canonical target loan by collector replacement or RawCompatibility retry"

[reopen]
triggers = [
  "a new SelectedNormal duplicate producer/test appears",
  "duplicate policy changes without reference/acceptance amendment",
  "collector replacement or name/arity text is used as ordinary Call target authority",
  "exact loan implementation starts before this Decision closes",
]
