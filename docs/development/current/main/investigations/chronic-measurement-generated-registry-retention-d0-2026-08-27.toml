  "MissingDeclaration",
  "MixedDeclarationRole",
  "MissingPolicyOwner",
  "UnknownSuccessor",
  "InferredRetention",
  "PartialCohort",
]

[task_steps]
items = [
  "1. Bind exactly the 79 A rows from the validated receipt; preserve byte-range identity and do not regenerate scanner output.",
  "2. Confirm module_registry.in.rs and compiler/mod.rs as topology owner evidence without treating the include as retention policy.",
  "3. Inspect each declared module's tracked owner/README/registration and classify role independently; split non-uniform declarations.",
  "4. Name an explicit retention policy owner for rows that remain, or a tracked successor for rows that move; unknown stays blocking.",
  "5. Record the finite policy and row-level evidence in the parent matrix; only then reopen site-owner-map D0 for map authoring.",
]

[acceptance]
positive = [
  "all 79 canonical A keys are covered exactly once and each has a declaration-level role/evidence status",
  "the registry/include owner boundary is explicit and separate from retention/successor authority",
  "every retained row names a policy owner and every moved row names a successor; no row receives a guessed not_required",
  "mixed generated modules are split by declaration/site evidence rather than blanket-labeled",
]
negative = [
  "no source/module registry edit, allow removal, TSV, guard registration, caller-zero claim, or deletion",
  "no blanket Retain/not_required from generated-included, module filename, grep absence, or local green",
  "no partial A cohort is handed to the owner map as complete",
]

[guard]
