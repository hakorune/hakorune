[boundary]
starts = "the 79 dead_code allowance observations in the generated-included src/mir/compiler/module_registry.in.rs receipt cohort"
ends = "one explicit policy and per-module evidence rule that can issue or withhold successor_status=not_required without using generated status as a default"
includes = [
  "the module_registry.in.rs topology/include owner boundary",
  "per-declaration role and compile-domain review for all 79 receipt rows",
  "explicit retention policy owner or named successor for each retained/deletion candidate",
  "split handling for runtime, compatibility, guard, test-support, and disconnected generated modules",
  "a finite decision that the later owner-map validator can encode without guessed defaults",
]
excludes = [
  "editing module_registry.in.rs or compiler/mod.rs",
  "removing #[allow(dead_code)], changing module visibility, or deleting source",
  "expectation TSV, guard registration, caller-zero proof, Git anchor resolution, compiler/MIR/VM/AOT behavior",
  "blanket Retain or blanket not_required inferred from generated-included, allow attributes, or text absence",
]

[brief]
decision = "Treat generated-registry status as a topology fact only. Before the A cohort can enter the owner map, decide whether each declared module is retained by a named policy owner, mapped to a successor, or remains blocked; split non-uniform roles at declaration/range level. No default successor is issued."
source_authority = "The frozen 79 receipt rows, module_registry.in.rs declarations, compiler/mod.rs include edge, and explicit tracked owner/retirement policy evidence."
canonical_issuer = "This D0 issues only the retention/successor policy decision for the A cohort; the later site-owner-map D0 remains the sole owner-map input issuer."
non_authority = [
  "generated_included or generated_registry labels by themselves",
  "allow(dead_code), filename/module name, grep caller absence, warning counts, or current build green",
  "the coverage skeleton's empty fields, guessed successor, or a blanket Retain assertion",
]
fail_fast = "A cohort closure fails if any of the 79 rows lacks a declaration-level owner, explicit role evidence, named retention policy or successor, or if a uniform policy is asserted across mixed modules without row-level proof."
smallest_next_slice = "Read-only census of all 79 module declarations against tracked module files and owner policy; record which rows are policy-ready versus blocked, without editing source or authoring the owner-map TOML."
non_claims = [
  "does not claim generated modules are dead or live",
  "does not create a successor, expectation pin, guard row, or deletion authorization",
  "does not change the Rust module registry or compiler behavior",
]

