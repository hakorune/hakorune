[boundary]
starts = "SelectedNormal normal-source callable forest, complete direct-call source inventory, and its mutable resolver continuation"
ends = "a package-owned general direct-call index, site disposition, and same-resolver owner reservation are co-sealed before package publication"
includes = [
  "issue_normal_callable_semantic_package_with_brand_catalog_v1 co-seal and its VerifiedNormalCallableSemanticPackageV1 aggregate",
  "issue_source_backed_same_module_callable_catalog_v1 source inventory and issue_resolved_callable_semantic_batch_with_brand_catalog_v1 resolver continuation",
  "owner-private identity-only general callable-index representation and exact SourceExprSiteV1 lookup design",
  "catalog-gated shadow/traversal disposition for ordinary direct calls, known non-direct forms, and missing/foreign/ambiguous sites",
  "same-source root-owner reservation and ResolvedDirectCallTargetV1 issuance only after the co-seal",
  "SelectedNormal duplicate validator I0 at ffcae72725",
  "TopLevel self/sibling source-site precedence and special-form boundaries",
  "preservation of RawInvocationRootLineageV1 without embedding a target",
]
excludes = [
  "NormalTopLevelFunctionDraftAdmissionV1 as a target authority",
  "physical_symbol/name/arity synthesis, collector last-wins, or source-key formatting",
  "implementation of TopLevel self/sibling consume, InstanceConstructor ordinary calls, GC special names, or post-argument recovery deletion",
  "Method(None), methodize, CalleeGuard, UnknownBox, callsite canonicalize, final Call schema, CallFlags, VM/backend, and warning cleanup",
]

[brief]
decision = "The package issuer/aggregate is the sole transaction owner, but the general SelectedNormal direct-target handoff is still design-only. A new owner-private identity-only general callable-index product and catalog-gated FunctionCall traversal must be designed and co-sealed with the same resolver continuation before any target handoff. The existing exact-i64 index cannot be generalized or borrowed sideways, and a second resolver continuation is forbidden."
source_authority = "issue_normal_callable_semantic_package_with_brand_catalog_v1 -> VerifiedNormalCallableSemanticPackageV1 owns the consumed source, source-backed inventory, resolver batch, and proposed VerifiedSelectedNormalDirectCallableIndexV1; after same-session owner reservation, exact SourceExprSiteV1 -> existing ResolvedDirectCallTargetV1 may be issued. The proposed index is an identity/source relation only, not physical ABI authority."
canonical_issuer = "Existing preflight consumes an accepted target through CalleeResolverBox and MirInstruction::call; this D0 designs the package product but issues no code, receipt, index, or Call."
non_authority = [
  "NormalTopLevelFunctionDraftAdmissionV1 physical_symbol/arity alone",
  "SelectedTopLevelFunctionKeyV1 name/arity, caller=None, LegacySymbol formatting, collector replacement, current_static_box, has_method, GC name classification, header/suffix lookup, args, or post-argument values",
]
fail_fast = "Complete owner reservation, catalog-gated site disposition, exact source identity, and target precedence must be co-sealed before package publication; any duplicate, missing, foreign, ambiguous, deferred, or second-session state aborts the unpublished package before install/body lowering/argument effects/publication."
smallest_next_slice = "Design-only finite matrix for exact direct self/sibling, known non-direct builtin/typeop/local/Extern/Brand, missing/foreign/ambiguous sites; name the identity-only index, same-session owner bijection, catalog-gated traversal, and whole-package abort. No code or new public receipt."
non_claims = [
  "physical admission itself issues a target",
  "a source key can be formatted into Global",
  "self/sibling/special-form consume implementation is landed; duplicate validator I0 is already closed separately",
  "all relationless calls are resolved or all recovery is retired",
]

[observed]
current_lineage = "TopLevel and InstanceConstructor are currently collapsed to caller=None before preflight and enter PreparedRawOrdinaryFunctionCompletionV1::Resolved; the D0 must preserve RawInvocationRootLineageV1 until the package disposition."
current_order = "drive_call_arguments_v1 currently precedes resolve_call_target, unique-static recovery, tail recovery, name Const, and direct legacy Call."
admission_product = "NormalTopLevelFunctionDraftAdmissionV1 carries source occurrence and physical symbol/arity but is not a VerifiedCallableIndex target."
index_product = "The observed normal source path has callable_index=None. Existing VerifiedCallableIndexV1 is FreeStatic/exact-i64-only; no general identity-only index exists. ResolvedDirectCallTargetV1 can be issued only after a same-session site index and owner reservation are designed."
handoff_blocker = "SelectedCallable traversal currently defers ordinary FunctionCall before catalog membership; batch forest seals with callable_index=None; selected mapping is published too late. A general index product, catalog gate, owner bijection, and self/sibling/special disposition must be designed before implementation."
duplicate_boundary = "SelectedNormal same effective name/arity duplicates are rejected before body lowering by the landed I0 at ffcae72725; duplicate policy is closed and is not reopened by this handoff."

[finite_state]
states = [
  "DuplicateValidatorClosed",
  "PackageCoSealOwnerMissing",
  "PackageCoSealOwnerReady",
  "GeneralIdentityIndexRepresentationUnresolved",
  "SelectedProfileOrdinaryCallDeferred",
  "CatalogGatedDirectCallReady",
  "KnownNonDirectDisposition",
  "GeneralNormalCallableIndexMissing",
  "ExactI64IndexCohortOnly",
  "SecondResolverContinuationForbidden",
  "OwnersNotReservedBeforeForestSeal",
  "AllTreesReadyForOwnerReservation",
  "SameResolverRootReservationComplete",
  "GeneralIdentityIndexSealed",
  "ExactSiteTargetIssuedBeforeForestPublication",
  "ExactSourceSiteMissing",
  "ExactSourceSiteForeign",
  "ExactTargetAmbiguous",
  "TopLevelSelfExactTarget",
  "TopLevelSiblingExactTarget",
  "SpecialFormOutsideDirectCohort",
  "UnpublishedPackageAbort",
  "TargetedBeforeArguments",
  "TypedRejectBeforeArguments",
  "RawCompatibilityParked",
  "ResolvedFallthroughForbidden",
]
terminal_policy = "Only AllTreesReadyForOwnerReservation -> SameResolverRootReservationComplete -> GeneralIdentityIndexSealed -> exact site disposition may reach a future TargetedBeforeArguments state. KnownNonDirectDisposition uses an existing typed route or rejects; deferred, duplicate, missing, foreign, ambiguous, second-session, and unreserved states abort the unpublished package. ExactI64IndexCohortOnly remains outside; RawCompatibility is Parked; Resolved fallthrough is a guard failure."

[precedence]
required_rows = [
  "exact source-site target versus local Value relation",
  "exact source-site target versus builtin and explicit Extern relation",
  "self-site target versus a same-name sibling",
  "ordinary direct-call site versus known builtin/typeop/Brand special form",
  "complete selected owner inventory versus forest owner reservation",
]
rule = "Precedence may select only an existing authority-backed product; no row may synthesize a target from name/arity or collector order."
unknown = "If local/builtin/Extern precedence cannot be proven at the same exact source site, keep the design NoSafeSlice and do not enter Resolved."

[acceptance]
design = [
  "duplicate SelectedNormal rejection is an explicit prerequisite",
  "VerifiedCallableIndexV1 and ResolvedDirectCallTargetV1 remain unchanged for their exact-i64 owner; no sideways generalization is claimed",
  "the normal semantic package issuer/aggregate is the only proposed co-seal owner for a new identity-only general callable index and resolver continuation",
  "catalog-gated traversal must admit ordinary FunctionCall only after direct-key membership and special-form disposition are known",
  "all selected owner roots are reserved in the same resolver session before forest publication, with a complete owner/site bijection",
  "whole-package abort leaves package install, body lowering, argument effects, block mutation, and Call publication at zero",
  "NormalTopLevelFunctionDraftAdmissionV1 remains a physical/source relation only",
  "the general-normal index/co-seal gap and foreign-continuation risk are explicit NoSafeSlice states",
  "root lineage remains provenance and never stores a synthesized Callee",
  "no target is claimed for the general-normal self route before a valid owner exists",
]
negative = [
  "no code, fixture, new receipt, target inference, recovery deletion, or production switch in this D0",
  "no sibling/constructor/GC target is opened by the self row",
  "no name Const/direct legacy Call or post-argument retry is treated as canonical",
]
implementation_gate = "false; duplicate I0 is closed at ffcae72725. Reopen implementation only after the identity-only index representation, catalog-gated traversal, self/sibling/special disposition matrix, same-session owner bijection, and whole-package abort proof are accepted; an exact-i64 sideways loan or second resolver continuation is forbidden."
guard = "future guard must assert exact index/site target issuance, zero caller=None->Resolved self fallthrough, zero target synthesis from physical_symbol/name/arity, and zero argument effects on missing/foreign/ambiguous states"

[reopen]
triggers = [
  "normal source continues with callable_index=None without a named replacement owner",
  "physical admission or collector becomes target issuer",
  "a target is reconstructed from name/arity, LegacySymbol, or statement order",
  "self reaches post-argument resolver/recovery or name Const publication",
  "sibling/constructor/GC is added to the row without a new bounded Decision",
]
