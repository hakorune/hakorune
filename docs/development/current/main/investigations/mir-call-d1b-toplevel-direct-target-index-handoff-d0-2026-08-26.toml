title = "MIR Call D1B TopLevel direct-target index handoff design"
status = "accepted_design_no_safe_slice"
observed_commit = "98e833b6a7"
observed_at = "2026-08-26"
implementation_permission = false
parent_row = "docs/development/current/main/investigations/mir-call-d1b-root-lineage-exact-target-loan-d0-2026-08-26.toml"
prerequisite = "docs/development/current/main/investigations/mir-call-d1b-selected-normal-duplicate-projection-d0-2026-08-26.toml"
queued_validator = "docs/development/current/main/investigations/mir-call-d1b-selected-normal-duplicate-projection-i0-2026-08-26.toml"
supersedes_candidate = "docs/development/current/main/investigations/mir-call-d1b-toplevel-self-exact-target-loan-d0-2026-08-26.toml"

[boundary]
starts = "SelectedNormal normal-source callable forest and its existing exact source-site products"
ends = "one exact same-source-site ResolvedDirectCallTargetV1 is available to preflight before drive_call_arguments_v1"
includes = [
  "VerifiedCallableIndexV1 membership and exact SourceExprSiteV1 lookup",
  "ResolvedDirectCallTargetV1 issuance by resolved_semantics::resolver",
  "SelectedNormal duplicate validator prerequisite",
  "TopLevel self source-site handoff and missing/foreign/ambiguous rejection",
  "preservation of RawInvocationRootLineageV1 without embedding a target",
]
excludes = [
  "NormalTopLevelFunctionDraftAdmissionV1 as a target authority",
  "physical_symbol/name/arity synthesis, collector last-wins, or source-key formatting",
  "TopLevel sibling, InstanceConstructor ordinary calls, GC special names, and post-argument recovery deletion",
  "Method(None), methodize, CalleeGuard, UnknownBox, callsite canonicalize, final Call schema, CallFlags, VM/backend, and warning cleanup",
]

[brief]
decision = "A TopLevel self call may become canonical only by borrowing an existing exact-site ResolvedDirectCallTargetV1 from the complete callable index. NormalTopLevelFunctionDraftAdmissionV1 remains physical/source admission data, not target selection authority."
source_authority = "complete normal-source callable inventory -> VerifiedCallableIndexV1 -> exact SourceExprSiteV1 -> resolved_semantics::resolver -> ResolvedDirectCallTargetV1."
canonical_issuer = "Existing preflight consumes the resolved target through CalleeResolverBox and the existing MirInstruction::call constructor; this design issues no new receipt."
non_authority = [
  "NormalTopLevelFunctionDraftAdmissionV1 physical_symbol/arity alone",
  "SelectedTopLevelFunctionKeyV1 name/arity, caller=None, LegacySymbol formatting, collector replacement, current_static_box, has_method, GC name classification, header/suffix lookup, args, or post-argument values",
]
fail_fast = "Duplicate policy, callable-index membership, exact source site, and target identity must be proven before semantic forest/body admission and before argument lowering. Missing, foreign, or ambiguous site rejects with zero argument effects."
smallest_next_slice = "Design-only self exact-site handoff matrix: name the existing index owner, the source-site lookup/loan boundary, and the typed terminal for absent or conflicting relation. Sibling, constructor, and recovery remain separate."
non_claims = [
  "physical admission itself issues a target",
  "a source key can be formatted into Global",
  "self handoff implementation or duplicate validator is landed",
  "all relationless calls are resolved or all recovery is retired",
]

[observed]
current_lineage = "TopLevel is currently collapsed to caller=None before preflight and enters PreparedRawOrdinaryFunctionCompletionV1::Resolved."
current_order = "drive_call_arguments_v1 currently precedes resolve_call_target, unique-static recovery, tail recovery, name Const, and direct legacy Call."
admission_product = "NormalTopLevelFunctionDraftAdmissionV1 carries source occurrence and physical symbol/arity but is not a VerifiedCallableIndex target."
index_product = "resolved_semantics::resolver can issue ResolvedDirectCallTargetV1 when an exact callable index and source site are present; normal source currently has callable_index=None in the observed path."
duplicate_boundary = "SelectedNormal same effective name/arity duplicates are accepted by reference as pre-body typed rejects; queued I0 must land before handoff."

[finite_state]
states = [
  "DuplicateValidatorPending",
  "CallableIndexMissing",
  "ExactSourceSiteMissing",
  "ExactSourceSiteForeign",
  "ExactTargetAmbiguous",
  "TopLevelSelfExactTarget",
  "TargetedBeforeArguments",
  "TypedRejectBeforeArguments",
  "RawCompatibilityParked",
  "ResolvedFallthroughForbidden",
]
terminal_policy = "Only TopLevelSelfExactTarget may cross to TargetedBeforeArguments after duplicate validation and exact index/site lookup. Missing/foreign/ambiguous/indexless states reject before effects or remain NoSafeSlice until an owner is named. RawCompatibility is Parked under its own owner; Resolved fallthrough is a guard failure."

[precedence]
required_rows = [
  "exact source-site target versus local Value relation",
  "exact source-site target versus builtin and explicit Extern relation",
  "self-site target versus a same-name sibling",
]
rule = "Precedence may select only an existing authority-backed product; no row may synthesize a target from name/arity or collector order."
unknown = "If local/builtin/Extern precedence cannot be proven at the same exact source site, keep the design NoSafeSlice and do not enter Resolved."

[acceptance]
design = [
  "duplicate SelectedNormal rejection is an explicit prerequisite",
  "VerifiedCallableIndexV1 and ResolvedDirectCallTargetV1 are named as the sole direct-target authority",
  "NormalTopLevelFunctionDraftAdmissionV1 remains a physical/source relation only",
  "exact source site, target identity, and local/builtin/Extern precedence have finite states",
  "root lineage remains provenance and never stores a synthesized Callee",
  "the target is complete before argument lowering and no Installed self enters Resolved",
]
negative = [
  "no code, fixture, new receipt, target inference, recovery deletion, or production switch in this D0",
  "no sibling/constructor/GC target is opened by the self row",
  "no name Const/direct legacy Call or post-argument retry is treated as canonical",
]
implementation_gate = "false until the duplicate I0 is landed, normal source index handoff is proven in the observed route, and precedence/typed terminals are accepted by the parent root-lineage row."
guard = "future guard must assert exact index/site target issuance, zero caller=None->Resolved self fallthrough, zero target synthesis from physical_symbol/name/arity, and zero argument effects on missing/foreign/ambiguous states"

[reopen]
triggers = [
  "normal source continues with callable_index=None without a named replacement owner",
  "physical admission or collector becomes target issuer",
  "a target is reconstructed from name/arity, LegacySymbol, or statement order",
  "self reaches post-argument resolver/recovery or name Const publication",
  "sibling/constructor/GC is added to the row without a new bounded Decision",
]
