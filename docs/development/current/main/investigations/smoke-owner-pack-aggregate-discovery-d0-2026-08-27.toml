title = "Smoke owner-pack aggregate discovery policy design"
status = "accepted_but_not_selected"
observed_commit = "789dbdc181"
observed_at = "2026-08-27"
implementation_permission = false
parent_row = "docs/development/current/main/investigations/mir-call-d1b-root-lineage-exact-target-loan-d0-2026-08-26.toml"

[boundary]
starts = "normal integration profile discovery of aggregate run_all.sh wrappers"
ends = "one explicit policy that prevents nested owner-pack members from being executed twice"
includes = [
  "tools/smokes/v2/profiles/integration/core/phase2050/run_all.sh",
  "tools/smokes/v2/suites/integration/phase2050-owner-pack.txt",
  "tools/smokes/v2/run.sh default integration discovery",
  "SMOKE-OWNER-PACK-EXACT-SELECTION-I0 registry and linkage evidence",
]
excludes = [
  "broad run*.sh discovery conversion",
  "phase semantics or force-hv1 fate",
  "test behavior, fixture changes, VM/Call/Wpre changes, and Cargo execution",
]

[brief]
decision = "Treat only phase2050/run_all.sh as an ExplicitOnlyAggregate: a one-row aggregate-node manifest excludes that exact wrapper from normal integration leaf discovery, while its existing five-entry owner pack remains the sole child authority and direct aggregate invocation remains explicit. Do not generalize this rule to the other integration wrappers."
source_authority = "The checked-in integration profile tree, one aggregate-node manifest row, exact owner-pack suite, and phase2050 aggregate caller body are the sole discovery facts; the selected policy is co-sealed with the owner-pack registry/linkage guard."
canonical_issuer = "The existing smoke runner discovery policy reads the explicit aggregate-node row; no runtime or semantic issuer is created."
non_authority = [
  "profile names alone",
  "run_all.sh echo text",
  "leaf runtime results",
  "wildcard/filter strings",
  "a dry-run row as execution-green evidence",
]
fail_fast = "A missing/duplicate/absolute/foreign aggregate row, child-suite contamination, wrapper invocation count other than one, leaf exclusion, or unclassified policy remains red before the first child effect; no broad discovery change is allowed."
smallest_next_slice = "Implement one explicit aggregate-node row for phase2050/run_all.sh and make normal integration discovery exclude only that path; retain the five leaf entries and verify exact-one direct owner-pack invocation."
non_claims = [
  "does not change default integration discovery yet",
  "does not convert all run_all.sh files",
  "does not retire any force-hv1 or VM route",
]

[evidence]
observed = [
  "owner-pack dry-run selects exactly five phase2050 leaves",
  "phase2050 run_all.sh invokes that owner pack once",
  "normal integration discovery currently sees 963 files",
  "normal phase2050 discovery includes run_all.sh plus the same five leaves",
  "the wider census is 108 scripts across phases2047-2051/2100/2160/2170, with 13 wrappers and 95 leaves",
  "normal discovery duplicates 39 paths through phase2050/2100/2160/2170, but only phase2050 has the one-wrapper/one-exact-pack shape",
]
required = [
  "aggregate fate is explicit and finite: phase2050/run_all.sh = ExplicitOnlyAggregate",
  "normal integration discovery changes from 963 to 962 and phase2050 root selection contains exactly five leaves",
  "nested owner-pack members are selected exactly once in the chosen policy",
  "registry row, suite membership, and aggregate caller remain co-sealed",
  "normal legacy nested suites remain unchanged unless the selected policy covers them",
]

[selected_policy]
owner = "integration"
aggregate_path = "core/phase2050/run_all.sh"
fate = "ExplicitOnlyAggregate"
child_suite = "phase2050-owner-pack"
parent_discovery = "exclude_exact_path"
direct_invocation = "quick_runtime_plus_integration_owner_pack"
other_wrappers = "unclassified_and_unchanged"

[implementation_gate]
permission = false
next_row = "SMOKE-OWNER-PACK-AGGREGATE-EXCLUSION-I0"
allowed_scope = "one aggregate-node manifest row, runner/helper exclusion seam, phase2050 structural guard, focused dry-run/negative evidence"
forbidden_scope = "basename-wide run_all exclusion, other phase wrappers, broad run*.sh conversion, VM/Call/Wpre/force-hv1 semantics"

[reopen]
triggers = [
  "a new aggregate wrapper appears without a declared fate",
  "phase2050 membership or run_all invocation drifts",
  "normal discovery executes an owner-pack member both directly and through its aggregate",
  "a proposed fix broadens run*.sh conversion beyond this boundary",
]
