title = "MIR Call core R6 D1Q publication return Extern issuer"
status = "accepted_design"
observed_at = "2026-08-25"
observed_commit = "f13745d9e0"
implementation_permission = false
implementation_row = "MIR-CALL-CORE-R6-D1Q-PUBLICATION-RETURN-EXTERN-ISSUER-I0"
decision = "MIR-CALL-CORE-R6-D1Q-PUBLICATION-RETURN-EXTERN-ISSUER-I0"
owner = "MIR-CALL-RETIREMENT-v1"

[brief]
decision = "Replace the two publication-return direct Call literals with the thin canonical constructor as one atomic Return family, preserving instruction and terminator Return schedules."
source_authority_and_canonical_issuer = "collect_publication_return_plans seals return position, exact Extern, helper dst, five ordered operands, effects, and copy indices in PublicationReturnPlan; MirInstruction::call is the sole issuer."
non_authority = "return_idx representation, apply-side target/effect reread, Return value, legacy func, backend lookup, PURE defaults, hint/CFG/DCE policy, and block transaction behavior are not target authority."
fail_fast_boundary = "value Return, single-use copy chain, explicit-cold publish, helper, same-block, owned representation, or exact adapter failure yields no plan and zero Call/hint/count publication."
smallest_next_slice = "Change only publication.rs:359-365 and 389-395; add instruction/terminator Return parity and compact the existing guard without appending beyond 777 lines."
non_claims = "No write/host writer, concat9, unified/array/canonicalizer, Method(None), bare FunctionCall, Call schema, MirCall/CallFlags, metadata split, typed-error, backend/wire, fallback, or cleanup change."

[boundary]
starts = "collected PublicationReturnPlan entries from publication_return_site"
ends = "existing Return instruction/terminator rewrite, helper span, hint/count, CFG refresh, and folded metadata refresh"
includes = [
  "the direct Call writer for an instruction Return (return_idx = Some)",
  "the direct Call writer for a terminator Return (return_idx = None)",
  "exact owned Extern mapping, helper destination, five ordered operands, effects, copy removal, and span parity",
]
excludes = [
  "D1P write-boundary and D1O host writers already landed",
  "concat9, unified terminal, array projection, and callsite canonicalizer",
  "Call operand consumer D1N, Method(None), Closure/Constructor, and mandatory-Callee schema",
  "metadata split, typed bridge errors, compiler-builder seam, JSON, VM, backend, and non-selected cleanup lanes",
]

[authority]
source = "PublicationReturnPlan.return_idx, publish_extern, helper_dst, left/middle/right/start/end operands, effects, copy_indices, and helper span"
issuer = "MirInstruction::call(Some(plan.helper_dst), Callee::Extern(plan.publish_extern.to_string()), ordered_args, plan.effects)"
non_authority = [
  "apply_publication_return_plans target or effect recomputation",
  "Return value or return_idx shape as target authority",
  "legacy func, backend lookup, PURE inference, and retry",
  "Return rewrite, spans, hints/counts, CFG, and folded metadata",
]

[finite_matrix]
positive = [
  "instruction Return with ExplicitApiReplay/StableOwned preserves exact Extern, helper dst, five args, non-PURE effects, helper span, and following Return",
  "terminator Return with StableObjectDemand/StableOwned preserves exact Extern, helper dst, five args, non-PURE effects, helper span, and terminator value",
  "copy removal, hint/count, CFG, folded metadata, and Return value parity remain unchanged",
]
negative = [
  "missing/invalid Return relation, helper block/shape, or single-use copy chain -> no plan and no publication",
  "unsupported reason/repr or non-explicit cold publish -> no Call/hint/count and no retry",
]
parity = [
  "instruction and terminator Return states share one PublicationReturnPlan authority and differ only in the existing return_idx projection",
  "D1P/D1O writers, D1N operand consumer, remaining non-publication families, and pre/post-DCE schedule remain unchanged",
]

[delete_set]
file = "src/mir/passes/string_corridor_sink/publication.rs"
lines = "359-365; 389-395"
remove = [
  "two direct transitional MirInstruction::Call literals",
  "func: ValueId::INVALID",
  "callee: Some(...) wrappers",
]
replace_with = "MirInstruction::call(Some(plan.helper_dst), Callee::Extern(plan.publish_extern.to_string()), vec![plan.left, plan.middle, plan.right, plan.start, plan.end], plan.effects)"

[acceptance]
focused_tests = [
  "new instruction-Return publication fixture: exact Extern/dst/five-argument order/READ effects/span and following Return parity",
  "sinks_publication_helper_to_same_block_return_boundary: exact Extern/dst/five-argument order/READ effects/span and terminator Return parity",
]
static_evidence = [
  "collector branches already reject missing/invalid Return relation, helper/block, copy-chain, reason/repr, and non-explicit cold publish before plan issue",
  "the shared corridor guard must check both Return writer windows and forbid direct transitional fields; no fallback/retry evidence is accepted",
]
guards = [
  "mir_call_canonical_corridor_guard proves both Return windows have one plan-owned canonical Call and no direct transitional fields",
  "current_state_pointer_guard",
  "rustfmt on touched Rust and git diff --check",
]
source_limits = "publication.rs is 658 lines; return fixture is 178 lines; corridor guard is 777 lines and must stay <=777 by replacement/compaction; active card is 1000 lines"

[worker_review]
selection = "/root/d2c_consumer_selection_audit: post-D1P census selected D1Q as one atomic Return family; remaining selected writers 14, publication Return family 2"
implementation_permission = "design-only; a separate fast pointer switch is required after this finite state matrix, delete set, guard plan, and upper-worker review remain closed"

[stop_if]
conditions = [
  "instruction and terminator Return states require separate authorities, plan schema changes, or Return semantic changes",
  "any write, host, concat9, unified, array, canonicalizer, schema, metadata, typed-error, backend, or cleanup row enters the diff",
  "guard append would exceed 777 or any touched Rust file reaches 760/800 without a separate split design",
  "negative state produces any plan, Call, hint, count, or retry",
]
