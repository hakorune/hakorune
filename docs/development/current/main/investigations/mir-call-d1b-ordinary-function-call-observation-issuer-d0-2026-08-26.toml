  "SelectedCallable cannot silently drop an ordinary FunctionCall through a closed profile gate",
  "old no-brand ingress cannot be called production or caller-zero without evidence",
  "ExplicitExtern/ASTNode::Call cannot enter ordinary inventory by name shape",
  "missing/foreign/duplicate/ambiguous/lineage-collapsed rows cannot reach package install or effects",
]
parity = "Existing Cataloged and constructor source identities, Brand precedence, ExplicitExtern behavior, and ASTNode::Call handling remain unchanged; this row only fixes observation ownership and ordering."
guard = "future guard must assert three-entrance classification, no closed-gate drop, one observation issuer, owner/site bijection, Brand/special/Extern/ASTNode::Call boundaries, preserved lineage, and zero pre-co-seal effects."

