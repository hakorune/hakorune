profile_gate = "Design the pre-argument observation contract; do not open the SelectedCallable gate until ordinary FunctionCall observation and package co-seal are specified together."
observation_row = "Reuse existing owner/site/lineage authorities and define one same-session transient observation/disposition row; no new public receipt."
brand_precedence = "Keep Brand catalog precedence and Brand arity/site rejection outside ordinary direct inventory."
cohort_boundary = "Keep ExplicitExternCall and ASTNode::Call outside ordinary inventory and give out-of-scope roots explicit reject/park ownership."
guard_witness = "Specify positive/negative witnesses for nested sites, Brand exclusion, constructor identity, old-ingress classification, lineage preservation, and zero effects before co-seal."

