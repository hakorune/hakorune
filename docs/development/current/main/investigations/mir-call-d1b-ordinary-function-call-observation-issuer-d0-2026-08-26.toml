[boundary]
starts = "source-bound SelectedCallable and InstanceConstructor resolver inputs entering the existing shadow FunctionCall observation candidate"
ends = "one owner/site/lineage observation and explicit disposition is co-sealed by the same resolver/package session before package install, body lowering, argument effects, block mutation, or Call publication"
includes = [
  "callable_semantic_batch/issuer.rs production entrance with SelectedCallable identity and Brand catalog",
  "normal_callable_semantic_package/instance_constructor_semantic.rs production entrance with ConstructorSourceIdV1",
  "older builder/normal_callable_semantic_source.rs entrance classification as production, compatibility, or caller-zero",
  "existing shadow/expr.rs FunctionCall branch, Brand precedence, nested source-site uniqueness, and RawInvocationRootLineageV1 carriage",
  "ordinary direct, Brand-special, builtin/typeop/math/fastmem, ExplicitExtern, and ASTNode::Call cohort boundaries",
]
excludes = [
  "Callee/target issuance, name/arity/box/symbol synthesis, exact-i64 index, post-argument recovery, and raw physical lowering",
  "ASTNode::Call or ExplicitExtern integration into ordinary inventory",
  "Method(None), JSON/VM/backend, mandatory-Callee, CallFlags, and warning cleanup",
  "one-line SelectedCallable gate opening without inventory/co-seal and old-ingress classification",
]

[brief]
source_authority = "SelectedCallable resolver identity, InstanceConstructor source identity, existing Brand catalog, parser source site, and RawInvocationRootLineageV1 in the same resolver session"
canonical_issuer = "one existing source-bound resolver/package issuer observes FunctionCall before argument traversal, assigns owner/site/lineage disposition, and hands only a co-sealed validation result to package install"
non_authority = [
  "ShadowDirectCallUseV0 name/arity rows as target authority",
  "SelectedCallable rejection, callable_index=None empty maps, raw Builder brand port, variable_map, AST re-scan, collector order, physical symbol, or a second resolver",
  "ExplicitExtern/ASTNode::Call observation and compatibility ingress unless explicitly classified and parked",
]
fail_fast = "A missing entrance classification, closed traversal with a call, missing/foreign/duplicate/ambiguous owner/site, lineage collapse, or mixed Brand must abort before argument descent/effects, package install, block mutation, or Call publication."
smallest_next_slice = "Design-only entrance census and finite observation/disposition matrix; no profile widening, code, fixture, receipt, or production switch."
non_claims = [
  "ordinary FunctionCall observation is not yet implemented",
  "this row does not issue a Callee, remove Resolved, or retire late recovery",
  "caller-zero is not inferred from text references; the old no-brand ingress needs explicit classification",
]

[entrance_census]
selected_callable = "production: callable_semantic_batch/issuer.rs source-bound resolver; identity and Brand catalog exist, but SelectedCallableV1 currently rejects ordinary FunctionCall before child traversal."
instance_constructor = "production: normal_callable_semantic_package/instance_constructor_semantic.rs; ConstructorSourceIdV1 and constructor forest identity exist, but ordinary raw FunctionCall inventory is not co-sealed."
legacy_source = "compatibility/disconnected candidate: builder/normal_callable_semantic_source.rs resolve_selected_callable_forests ingress; production reachability and caller-zero status are not yet proven."
raw_builder = "production physical/raw ingress: function_call_brand_source_demand.rs and raw_expression_dispatch/mod.rs; this is a consumer/bridge, not the semantic observation issuer."
separate_cohorts = "ExplicitExternCall and ASTNode::Call remain outside ordinary inventory; Brand constructor rows have precedence and must not become ordinary direct rows."

[observation_order]
current_candidate = "shadow/expr.rs records BodyEffect(Call), applies Brand precedence, records brand_calls or direct_calls, then descends arguments; traversal_profile.rs currently closes ordinary FunctionCall before this branch."
required_order = "entrance classification -> source site and owner/lineage observation -> explicit disposition -> same-session co-seal -> argument traversal"
forbidden_order = "profile gate close/drop -> empty map success; argument effects -> resolve/retry; raw brand bridge -> caller=None; second resolver -> inventory"

