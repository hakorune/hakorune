  "ForeignOwnerOrSite",
  "DuplicateSite",
  "AmbiguousDisposition",
  "LineageCollapsed",
  "PackageAbortBeforeEffects",
  "InventoryCoSealed",
  "ParkedCompatibility",
]
terminal_policy = "Only InventoryCoSealed after all three resolver entrances are classified and owner/site/lineage rows are bijective is terminal. Closed-gate, old-ingress-unclassified, missing/foreign/duplicate/ambiguous, and post-effect states remain CutoverBlockerOpen; explicit compatibility may be ParkedSealed."

