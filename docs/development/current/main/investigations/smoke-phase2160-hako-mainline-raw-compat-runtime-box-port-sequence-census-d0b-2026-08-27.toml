[amendment]
reason = "The first runtime-box D0 census collapsed distinct ports, modes, and sequential constructor/method edges into five families. Adversarial re-audit found a sync reject, RawLegacy alternatives, a missing-mode state, and a prefix-before-reject partial-mutation hazard. This amendment is the only active runtime-box design boundary."
