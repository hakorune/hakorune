  "no root/runtime collector sharing",
  "no caller=None source collapse",
  "no AST/name/arity/box-kind synthesis",
  "no loose freeze success, fallback, retry, VM/Wpre re-entry, or partial publication",
]
guard = "A future reusable guard must derive every A-J/K entry and port branch, reject unlisted runtime edges, verify constructor-before-method sequencing, and keep root I1 coverage separate. It must not infer success from a freeze marker or route exit code."

