[brief]
decision = "Keep every runtime Box edge outside root RawCompatibility I1 and split the runtime census by port, mode, and lifecycle sequence. No runtime success route is admitted until source identity, physical shape, lineage, and atomic collector ownership are explicit."
source_authority = "The dispatcher port and its current located RawInvocation source context; runtime lifecycle/batch owners issue only the source relation they already own. RawLegacy remains a separately censused compatibility route."
canonical_issuer = "A future selected runtime owner must issue a private, move-only runtime disposition before child effects; this D0b issues no Callee, target, or semantic receipt."
non_authority = [
  "root RawCompatibility terminal or root outer collector",
  "caller=None, AST/name/params.len()/params.len()+1, box kind, formatted symbol, route filename, or ambient bool",
  "NestedBoxMethod lineage as a target or shape issuer",
  "loose-instance-input freeze treated as success",
  "post-effect resolver, unique/tail recovery, fallback, retry, VM, Wpre, or backend repair",
]
fail_fast = "Synchronous, missing-mode, root-only Main, missing/foreign parent, missing shape, mismatch, duplicate, mixed-port, unavailable collector, or prefix-unsafe constructor states reject/freeze before child effects; no branch may fall through to a different port or family."
smallest_next_slice = "Complete the A-J runtime matrix and its source/shape/lineage/collector/sequence proof, then choose a bounded terminal or explicit retirement per row. Do not open implementation from this card."
census_boundary = "dispatcher BoxDeclaration arm -> runtime recursive module_port or direct RawLegacy terminal; includes all port/mode/lifecycle branches and empty-box completion; excludes root I1 and all downstream execution backends."
non_claims = [
  "does not authorize runtime compatibility implementation",
  "does not widen or alter root I1",
  "does not turn TopLevel/InstanceConstructor source identity into a target",
  "does not claim runtime Box parity, atomic publication, or hako-mainline success",
]

[finite_state]
states = [
  "A_SyncTypedRejectBeforeEffects",
  "B_RawInvocationMainRootOnlyReject",
  "C_RawLegacyMainInlineSuccess",
  "D_MissingModeTypedReject",
  "E_AppStaticDeclarationNoOp",
  "F_RawInvocationStaticNonAppCandidate",
  "G_RawLegacyStaticDirectSuccess",
  "H_InstancePrefixThenLooseReject",
  "I_RawInvocationInstanceMethodCandidateWhenConstructorZero",
  "J_RawLegacyInstanceDirectSuccess",
  "K_EmptyBoxVoidCompletion",
  "OwnerReady",
  "CollectorReady",
  "Retiring",
]
observed = "The current dispatcher has ten semantically distinct outcomes: sync reject; RawInvocation versus RawLegacy Main; missing mode; App no-op; RawInvocation versus RawLegacy non-App static; sequential instance prefix/constructor/method; and empty completion. These are observations only and do not grant a runtime success route."
retain = "A, B, and D remain typed negative terminals. K is an explicit void-completion state only after its owner proves no child publication is required."
retirement_candidates = "C, G, and J are RawLegacy direct/inline routes and need owner-local caller census before retirement; they must not be silently promoted to RawInvocation."
terminal_candidates = "F and I can become runtime compatibility terminals only after exact source-owned shape, located lineage, and atomic collector ownership are proven."
blocked = "H is CutoverBlockerOpen: the current constructor path can reject after prefix mutation. It must reject before prefix or retire/freeze the whole Box path; treating the loose marker as success is forbidden."

[sequence]
order = "BoxDeclaration dispatch -> runtime prefix (field/metadata registration) -> constructors -> methods"
cardinality = "If one or more constructors exist, the method batch is not an independent fate; if constructor count is zero, method edges may be reached. Empty constructor/method sets require explicit K completion."
partial_mutation = "The current loose-instance-input constructor reject occurs after prefix mutation. A future implementation must move exact shape/fate validation before prefix or make the entire Box operation an explicit atomic freeze/retirement terminal."
publication = "RawInvocation method capture uses the recursive module_port collector; RawLegacy direct routes may publish without that collector. A method-N commit followed by method-N+1 failure is not an accepted terminal."

[authority]
source = "RawInvocationSourceTransportV1::current_source_context_v1() with a Located parent and concrete SourceNodeSiteV1; missing or foreign parent is a typed negative. RawLegacy source is its own compatibility owner."
shape = "No runtime canonical shape issuer is present in the observed code. A future issuer must provide symbol plus physical arity before effects; params.len(), +1, or formatted names are validation data at most."
lineage = "PreparedNestedBoxMethodSourceV1::from_located_parent supplies source identity only. It may be carried once, never converted into a target or shape."
collector = "RawInvocation capture/commit goes through the recursive runtime module_port; the root I1 outer drain is a different owner. RawLegacy direct functions have no permission to borrow the root collector."
sequence_owner = "instance_box_declaration_lifecycle.rs owns prefix/constructor/method ordering; constructor and method rows cannot be implemented as unrelated siblings."

