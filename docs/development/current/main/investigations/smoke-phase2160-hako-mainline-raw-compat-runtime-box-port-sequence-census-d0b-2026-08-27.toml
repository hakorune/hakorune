[boundary]
starts = "raw_expression_dispatch::ASTNode::BoxDeclaration, including the synchronous reject and every RawInvocation/RawLegacy port branch"
ends = "one explicit runtime compatibility terminal or one explicit retirement/freeze fate, with source/shape/lineage/collector and sequence ownership named"
includes = [
  "src/mir/builder/raw_expression_dispatch/mod.rs:488-526::BoxDeclaration and sync/Main/static dispatch",
  "src/mir/builder/raw_expression_dispatch/nonmain_static_box_lifecycle.rs:15-58::missing-mode, App no-op, and non-App static branches",
  "src/mir/builder/instance_box_declaration_lifecycle.rs:114-116::runtime instance prefix and constructor/method sequencing",
  "src/mir/builder/instance_box_constructor_batch.rs:117-139::runtime constructor batch",
  "src/mir/builder/instance_box_method_batch.rs:71-95::runtime method batch",
  "src/mir/builder/nested_box_method_source.rs:134-187::located lineage and symbol/arity construction",
  "src/mir/builder/recursive_child_lowering.rs:435-449::runtime module_port capture/commit",
]
excludes = [
