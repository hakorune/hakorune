reuse = "Reuse existing manifest/receipt patterns from guard_manifest_inventory.py and force_hv1_leaf_census.py only for scope/hash/finite-row shape; do not reuse their shell/Rust comment stripping as a Rust parser."
requirements = [
  "token-aware Rust comments, raw strings, nested block comments, attributes, cfg/cfg_attr, macro bodies, and item/range spans",
  "module registration and include/generated ownership are observable rather than inferred from textual caller absence",
  "one deterministic scanner version and scope manifest hash are emitted with every result",
  "summary rows and site rows are distinguishable without adding a semantic receipt type",
]
reject = [
  "comment/string false positives",
  "whole-file cfg(test) classification when only a range is test-gated",
  "wildcard path or regex-only item identity",
  "scanner recovery that silently skips malformed Rust or unknown macro/token shape",
]

