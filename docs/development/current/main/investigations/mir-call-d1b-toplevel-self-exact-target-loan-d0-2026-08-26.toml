[brief]
decision = "With SelectedNormal duplicate/projection rejection closed at ffcae72725, a TopLevel self call remains parked behind the direct-target handoff D0 and may borrow only a same-source/same-resolver-continuation ResolvedDirectCallTargetV1. The physical admission remains a co-sealed source relation, not a target issuer."
source_authority = "complete source callable inventory -> VerifiedCallableIndexV1 -> exact SourceExprSiteV1 -> ResolvedDirectCallTargetV1, with RawInvocationRootLineageV1 preserved as provenance."
canonical_issuer = "Existing resolved target handoff -> CalleeResolverBox -> MirInstruction::call; no new receipt or target issuer."
non_authority = [
  "NormalTopLevelFunctionDraftAdmissionV1 physical_symbol/arity alone",
  "SelectedTopLevelFunctionKeyV1 name/arity, LegacySymbol reformatting, collector winner, current_static_box, has_method, header/module suffix, args, name Const, or post-argument recovery",
]
fail_fast = "Occurrence mismatch, arity drift, foreign relation, or unresolved local/builtin/Extern precedence rejects before drive_call_arguments_v1; arguments lower exactly once only after Targeted."
smallest_next_slice = "After the direct-target index-handoff D0 closes, design the self-site consume/precedence matrix; sibling, constructor, and recovery closure remain separate rows."
non_claims = [
  "no sibling catalog is invented",
  "no constructor symbol becomes a Global",
  "no global legacy-call zero claim outside this bounded cohort",
]

[finite_state]
states = [
  "TopLevelUniqueSelfExact",
  "TopLevelSelfLocalConflict",
  "TopLevelNameMatchArityDrift",
  "TopLevelForeignOccurrence",
  "TopLevelSiblingMissingLoan",
  "TargetedBeforeArguments",
  "TypedRejectBeforeArguments",
  "SelectedNormalDuplicateBlocked",
  "RawCompatibilityParked",
  "ResolvedFallthroughForbidden",
  "PostArgumentRecoveryForbidden",
]
terminal_policy = "Only TopLevelUniqueSelfExact may become TargetedBeforeArguments. Conflicts, drift, foreign/missing relation, and duplicate states reject or remain NoSafeSlice; RawCompatibility is ParkedSealed; Resolved/PostArgumentRecovery are guard failures."

[acceptance]
design = [
  "duplicate SelectedNormal policy is closed by I0 at ffcae72725",
  "self relation is same-source-site and index-owned, not synthesized from physical admission or text",
  "local/builtin/Extern precedence is explicit and finite",
  "reject path has zero argument effects",
  "Installed self lineage cannot enter Resolved or post-argument recovery",
]
negative = [
  "no code, fixture, new receipt, collector change, or production switch",
  "no sibling/constructor target inference and no Method(None) repair",
]
implementation_gate = "false until the direct-target index-handoff D0 and parent scoped-loan lifecycle are closed; duplicate I0 is already closed at ffcae72725."
guard = "future guard must assert self occurrence identity, exact index-owned target identity, and zero Installed->Resolved self fallthrough."

[reopen]
triggers = [
  "self target is reconstructed from name/arity or collector replacement",
  "local/builtin/Extern precedence changes without this Decision update",
  "duplicate policy is bypassed",
  "self call reaches post-argument recovery or a second target issuer",
]
