[boundary]
starts = "the strictly validated 185-row chronic observation receipt and its frozen canonical site keys"
ends = "one reviewed design matrix that records candidate owner/evidence and unresolved successor reasons for every site without authoring the tracked owner map"
includes = [
  "non-overlapping A/B/C cohort assignment for all 185 rows",
  "site-level compile_domain and role candidates backed by tracked owner or registration evidence",
  "candidate owner_ref/evidence_refs and explicit evidence status without claiming Git anchor resolution",
  "successor_status questions and blocking reasons for generated, runtime, mixed, compatibility, guard, and test sites",
  "a finite matrix completeness check against the receipt key set",
]
excludes = [
  "the tracked chronic_measurement_site_owners_v1.toml artifact",
  "expectation TSV, stale threshold, guard registration, or source deletion",
  "filename/grep/warning-count ownership inference or file-wide role inheritance",
  "Git anchor existence resolution, caller-zero proof, retirement authority, compiler/MIR/VM/AOT behavior",
]

[brief]
decision = "Use one design-only evidence matrix to review every receipt site before owner-map authoring. The matrix may record a candidate and its evidence status, but only the later strict owner-map artifact can issue the explicit owner/successor input. Any unresolved or mixed site remains blocking."
source_authority = "The tracked 185-row observation receipt, named tracked owner READMEs/registration edges, and independently reviewed source ownership evidence."
canonical_issuer = "The future owner-map D0 remains the sole owner/successor input issuer; this matrix only organizes the review and cannot publish a complete map or expectation."
non_authority = [
  "filenames, directory names, warning counts, #[allow(dead_code)], grep absence, stale thresholds, generated text, or a file-level mixed label",
  "the matrix's candidate labels, current HEAD, local tests, or unverified path/anchor strings",
  "caller-zero claims, successor guesses, and Retain/Candidate outcomes without named policy evidence",
]
fail_fast = "Reject a matrix that omits, duplicates, reorders, or foreign-maps a receipt key; reject a row with only filename/grep evidence; keep missing owner, mixed role, unknown successor, and unreviewed evidence as blocking rather than filling a default."
smallest_next_slice = "Review the tracked coverage skeleton row-by-row and replace its explicit missing-evidence blockers only with independently verified owner/successor evidence; return to the owner-map D0 only when every row is review-ready without hidden inference."
non_claims = [
  "does not create or validate the tracked owner-map TOML",
  "does not resolve Git references or authorize any row as deletable",
  "does not pin expectation counts or change guards/source/runtime code",
]

[cohorts]
canonical_key = "row_kind + path + byte_start + byte_end + attribute_kind"
receipt_row_count = 185
generated_registry = "79 rows; candidate evidence is module_registry.in.rs plus its compiler/mod.rs include edge; blanket not_required successor is not allowed without a named retention policy"
runtime = "46 rows; 40 builder rows and 6 non-builder rows; split active/disconnected sites using tracked owner evidence, not builder.rs file role"
builder_mixed = "60 rows across 38 files; classify each site independently as runtime, guard_evidence, test_support, compatibility, or recovery; preserve unknown blockers"
overlap_rule = "A/B/C assignments are disjoint and must equal the validated receipt key set exactly once; cohort labels never replace site-level role/domain evidence"

[evidence_contract]
candidate_owner_ref = "tracked path plus explicit symbol/range/edge anchor and pinned revision, recorded as a candidate only until later A1 resolution"
candidate_evidence_refs = "at least one independently reviewable tracked owner or registration edge; no bare path, grep result, or warning count"
successor_status = "required only with a named successor reference; not_required only with an explicit policy owner; unknown remains blocking"
mixed_site_rule = "a file-level role=mixed is never inherited by all rows; each source range receives its own evidence status"
review_state = ["unreviewed", "candidate_evidence", "reviewed_ready_for_map", "blocked_missing_owner", "blocked_mixed_role", "blocked_successor"]

[matrix_schema]
format = "one-row-per-site TSV; no summary rows; candidate fields are non-authoritative until the later owner-map D0"
columns = [
  "ordinal",
  "row_kind",
  "path",
  "byte_start",
  "byte_end",
  "attribute_kind",
  "item_key",
  "line_start",
  "line_end",
  "cohort",
  "compile_domain",
  "compile_domain_status",
  "role",
  "role_status",
  "candidate_owner_ref",
  "candidate_evidence_refs",
  "owner_evidence_status",
  "candidate_successor_status",
  "successor_basis_or_blocker",
  "review_state",
]
empty_rule = "missing evidence is explicit status plus blocker text; empty owner/evidence/successor fields are never silently defaulted"

[generation]
source = "validate_observation_receipt_json(tracked_receipt, bound_source_commit) exactly once; matrix rows follow receipt canonical-key order"
cohort_rule = "A=module_registry.in.rs 79; B=src/mir/builder.rs 40 plus six named runtime rows; C=remaining builder mixed 60 across 38 files"
coverage_assertion = "A/B/C are disjoint and total 185; compare canonical key, order, item_key, and line fields against the receipt; ordinal is display-only"
join_rule = "candidate owner/evidence is joined by canonical key, never by ordinal or item_key alone; any missing, duplicate, foreign, or reordered join is blocking"
evidence_rule = "record tracked owner/registration candidates and a review state; syntax-only references are candidates, not resolved Git anchors"
completion_rule = "only all rows reviewed_ready_for_map with explicit successor basis may reopen tracked owner-map authoring; any unresolved row keeps this design stop active"

