  "the matrix key set equals the validated receipt's 185 canonical keys exactly once and A/B/C cohort totals are 79/46/60 with no overlap",
  "each site has independently recorded compile_domain/role evidence status and a named tracked owner or explicit blocking reason",
  "generated, runtime, and mixed builder sites preserve their distinct evidence boundaries and do not inherit file-level labels",
  "unknown successor or unresolved anchor remains visibly blocking and cannot become not_required by default",
]
negative = [
  "no tracked partial owner-map artifact, expectation TSV, guard registration, or source deletion",
  "no owner or successor inferred from filename, grep absence, warning count, allow attribute, local green, or current HEAD",
  "no Git anchor resolution claim, caller-zero claim, retirement result, or semantic/compiler/runtime change",
]

[guard]
reuse = "Reuse the landed receipt validator and the frozen site-owner-map schema/key contract; no executable guard row is added by this design-only matrix."
required = "Before map authoring, compare matrix keys against the strict receipt, assert disjoint cohort totals, require explicit evidence status for every row, and report unresolved owner/successor evidence as blocking."
no_safe_slice = [
  "the matrix needs to invent an owner, successor, or retention policy",
  "a file-level role or text absence is the only evidence for a site",
  "a partial or unresolved matrix is presented as a complete owner map",
  "the matrix becomes an expectation, guard, or deletion authority",
]

