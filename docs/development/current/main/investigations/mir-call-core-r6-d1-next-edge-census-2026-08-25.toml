title = "MIR Call core R6 D1 next-edge census"
status = "design_stop"
observed_at = "2026-08-25"
observed_commit = "f7a442f524"
implementation_permission = false
decision = "MIR-CALL-CORE-R6-D1-NEXT-EDGE-CENSUS-D0"
owner = "MIR-CALL-RETIREMENT-v1"

[boundary]
starts = "D1M landed selected Rust Call writer inventory and its independent correctness obligations"
ends = "named next fast candidate with source authority, canonical issuer, fail-fast boundary, and finite acceptance matrix"
includes = [
  "remaining selected Rust Call writers and consumers from mir-call-core-r6-d1-manifest",
  "Method(None) producer/reissuer/recovery edges",
  "bare FunctionCall target resolution before argument descent",
  "recursion_depth mutation/restore paths in selected builder call emitters",
  "MirCall/CallFlags internal transport boundary",
]
excludes = [
  "PyVM/reference/Python/WASM and non-selected backends",
  "normal-root 2,595-line manifest and unrelated shelf cleanup",
  "warning retirement, physical-type naming, and root_is_app_mode session cleanup",
  "implementation, fixture edits, fallback additions, or new semantic receipt issuance",
]

[policy]
source_authority = "named existing producer/consumer owner or existing state invariant; no AST/name/metadata reconstruction"
canonical_issuer = "existing exact Callee -> MirInstruction::call, or an explicitly named state-restoration owner for non-Call bugfixes"
non_authority = [
  "local green tests as production claim",
  "target-name Const, func/INVALID, Method(None), backend/name lookup, retry, or default values",
  "new Verified*/Prepared* receipt before source authority and issuer are named",
]
fail_fast = "each candidate must decide target/state before the first irreversible argument, block, wire, or session mutation; an invariant bug must restore the prior state on every terminal path"

[finite_matrix]
positive = [
  "one recursion-depth entry whose success/error path restores the caller-observed entry depth",
]
negative = [
  "Method(None), missing/ambiguous receiver, and bare FunctionCall without an exact pre-argument target claim remain typed reject/NoSafeSlice",
  "recursion overflow, syntax error, compatibility alternate route, and nested emitter error do not poison builder recursion state",
  "MirCall/CallFlags row is not selected while flags have no canonical reader",
]

[[candidate]]
id = "MIRBUILDER-CALL-RECURSION-DEPTH-RESTORE-I0"
status = "candidate_design_only"
scope = "two broken increment owners: src/mir/builder/calls/build.rs:200-216 and src/mir/builder/calls/unified_emitter.rs:132-149"
old_edge = "incremented recursion_depth is returned without decrement on the overflow early return in two call-depth owners"
source_authority = "MirBuilder.recursion_depth session invariant: entry depth is restored after every terminal path"
canonical_issuer = "owner-local decrement immediately before each overflow return; no new semantic receipt or shared counter abstraction"
fail_fast = "increment, reject overflow after logging, and restore the prior depth before returning; normal success/error/alternate routes retain their existing common decrement"
acceptance = [
  "method overflow at entry depth 100 reports entered depth 101, restores exact depth 100, and publishes no MIR/ValueId/metadata",
  "unified overflow at entry depth 100 reports entered depth 101, restores exact depth 100, and publishes no MIR/ValueId/metadata",
  "normal success and post-entry error from a nonzero synthetic entry depth restore the exact prior depth",
  "method pre-entry syntax error and TypeOp alternate leave depth untouched; unified disabled legacy alternate success/error and receipt-required disabled error restore depth",
  "after the synthetic enclosing depth is reset/unwound, the same Builder can be reused without poisoned state",
  "no target, argument order, compatibility policy, or Call schema change",
  "focused existing recursion tests plus one overflow-reuse regression for each selected entrypoint",
]
non_claims = [
  "recursion limit policy changes",
  "panic/unwind restoration, usize::MAX recovery, raw-expression guard behavior, or context lifecycle save/reset/restore",
  "Call target resolution, Method(None), bare FunctionCall, MirCall/CallFlags, or backend behavior",
  "global Builder state refactor outside these two broken increment owners",
]
implementation_permission = false

broken_increment_owners = [
  "calls/build.rs:162-219, reached by ordinary and claim-ingress method-call siblings",
  "calls/unified_emitter.rs:118-183, reached by ordinary/lookup/map-replay and receipt-required facades",
]
retained_balanced_owner = "src/mir/builder/raw_expression_recursion_guard.rs:8-44"
session_boundary_owner = "src/mir/builder/calls/context_lifecycle.rs:70-105"
fixture_assignments = "direct recursion_depth assignments in tests are fixtures, not production increment owners"

