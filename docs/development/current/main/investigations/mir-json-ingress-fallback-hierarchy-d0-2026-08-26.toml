]

[observed]
primary_fallback = "json_artifact::mir_loader may retry v0 after a v1 parse error when substring shape looks like functions/blocks; this is a live fallback-policy blocker, not an acceptance claim."
secondary_callers = "runner::mod and runner::dispatch expose distinct --mir-json-file paths; direct and umbrella callers must be classified before a single classifier can be named."
v1_disposition = "v1 currently writes func=ValueId::new(0) beside an explicit callee, does not read flags, fixes Method certainty/box_kind, defaults missing box_name, forces Extern effects to IO, and aliases env.console.warn/error to nyash.console.log. These are observed legacy edges, not typed-reject behavior."
v0_disposition = "v0 effects default to READ for missing/null/non-array/empty/unknown-only inputs and silently skip unknown entries; Method fields also synthesize fallback box/certainty values. This remains compatibility behavior until an explicit owner policy is selected."
retry_policy = "Explicit v1 rejection must never fall through to v0; genuinely unmarked v0 may enter its owner-local parser once; no third parser or bridge re-entry is permitted."

[finite_state]
v1_ready = "schema/version explicitly v1 and typed parse succeeds -> publish v1 MirModule"
v1_reject = "explicit v1 shape but typed validation fails -> typed v1 terminal reject; no v0 retry"
v1_not_applicable = "no v1 discriminator and explicit v0 shape -> owner-local v0 parser"
v0_ready = "v0 parser succeeds -> publish compatibility MirModule"
both_reject = "Observed legacy behavior may combine v1/v0 errors; required Wpre behavior is selected-decoder failure -> one typed terminal, with no second parser or third-parser retry"
unsupported_shape = "neither v1 nor v0 shape -> typed unsupported-shape terminal"
program_json = "Observed legacy artifact routing may enter Program(JSON v0) after MIR classification; required Wpre behavior selects Program-v0 only from an explicit ArtifactFamily profile and lends the same parsed root to lowering/import consumers"

[acceptance]
required_before_fast = [
  "direct --mir-json-file and umbrella JSON artifact callers are separately inventoried",
  "schema/version discriminator precedence is explicit and tested",
  "v1 rejection cannot silently enter v0 parsing on the primary direct route",
  "v0 compatibility remains available for genuinely unmarked v0 payloads",
  "self-emitter round-trip, malformed-v1, valid-v0, and unsupported-shape parity are recorded",
  "core_bridge/program fallback cannot re-enter the parser owner after a terminal reject",
]
positive = ["valid v1 -> v1 parser", "valid unmarked v0 -> v0 parser", "Program JSON -> Program compatibility owner"]
negative = ["malformed explicit v1 -> v0 retry = 0", "unsupported shape -> no parser retry", "parse error -> no silent default or profile coercion"]
guard = "a future guard must be loader-window scoped; it must not global-grep v0/v1 strings or conflate Program(JSON v0) compatibility"

[deferred_owners]
