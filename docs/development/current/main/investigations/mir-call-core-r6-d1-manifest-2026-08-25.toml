owner = "MIR-CALL-RETIREMENT-v1"
source_of_truth = "git show 6b8e6c8f80:<path>"

# This is a design census, not implementation permission.  Every non-test
# direct Call construction/reconstruction in the selected boundary must occur
# in exactly one row below.  A missing or duplicate row is a blocker.
[boundary]
start = "selected Rust CallTarget/resolver or typed ingress"
finish = "non-test MirInstruction::Call construction/reconstruction/publication"
includes = [
  "selected builder issuers and compatibility entrypoints",
  "JSON-v0 and JSON-v1 ingress",
  "optimizer/pass reconstruction that writes a Call",
  "active SSA PHI rematerialization",
]
excludes = [
  "cfg(test) and *_tests.rs fixtures",
  "archive/**",
  "PyVM/reference/Python/WASM/non-selected C-native routes",
  "selected Rust interpreter, JSON egress, and native preflight consumers",
  "pure Call readers that do not construct or rewrite a Call",
]

[consumer_ledger]
scope = "cross-boundary consumer and fallback obligations; not counted in direct_literal_sites"
authority = "this manifest [[consumer]] rows; durable policy mirror = docs/development/current/main/design/mir-canonical-callsite-lane-ssot.md"

[counts]
direct_literal_sites = 38
live_selected_literal_sites = 26
owner_compatibility_literal_sites = 12
canonical_helper_definitions = 1
direct_helper_callers = 5
old_bounded_ledger_direct_literals_remaining_at_head = 19
unclassified_sites = 0
duplicate_rows = 0
writer_partitions = 4
consumer_partitions = 1

[policy]
canonical_shape = "MirInstruction::Call { dst, callee: Callee, args, effects }"
canonical_issuer = "MirInstruction::call(dst, callee, args, effects)"
target_authority = "route-local resolver or typed ingress; exact Callee is issued once"
non_authority = [
  "func / ValueId::INVALID / numeric zero",
  "target-name Const(String)",
  "MirCall / CallFlags decoration",
  "printer or wire text",
  "optimizer, lifecycle, VM, C, or backend name lookup/retry",
]
fail_fast = "before block.add_instruction, in-place rewrite, wire emission, or object publication"
forbidden_retry = "alternate target, by-name recovery, receiver autoscan, args[0] substitution, metadata re-inference"

[[partition]]
id = "live_selected"
scope = "writer"
disposition = "CutoverBlockerOpen"
allowed_row_dispositions = ["CutoverBlockerOpen", "RetainGuarded"]
meaning = "selected/non-test issuer or reconstructor; each old edge needs its own later cut"
reopen_trigger = "none; this partition is in-boundary and must reach an explicit cut or compatibility owner"

[[partition]]
id = "owner_compatibility"
scope = "writer"
disposition = "OwnerScopedCompatibility"
allowed_row_dispositions = ["Compat", "CutoverBlockerOpen"]
meaning = "owner-local JSON-v0/raw ingress may interpret legacy input once, then publish exact Callee"
reopen_trigger = "a compatibility path publishes Call(callee=None), retries another target, or becomes selected core"

[[partition]]
id = "compiled_caller_zero_reference"
scope = "writer"
disposition = "ParkedSealed"
meaning = "compiled surface with no selected non-test caller; no semantic cut or production activation"
reopen_trigger = "named live caller plus lifecycle owner re-enters the selected boundary"

[[partition]]
id = "cross_boundary_consumer"
scope = "consumer"
disposition = "CutoverBlockerOpen"
meaning = "selected consumer/recovery obligation outside the finite writer census; it cannot issue a new Call target"
reopen_trigger = "consumer becomes a writer, publishes an alternate target, or loses its named selected owner"

[[partition]]
id = "test_only"
scope = "writer"
disposition = "ParkedSealed"
meaning = "fixtures, diagnostics, archives, and test-only constructors are not production evidence"
reopen_trigger = "the owner becomes a selected production route, never a fixture-only green test"

