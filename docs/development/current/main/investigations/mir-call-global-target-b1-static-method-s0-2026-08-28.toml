[brief]
decision = "S0 landed the structural carrier substrate accepted by the parent D1B/B0 design. The carrier remains opaque to consumers, its nested shape follows the Call SSOT, and construction remains guarded repository authority. No Callee::Global, CallTarget, MirInstruction, wire, VM, optimizer, or production route changed."
source_authority = "No source observation or declaration is consumed in this carrier-only row. The future callable-declaration catalog will supply the exact same-module relation; this S0 must not invent an issuer or accept a bare source tuple as proof."
canonical_issuer = "No production issuer is connected in S0. The eventual sole issuer remains src/mir/builder/callable_declaration_catalog after same-session brand and exact StaticBoxMethod relation checks; S0 exposes only the minimal structural carrier construction surface needed by that future owner."
non_authority = "Raw String, parser, From<String>, parse, Display/to_string/as_mir_name, owner/name/arity convenience lookup, registry, CallTarget, CalleeResolverBox, physical symbol, wire codec, backend, optimizer, and test-only construction."
fail_fast = "Empty owner/method/name components reject in the carrier validation tests; nested family construction is explicit. Wrong namespace, duplicate relation, catalog brand, and physical symbol policy remain later owner/projection checks."
smallest_next_slice = "Return to the parent D1B source-inventory/co-seal design row. Keep this carrier disconnected: the first production issuer must remain atomic with the package/loan/consumer cutover."
non_claims = "No Callee payload cutover, CallTarget migration, D1B package/loan/lineage/dispatcher change, FreeFunction/Builtin issuer, wire v2 codec, JSON/VM/backend/optimizer change, or full B1 consumer census."

[boundary]
starts = "The structural target type and its local validation surface"
ends = "A tested, serde-free carrier module that has no production caller and cannot parse or reconstitute a target"
includes = [
  "CanonicalGlobalTargetV1 nested shape: Builtin(Print) and SameModule(FreeFunction/StaticBoxMethod)",
  "opaque accessors, equality, deterministic debug-free structural identity, and static-method component validation",
  "owner-local test-only construction and a reusable production constructor/literal guard",
]
excludes = [
  "Callee::Global payload, CallTarget::Global, MirInstruction::Call, MirCall/CallFlags, and all compiled consumers",
  "Cataloged source observation, package install, lineage mapping, RawDirectCallDispositionLoanV1, raw dispatcher, and fallback/recovery",
  "physical symbol collision, wire projection, JSON, VM/WASM/native, optimizer, Method/Extern/Value, and compatibility ingress",
]

[carrier_shape]
canonical = "CanonicalGlobalTargetV1::Builtin(CanonicalBuiltinGlobalV1::Print) | CanonicalGlobalTargetV1::SameModule(CanonicalSameModuleGlobalTargetV1::{ FreeFunction { name, arity }, StaticBoxMethod { owner, method, arity } })"
consumer_view = "Consumers may inspect the already-typed nested family and fields but cannot parse a String or obtain a target from a formatter. The carrier is opaque to source/physical authority, not a proof of declaration membership."
validation = "S0 rejects empty owner/method/name components and preserves the exact u32 arity. Duplicate relation, catalog brand, and physical symbol collision are later owner/projection policies, not S0 inference."

[authority]
owner = "Structural type: crates/hakorune_mir_defs/src/global_target.rs. Future production issuer: src/mir/builder/callable_declaration_catalog, outside this S0."
construction = "S0 has no production construction caller. Any non-test constructor or direct enum literal added later must be the one named owner and must pass the registered guard; no type-level sole-issuer claim is made across the crate boundary."
forbidden_api = [
  "From<String> or From<&str>",
  "parse/from_wire/to_string/as_mir_name/Display",
  "Default/Unknown/Legacy/sentinel",
  "raw owner/name/arity lookup or registry constructor",
  "Callee::Global(CanonicalGlobalTargetV1) or CallTarget bridge",
]

[allowed_files]
paths = [
  "crates/hakorune_mir_defs/src/lib.rs",
  "crates/hakorune_mir_defs/src/global_target.rs",
  "tools/checks/b1_global_target_static_method_s0_guard.sh",
