[brief]
decision = "Do not invent a runtime compatibility terminal merely because F/I/H are reachable. First prove whether each RawInvocation family has a production or reference claim. If no claim exists, choose pre-effect whole-declaration retire/freeze; if a claim exists, open a separate source/shape/lineage/atomic-collector design."
source_authority = "The concrete RawInvocation caller path, its selected fixture/smoke owner, and an existing successor owner. Text grep alone is not a production claim."
canonical_issuer = "This census issues only a fate disposition. It does not issue a Callee, target, shape, semantic receipt, or collector product."
non_authority = [
  "RawLegacy facade success, root I1 ScriptRoot shape, root outer collector, caller count alone, or a loose freeze marker",
  "AST/name/params.len()/params.len()+1/format! symbol, NestedBoxMethod lineage as target, or route exit code",
  "tests that do not name their semantic owner, legacy direct success, or an unproved LLVM/raw-reference migration claim",
]
fail_fast = "A family cannot be retired without an owner-local caller/fixture census, and cannot be retained without a named source authority, successor/terminal owner, and no-partial-publication boundary. Missing evidence stays CutoverBlockerOpen."
smallest_next_slice = "Re-derive concrete F/I/H RawInvocation callers and fixture claims, classify each as production/reference/test-only/unclaimed, and choose Retire/Frozen versus guarded retention. No code change."
census_boundary = "dispatcher BoxDeclaration -> RawInvocation runtime terminal or freeze, including instance prefix/constructor/method sequence; RawLegacy and root I1 are explicitly separate boundaries."
non_claims = [
  "does not prove caller-zero from lexical absence",
  "does not retire RawLegacyChildLoweringPortV1",
  "does not authorize a shape issuer, lineage loan, collector transaction, or runtime implementation",
  "does not change current runtime behavior or root I1",
]

[finite_state]
states = [
  "ObservedProductionClaim",
  "ObservedReferenceClaim",
  "ObservedTestOnlyClaim",
  "NoReachableSemanticClaim",
  "SuccessorReady",
  "SuccessorMissing",
  "RetireCandidate",
  "RetainGuarded",
  "CutoverBlockerOpen",
]
meaning = "The first four states describe evidence, the next two describe successor readiness, and the last three are dispositions. A lexical caller count never skips directly to RetireCandidate."
retire_rule = "NoReachableSemanticClaim + an explicit pre-effect owner may select RetireCandidate; the retirement row must preserve root/RawLegacy owners and prove zero effects, retries, and partial publication."
retain_rule = "ObservedProductionClaim or ObservedReferenceClaim may select RetainGuarded only with a named source/shape/lineage/collector owner; otherwise it remains CutoverBlockerOpen."

[families]
f_static_nonapp = "RawInvocation static non-App -> nonmain_static_box_method_batch.rs:77-101; current shape is formatted function_name plus later params-derived arity; candidate fate depends on caller evidence and cannot use RawLegacy fallback."
i_instance_method = "RawInvocation instance methods -> instance_box_method_batch.rs:71-95 -> nested_box_method_source.rs:134-187; reachable only when constructor count is zero; method batch is not an independent fate when constructors exist."
