[source_shape_successor_contract]
source = "A located RawInvocation parent from current_source_context_v1() must be tied to the concrete caller and fixture owner; missing/foreign parent rejects before child effects."
shape = "F/I/H have no source-owned symbol+physical_arity issuer at the observed baseline. Do not promote format! or params.len()/+1. If retained, a private move-only nonsemantic shape must be issued before effects by an existing runtime owner or the family stays parked."
lineage = "NestedBoxMethod from_located_parent is provenance only. Current clone/snapshot behavior is not an affine loan; a retained family needs a closure-scoped borrow or an explicit non-retained fate."
collector = "RawInvocation capture/commit currently uses recursive module_port per child. A retained F/I/H successor must collect the entire atomic unit (F all methods, I all methods when constructor-zero, H prefix+constructors+methods) without sharing root I1 or partial publication."
successor = "A successor must be LLVM/AOT, raw-vm-reference, or an owner-local runtime terminal with a named semantic claim. RawLegacy direct lowering is not a successor proof."

