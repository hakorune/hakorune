  "dispatcher also serves an untyped production root Main path",
  "policy needs function/name/root_is_app_mode/AST depth/params.len()/symbol inference",
  "explicit root compatibility or G/J/non-Box behavior changes",
  "helper/prepare effect occurs before query or snapshot cannot prove zero delta",
  "any Cargo command is already running or host resource safety is uncertain",
]

[closeout]
required = "Record focused test command/result, guard result, changed-file line counts, exact old-edge deletion, and pointer transition. Keep implementation status/evidence update in the closeout boundary; do not weaken the D0 acceptance to make the row green."
next_row = "RAWLEGACY-NESTED-MAIN-RETIRE-I0-CLOSEOUT"

