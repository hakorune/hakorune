expected_source_commit = "d9cff5b744edee3b6450db5d0ffc74478f32b49a"
canonical_key = "row_kind + path + byte_start + byte_end + attribute_kind"
hash_rule = "fixed top-level/site field order; sites already in canonical-key order; evidence_refs sorted and duplicate-rejected; empty arrays/strings encoded explicitly; receipt attribute_kind wire spelling reused; compact UTF-8 JSON without trailing newline; SHA-256; TOML formatting excluded"
coverage_rule = "map canonical keys equal the strict receipt canonical keys exactly once; item_key and line_start/line_end are consistency fields"
reference_rule = "syntax only in A0: <tracked-path>#<symbol:name|range:start-end|edge:id>@<40-lowercase-hex-revision>; path is repo-relative POSIX and forbids absolute paths, .., backslash, and whitespace; Git existence/anchor resolution is A1"

