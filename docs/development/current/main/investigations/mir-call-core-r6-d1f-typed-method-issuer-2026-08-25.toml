title = "MIR Call core R6 D1F typed Method issuer"
status = "landed"
observed_commit = "bc15189bf8"
observed_at = "2026-08-25"
implementation_permission = true
landed_commit = "572ec6f5b1"

[boundary]
starts = "caller-provided receiver ValueId and method metadata entering the existing method SSOT helper"
ends = "one MirInstruction::Call draft returned by src/mir/ssot/method_call.rs"
includes = [
  "src/mir/ssot/method_call.rs:61-83",
  "src/mir/instruction/tests.rs:267-356",
  "tools/checks/mir_call_canonical_corridor_guard.sh",
  "src/mir/README.md",
]
excludes = [
  "D1B Method(None) issuers and recovery terminals",
  "D1C1 bare FunctionCall lineage",
  "normal-main D1E receipt already landed",
  "runtime_method_call caller fanout",
  "JSON, VM, native, optimizer, or backend consumers",
  "func/Option<Callee> core schema deletion",
  "CallFlags, Closure, Constructor, and warning retirement",
]

[decision]
summary = "Normalize the existing typed Method(Some(receiver)) SSOT helper through MirInstruction::call without changing receiver/args encoding, metadata, effects, or callers."
source_authority = "caller/resolver-issued receiver ValueId plus box_name, method, certainty, and box_kind already accepted by method_call"
canonical_issuer = "MirInstruction::call(dst, Callee::Method { receiver, box_name, method, certainty, box_kind }, args, effects)"
non_authority = [
  "func: ValueId::INVALID",
  "Method(None)",
  "receiver-prefixed args as target authority",
  "box/name lookup or static-method reclassification",
  "optimizer/JSON/runtime/backend recovery",
]
fail_fast = "helper entry requires a supplied receiver ValueId; the helper only preserves that structural presence and does not validate ValueId definition/ownership or metadata semantics; no target lookup or retry occurs"
no_retry = "no receiver synthesis, Method(None) conversion, name lookup, or argument rewriting"
smallest_next_slice = "replace only method_call.rs:71-83 with one MirInstruction::call invocation, update the stale module comment at method_call.rs:5, then update the existing corridor guard, focused method parity receipt, and MIR README"
non_claims = [
  "D1B Method(None) retirement",
  "D1C1 bare FunctionCall handoff",
  "Call core field deletion",
  "JSON/VM/native/backend changes",
  "CallFlags/Closure/Constructor changes",
  "warning cleanup",
]

[state_matrix]
receiver_present = "supplied receiver ValueId plus opaque method metadata -> canonical Method(Some(receiver)) Call"
receiver_absent = "not representable by this helper API -> no default and no delegation to Method(None); D1B remains the owner"
receiver_present_but_invalid = "D1F does not inspect ValueId definition/ownership -> preserve and let existing verifier/caller policy decide"
metadata_conflict = "D1F does not classify or reject metadata conflict -> preserve opaque fields and retain existing caller semantics"
method_none = "outside this row -> remain D1B CutoverBlockerOpen; no static/instance guess"
unsupported_consumer = "outside selected backend/consumer -> ParkedSealed; no parity expansion"

[fanout]
runtime_method_call = "10 non-test production call sites across 7 owner files; wrapper and caller behavior are excluded from the edit"
direct_method_call = "method_call helper itself plus 3 optimizer callsite_canonicalize/pass.rs construction sites; only the SSOT helper literal is in scope"
inventory_delta = "direct canonical issuer sites 7 -> 8 and direct legacy literal sites 36 -> 35; these counters do not claim runtime_method_call fanout reduction"

[proof]
positive = [
  "test_method_call_instruction",
  "test_method_call_getfield_instruction",
  "test_method_call_setfield_instruction",
  "receiver, box_name, method, certainty, box_kind, dst, args, and effects parity",
]
negative = [
  "method_call.rs contains no direct MirInstruction::Call literal after cutover",
  "func: ValueId::INVALID and callee: Some( are absent from the helper",
  "Method(None), lookup, retry, and fallback remain absent",
]
parity = ["callee", "receiver/args occurrence order", "dst", "effects", "instruction shape"]
guards = [
  "bash tools/checks/mir_call_canonical_corridor_guard.sh",
  "bash tools/checks/current_state_pointer_guard.sh",
  "git diff --check",
]
stop_if = [
  "optional receiver or static classification is required",
  "caller fanout or receiver-prefixed argument order changes",
  "runtime_method_call needs a separate target policy",
  "JSON/VM/backend code must be edited",
  "method_call.rs reaches 760/800 lines",
]

[acceptance]
status = "landed"
implementation_commit = "572ec6f5b1"
focused_test = "instruction::tests::test_method_call_instruction plus getfield/setfield parity"
expected_inventory_delta = "one canonical helper delegation; direct literal 36 -> 35; canonical helper caller fanout 7 -> 8"
implementation_scope = "one existing owner, stale module-comment correction, one shared guard extension, one README receipt; no new semantic receipt"
review = "read-only upper-worker census selected this as the sole next bounded issuer after D1E"

[guard_contract]
helper_exactly_once = "method_call.rs contains exactly one MirInstruction::call( invocation"
legacy_zero = "method_call.rs contains zero MirInstruction::Call {, func:, and callee: Some( fragments"
typed_target = "Callee::Method with receiver: Some(receiver) remains the only target construction"

[receipt]
status = "landed"
focused_tests = "test_method_call_instruction + test_method_call_getfield_instruction + test_method_call_setfield_instruction + test_method_call_not_rewritten_even_if_legacy_env_is_set: 4 passed; operand_view_accepts_*: 3 passed"
guards = "mir_call_canonical_corridor_guard + current_state_pointer_guard + rustfmt + diff check: green"
baseline_guard = "normal_source_plan0_guard remains a pre-existing module-registry declaration baseline failure; unrelated to this row"
parity = "receiver target, box/method/certainty/kind metadata, dst, args order, effects, and receiver-prefixed operand view unchanged"
source_risk = "147-line method_call.rs owner; runtime_method_call callers and optimizer/JSON/VM/backend consumers unchanged"

[reopen]
triggers = [
  "receiver becomes optional",
  "Method(None) is emitted by the helper or a new caller",
  "target classification or argument rewriting enters the helper",
  "Constructor/Closure/CallFlags becomes a method helper concern",
]
