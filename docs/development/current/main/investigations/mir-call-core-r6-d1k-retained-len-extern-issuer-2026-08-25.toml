no_publication_claim = "retained-len apply with zero input plans publishes no Call, hint, rewrite count, CFG update, or folded-metadata refresh from this owner; earlier whole-pass phases are non-claims"
no_retry = "one same-index replacement writer; no target lookup, re-planning, second writer, or fallback"
smallest_next_slice = "replace retained_len.rs:100-106 with one canonical MirInstruction::call, extend the shared guard window, extend the existing retained-len parity test for effects/hint, add the empty-plan negative, update README, and run focused tests"
non_claims = [
