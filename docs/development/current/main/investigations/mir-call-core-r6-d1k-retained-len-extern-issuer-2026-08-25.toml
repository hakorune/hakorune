  "legacy func or INVALID decoration",
  "outer Method/box metadata, runtime/backend lookup, or target reclassification",
  "EffectMask::PURE override when plan.effects is supplied",
  "optimization hints, DCE, metadata, or other string-corridor writers as target authority",
