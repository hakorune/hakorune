  "one scanner pass produces exactly 185 DeadCodeAllowance rows with canonical-key uniqueness and deterministic ordering",
  "three path/item_key collision pairs remain separate because byte range and attribute_kind are retained",
  "source_commit is explicit 40-hex and scanner/scope/source/evidence provenance is copied exactly",
