title = "MIR Call core R6 D1P publication write-boundary Extern issuer"
status = "fast"
observed_at = "2026-08-25"
observed_commit = "28fdd2c8bc"
implementation_permission = true
implementation_row = "MIR-CALL-CORE-R6-D1P-PUBLICATION-WRITE-BOUNDARY-EXTERN-ISSUER-I0"
decision = "MIR-CALL-CORE-R6-D1P-PUBLICATION-WRITE-BOUNDARY-EXTERN-ISSUER-I0"
owner = "MIR-CALL-RETIREMENT-v1"

[brief]
decision = "Replace one publication write-boundary direct Call literal with the thin canonical constructor while preserving Store/FieldSet rewrite and the post-Call schedule."
source_authority_and_canonical_issuer = "The private PublicationWriteBoundaryPlan owns helper dst, exact Extern, five ordered operands, and effects; MirInstruction::call is the sole issuer."
non_authority = "Store/FieldSet shape, apply-side metadata reread, legacy func, backend symbol lookup, PURE defaults, DCE/CFG policy, and hint/count bookkeeping are not target authority."
fail_fast_boundary = "Copy-chain, explicit-cold reason/repr, helper, same-block, effect-safe, empty-plan, or missing-block failure produces zero plan/Call/hint/count publication."
smallest_next_slice = "Change only publication.rs:469-475; add Store and FieldSet parity and compact the existing corridor guard rather than append beyond 777 lines."
non_claims = "No return writer, host writer, concat9, unified/array/canonicalizer, Method(None), bare FunctionCall, schema cutover, metadata split, typed-error, backend/wire, fallback, or cleanup change."

[boundary]
starts = "collected PublicationWriteBoundaryPlan entries for Store or FieldSet instructions"
ends = "existing write-boundary value rewrite, hint/count update, CFG refresh, and folded metadata refresh"
includes = [
  "one direct publication write-boundary Call writer",
  "Store and FieldSet boundary forms",
  "ExplicitApiReplay/StableOwned and StableObjectDemand/StableOwned Extern mapping",
  "helper destination, five ordered arguments, effects, copy removal, span, and existing rewrite schedule",
]
excludes = [
  "publication host writer already landed at d2826802f3",
  "the two return writers, concat9, unified terminal, array projection, and callsite canonicalizer",
  "Call operand consumer D1N, Method(None), Closure/Constructor, and mandatory-Callee schema",
  "metadata split, typed bridge errors, compiler-builder seam, JSON, VM, backend, and non-selected cleanup lanes",
]

[authority]
source = "PublicationWriteBoundaryPlan.helper_dst, publish_extern, left/middle/right/start/end operands, effects, and copy_indices"
issuer = "MirInstruction::call(Some(plan.helper_dst), Callee::Extern(plan.publish_extern.to_string()), ordered_args, plan.effects)"
non_authority = [
  "apply_publication_write_boundary_plans target or effect recomputation",
  "Store/FieldSet fields as a target source",
  "legacy func, backend lookup, PURE inference, and retry",
  "rewrite_publication_write_boundary_value, spans, hints/counts, CFG, and folded metadata",
]

[finite_matrix]
positive = [
  "Store boundary with ExplicitApiReplay/StableOwned preserves exact Extern, helper dst, five args, and effects",
  "FieldSet boundary with StableObjectDemand/StableOwned preserves exact Extern, helper dst, five args, and effects",
  "existing copy removal, helper span, boundary rewrite, hint/count, CFG, and folded metadata remain unchanged",
]
negative = [
  "non-Store/non-FieldSet boundary -> no plan and no publication",
  "missing/foreign helper block, missing helper shape, unresolved copy chain, or intervening impure instruction -> no publication",
  "unsupported reason/repr, non-explicit cold publish, or empty plan -> no Call/hint/count and no retry",
]
parity = [
  "Store and FieldSet both retain their original boundary fields while only the value becomes helper dst",
  "D1O host writer, D1N operand consumer, return writers, and pre/post-DCE schedule remain unchanged",
]

[delete_set]
file = "src/mir/passes/string_corridor_sink/publication.rs"
lines = "469-475"
remove = [
  "direct transitional MirInstruction::Call literal",
  "func: ValueId::INVALID",
  "callee: Some(...) wrapper",
]
replace_with = "MirInstruction::call(Some(plan.helper_dst), Callee::Extern(plan.publish_extern.to_string()), vec![plan.left, plan.middle, plan.right, plan.start, plan.end], plan.effects)"

[acceptance]
focused_tests = [
  "sinks_publication_helper_to_same_block_store_boundary: exact Extern/dst/five-argument order/effects and Store parity",
  "sinks_publication_helper_to_same_block_fieldset_boundary: exact Extern/dst/five-argument order/effects and FieldSet parity",
]
static_evidence = [
  "collector branches already reject unsupported boundary shapes, missing helper/block, copy-chain, reason/repr, and intervening-effect states before plan issue",
  "existing D1O corridor guard must be compactly extended to the write-boundary window; no new fallback or retry evidence is accepted",
]
guards = [
  "mir_call_canonical_corridor_guard proves the write-boundary window has one plan-owned canonical Call and no direct transitional fields",
  "current_state_pointer_guard",
  "rustfmt on touched Rust and git diff --check",
]
source_limits = "publication.rs is 659 lines and boundaries.rs is 632 lines; corridor guard is 777 lines and must stay <=777 by replacement/compaction; active card is 1000 lines"

[worker_review]
selection = "/root/d2c_consumer_selection_audit: post-D1O census selected D1P as the smallest remaining exact-target writer; remaining selected writers 15, publication family 3"
implementation_permission = "fast I0 permitted after the finite matrix, delete set, guard plan, and upper-worker review; no other writer or consumer is admitted"

[stop_if]
conditions = [
  "PublicationWriteBoundaryPlan fields must be recomputed, a second resolver is introduced, or Store/FieldSet semantics change",
  "any return, host, concat9, unified, array, canonicalizer, schema, metadata, typed-error, backend, or cleanup row enters the diff",
  "guard append would exceed 777 or any touched Rust file reaches 760/800 without a separate split design",
  "negative state produces any plan, Call, hint, count, or retry",
]
