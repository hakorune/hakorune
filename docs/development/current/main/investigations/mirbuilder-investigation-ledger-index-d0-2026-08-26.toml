title = "MirBuilder investigation ledger identity and index design"
status = "accepted_design_no_safe_slice"
observed_at = "2026-08-26"
observed_commit = "6f20547f21"
implementation_permission = false
owner = "MIRBUILDER-FINAL-PIPELINE-v1"
related_current = "docs/development/current/main/CURRENT_STATE.toml"
decision = "Before selecting another documentation or guard row, define one bounded investigation-ledger schema with stable row_id, one [edges] relation form, an explicit scope inventory, and an INDEX guard. Repair known parse/date/registration defects only through that owner; do not bulk-edit every TOML in current/main."

[boundary]
starts = "selected active-row TOML cards under docs/development/current/main/investigations and their executable guard registrations"
ends = "machine-verifiable inventory with parse success, unique row identity, resolved symmetric edges, allowed status/date values, and registered guard scripts"
includes = [
  "explicitly enumerated investigation-row cohort only; design/archive/history prose remains outside until added to scope",
  "known duplicate-key TOML at mir-call-r6-late-legacy-target-issuer-retire-i0-2026-08-25.toml",
  "future-dated 2026-08-27 filenames and their active/parked ownership classification",
  "tools/checks/guard_rows.toml plus included manifests and recently landed child guards",
]
excludes = [
  "normal-root-execution-atomic-cutover-manifest-d0-2026-08-23.md (large historical manifest; separate owner)",
  "all design/archive TOML, fixture JSON row_id fields, and free-form markdown chronology",
  "Call target authority, mandatory-Callee schema, Method(None), JSON ingress semantics, or performance implementation",
]

[brief]
source_authority = "the explicitly declared investigation-card inventory and each card's own row metadata; filenames and prose links are observations, not identity authority"
canonical_issuer = "a future ledger-index checker that parses the bounded inventory, resolves [edges], and reports typed failures; it issues no semantic product"
non_authority = [
  "filename dates, title text, line-number references, duplicate/legacy relation keys, guard script presence alone, and local green",
  "a claimed count such as 41 cards or six unregistered guards before the scoped inventory is sealed",
]
fail_fast = "before a row is selected or marked terminal: parse every scoped card, reject duplicate/missing row_id, unresolved/asymmetric edge, unknown status, future date without owner, broken TOML, and executable guard absent from its declared profile"
smallest_next_slice = "design-only schema D0: enumerate the bounded card set, choose row_id/edges keys and allowed status/date vocabulary, assign the duplicate-key repair owner, and specify the INDEX guard's finite checks"
non_claims = [
  "no rename or bulk rewrite of the 74 current-main TOMLs",
  "no semantic acceptance or implementation permission for any child row",
  "no automatic deletion of old relation fields before a complete migration map exists",
  "no performance/native Linux run",
]

[observed]
toml_inventory = "The bounded investigation cohort is 59 TOML files under docs/development/current/main/investigations; all 59 parse with tomllib after the one-line decision_id repair and receiver-encoding census card. This is not a repository-wide green claim and does not include the large normal-root manifest."
known_parse_failure = "Resolved at 7d7258ea73: the Call-R6 late-legacy-target card now keeps its identifier as decision_id beside the structured [decision] table. Future INDEX checks must still reject duplicate keys and unclassified dates."
future_filename_inventory = "four investigation filenames carry 2026-08-27 while observed_at remains 2026-08-26: three Call docs-slim rows and one interpreter-externals evidence row. Classify active/parked/out-of-scope before any rename."
guard_manifest = "tools/checks/guard_rows.toml currently reports 103 rows (29 root rows plus the included 74-row manifest). At least four referenced guards are not registered: mir_call_canonical_corridor_guard.sh, mir_call_d1b_exact_target_child_guard.sh, mir_call_d1b_selected_normal_duplicate_projection_guard.sh, and normal_source_plan0_transaction_guard.py; the externals retirement guard is referenced but absent. The newly landed index-none safety guard is registered."
relation_drift = "current cards use mixed parent_row/parent_child/source_lineage_child/selected_child/next_child/evidence_child/supersedes forms (15 relation-key spellings); no single [edges] graph is yet machine-resolvable."
identity_drift = "the bounded investigation cohort currently has zero top-level row_id fields and zero [edges] tables; identity and relation migration remain unstarted and must not accept a dual-format cutover."

[verification]
source = "read-only adversarial D0a audit, one-line ledger repair, and receiver-encoding census at 6f20547f21; no code, fixture, or Cargo change"
terminal_policy = "the related relationless-recovery card already says first, tenth, or ParkedSealed; the old ninth wording is not a current blocker"
remaining_tasks = [
  "schema D0: freeze row_id, [edges] roles, status/date vocabulary, scope, and one-way cutover",
  "parse repair: assign the duplicate scalar/table key to the Call-R6 closeout owner",
  "date census: classify the four 2026-08-27 filenames before any rename",
  "guard registration: route four unregistered guards and separately disposition the absent externals guard",
  "INDEX guard: implement only after schema and scope are sealed",
]
task_order = "schema -> parse/date/guard ownership -> one-shot row_id/[edges] migration -> INDEX checker"
implementation_gate = "design_stop only; no dual-format acceptance, no bulk TOML rewrite, and no semantic or production code change"

[finite_state]
states = [
  "ScopeUnsealed",
  "ScopeSealed",
  "ParseFailure",
  "DuplicateRowId",
  "MissingRowId",
  "LegacyRelationKey",
  "UnresolvedEdge",
  "AsymmetricEdge",
  "UnknownStatus",
  "FutureDateOwned",
  "FutureDateUnowned",
  "GuardUnregistered",
  "GuardRegistered",
  "InventoryExhausted",
  "IndexGuardReady",
]
terminal_policy = "Only InventoryExhausted -> IndexGuardReady is terminal for this design. ParseFailure, duplicate/missing identity, unresolved/asymmetric edges, unowned future dates, and unregistered guards remain CutoverBlockerOpen; historical/out-of-scope files require an explicit owner and reopen trigger before ParkedSealed."

[subtasks]
schema_d0 = "Define row_id, [edges] roles, status vocabulary, date relation, explicit scope include/exclude, and one-way migration rule; no dual-format acceptance after cutover."
parse_repair = "Assign the duplicate decision key/table repair to the Call-R6 closeout owner; preserve the decision identifier and structured summary without changing the landed semantic claim."
date_census = "Classify the four 2026-08-27 filenames as active, parked, or out-of-scope; rename only in a dedicated docs-slim row after owner and backlinks are known."
guard_registration = "Inventory every executable child guard in the bounded scope, register it in the correct guard_rows profile or explicitly record why it is not a manifest row; include the four unregistered references and the absent externals guard without asserting an unsealed six-row count. Keep the active D1B guard registration as the positive parity witness."
index_guard = "Implement the checker only after schema D0: tomllib parse, unique row_id, edge target/symmetry, status vocabulary, date consistency, scope coverage, and guard registration."

[acceptance]
positive = [
  "all scoped cards parse with tomllib",
  "every scoped card has one stable row_id and all relations are represented in [edges]",
  "every edge resolves within the declared scope or carries an explicit external-owner disposition",
  "status/date and guard profile checks are machine-reported",
]
negative = [
  "broken TOML cannot be hidden by excluding its file",
  "future filename cannot become current authority by date spelling alone",
  "new child guard cannot land outside the manifest without a recorded owner/reopen trigger",
  "legacy relation keys cannot be silently accepted after migration",
]
parity = "existing current pointer and selected card semantics remain unchanged; this row only verifies ledger topology and guard routing"

[reopen]
triggers = [
  "a new investigation card introduces a relation key outside [edges]",
  "the scoped inventory changes without a corresponding INDEX update",
  "a guard is added or removed without profile registration evidence",
  "a filename date differs from observed_at/date without an owner disposition",
]
