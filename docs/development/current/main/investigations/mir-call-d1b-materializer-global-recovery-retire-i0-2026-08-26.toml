  "GlobalPresenceAuthorityV1, try_global_additional_resolvers_with_authority, AdditionalGlobalResolver, and materializer Global name-Const/direct-Call recovery are zero",
  "no resolver error is retried through header lookup, unique-static catalog lookup, name Const, or alternate Call publication",
  "methodize receiver: None remains observable and is explicitly outside this row, not silently deleted",
]
parity = "before/after existing Global, Extern, Method(Some), Constructor, Value, and Closure physical receipt outcomes; no synthetic Err fixture"
focused_tests = [
  "CARGO_BUILD_JOBS=4 cargo test --profile quick --lib mir::builder::calls::resolver::tests",
  "CARGO_BUILD_JOBS=4 cargo test --profile quick --lib mir::builder::calls::unified_emitter::physical_receipt_tests",
]
guard = "extend tools/checks/mir_call_d1b_exact_target_child_guard.sh with scoped resolver-total, unified-emitter Err-arm, materializer-recovery, and AdditionalGlobalResolver zero checks; no global grep"

