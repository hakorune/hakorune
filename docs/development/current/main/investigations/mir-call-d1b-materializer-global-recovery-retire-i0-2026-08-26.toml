[brief]
decision = "Delete only the unreachable Global Err-side alternate recovery; preserve the Result API as typed future-error propagation and leave RuntimeData methodize as the parent blocker."
source_authority = "CallTarget owner supplies the target; CalleeResolverBox is the sole current resolver and its six finite arms all return Ok(Callee) at the observed commit."
