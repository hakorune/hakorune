non_authority = [
  "GlobalPresenceAuthorityV1 and invocation-header/module presence for canonical target selection",
  "materializer name Const, legacy MirInstruction::Call, unique-static retry, AdditionalGlobalResolver enum",
  "resolver Result error as permission to search another target",
]
fail_fast = "future resolver errors propagate immediately through ?, without name Const, header lookup, catalog retry, or alternate Call publication"
smallest_next_slice = "Remove the Global recovery helper/Err arm/alternate route, extend the existing scoped D1B guard, and run resolver plus unified physical-receipt focused tests."
non_claims = [
  "RuntimeData qualified Global provenance or HAKO_MIR_BUILDER_METHODIZE behavior",
  "Method(None) retirement, parent Row B closure, or mandatory-Callee schema cutover",
  "late compatibility resolver, static_resolution tail recovery, JSON/backend behavior, or warning/panic census",
]

[finite_state]
resolver_total_observed = "CallTarget::Global, Method, Constructor, Extern, Value, and Closure each return Ok(Callee) in resolver.rs:63-159; the body contains no Err arm."
future_resolver_error = "retain Result<Callee, String>; a newly introduced Err must terminate the selected emitter with no alternate target search"
