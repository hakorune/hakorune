  "src/mir/builder/calls/resolver.rs:63-159 finite CallTarget resolution body and focused totality evidence",
  "existing D1B child guard, unified physical-receipt tests, and resolver tests",
]
excludes = [
  "unified_emitter.rs:409-463 RuntimeData methodize and every Method(None) producer",
  "materialize_receiver_in_callee and active Method(Some) receiver handling",
  "build.rs relationless compatibility late resolver, static_resolution tail recovery, and Cataloged child",
  "JSON-v0/v1 ingress, VM/C/backend routes, MirCall/CallFlags, final Call schema, and ArrayElementWrite",
