methodize = "active RuntimeData Global -> Method(None) reissuer at unified_emitter.rs:409-463; CutoverBlockerOpen and outside this row"
receiver_materialization = "active Method path; RetainGuarded and unchanged"

[delete_set]
materializer = [
  "GlobalPresenceAuthorityV1",
  "CallMaterializerBox::try_global_additional_resolvers_with_authority",
  "header/legacy presence checks, name-Const creation, legacy Call emission, and unique-static retry inside that helper",
  "recovery-only imports; retain CallMaterializerBox and materialize_receiver_in_callee",
]
unified_emitter = [
  "resolver.resolve(target.clone()) match Err branch",
  "GlobalPresenceAuthorityV1 and CallMaterializerBox recovery imports/references",
  "UnifiedCallAlternateRouteV1::AdditionalGlobalResolver publication",
]
physical_terminal = [
  "UnifiedCallAlternateRouteV1::AdditionalGlobalResolver only; retain all other alternate routes",
]
preserve = [
  "resolver Result signature and all six finite target arms",
  "RuntimeData methodize window, Method(Some) receiver materialization, and generic physical emission",
]

[acceptance]
positive = [
  "Global/Extern/Method/Constructor/Value/Closure resolver matrix remains green and produces the same Callee variants",
  "existing unified physical-receipt and selected terminal tests preserve dst, args, effects, result, and annotations",
  "generic Global emission no longer enters a presence/header/catalog alternate route",
]
