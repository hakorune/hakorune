effect_vocabulary = "Decide and document semantic BodyEffect ordering separately from physical argument effects and MIR emission; no implicit meaning from the word effect."
lineage_loan = "Choose an existing typed Raw lineage loan or explicitly park the semantic/raw split; caller=None and new public receipts are forbidden."
special_owner = "Name an existing call-name policy owner for KnownNonDirect or park special/builtin/Extern rows without target synthesis."
exact_i64_guard = "Explicitly exclude or guard the exact-i64/main-direct-call cohort and FullFunction routes from ordinary inventory claims."
old_ingress = "Mark old normal_callable_semantic_source as ParkedSealed with a production-caller reopen trigger until its non-test reachability is proven."

