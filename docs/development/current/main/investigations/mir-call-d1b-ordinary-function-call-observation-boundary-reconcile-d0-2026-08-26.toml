  "PackageAbortBeforeEffects",
]
terminal_policy = "Only BoundaryReconciled after every production entrance is classified, semantic/physical effect vocabularies are separated, Raw lineage boundary is explicit, and non-direct owner is named is terminal for this design. ExactI64/legacy may be ParkedSealed only with owner and reopen trigger; all unresolved states remain CutoverBlockerOpen."

[subtasks]
