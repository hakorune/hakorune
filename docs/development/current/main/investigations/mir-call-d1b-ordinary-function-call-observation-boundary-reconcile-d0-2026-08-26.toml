[boundary]
starts = "all known production and compatibility resolver, planner, and raw-bridge entrances that can observe or lower ordinary FunctionCall, including source-bound SelectedCallable/InstanceConstructor, normal Main source preparation, target-bearing and facts-only FullFunction plans, post-effect planner producers, old no-brand ingress, and the shadow FunctionCall branch"
ends = "one finite boundary classification and one canonical observation/co-seal contract exists, with exact-i64/FullFunction/planner/out-of-scope rows explicitly classified or owned before any profile widening"
includes = [
  "src/mir/compiler/normal_source_plan/main_direct_call_source.rs normal Main source-preparation route; exact-i64 is a downstream capability/profile cohort",
  "canonical_core_dispatch/callable.rs, main_resolved_source.rs, instance_function_plan.rs, and resolved_callable_module.rs FullFunction routes (facts-only versus target-bearing split)",
  "callable_semantic_batch/issuer.rs SelectedCallable (including its catalog-brand exception) and normal_callable_semantic_package/instance_constructor_semantic.rs plus physical constructor admission",
  "builder/normal_callable_semantic_source.rs old no-brand ingress and raw shadow/expr.rs FunctionCall observation branch",
  "control_flow/plan/normalizer/loop_body_lowering_associated_input.rs and control_flow/plan/features/* post-effect FunctionCall planner producers",
  "resolved_lowering/trivial_ssa/lowerer.rs post-argument claim_direct_call producer",
  "semantic BodyEffect(Call) versus physical argument EffectMask/block mutation vocabulary",
  "special/builtin/Extern non-direct disposition ownership and RawInvocationRootLineageV1 loan boundary",
]
excludes = [
  "Callee/target issuance implementation and name/arity/box/symbol synthesis (existing downstream issuer is named but not changed here), exact-i64 implementation, and raw physical lowering",
  "JSON/VM/backend, Method(None), mandatory-Callee, CallFlags, and warning cleanup",
  "one-line profile gate widening before this census and co-seal contract close",
]

[brief]
source_authority = "each resolver's existing source identity (SelectedCallable, ConstructorSourceIdV1, main/full-function recipe identity) plus parser source site; RawInvocationRootLineageV1 remains provenance and is not synthesized"
canonical_issuer = "a single reconciled observation boundary must classify every included entrance and hand owner/site/disposition to the same resolver/package co-seal; the row may split semantic identity from raw lineage only through an existing typed bridge"
non_authority = [
  "three-entrance claim without main_direct_call_source/FullFunction classification",
  "ShadowDirectCallUseV0 name/arity, callable_index=None empty map, raw Builder name policy, post-install ledger, AST re-scan, physical symbol, or second resolver",
  "semantic BodyEffect(Call) treated as physical argument effect, or physical EffectMask used to decide semantic disposition",
]
fail_fast = "Unclassified production entrance or planner edge, missing Raw lineage bridge, missing special/non-direct owner, closed traversal, owner/site conflict, or post-effect recovery path blocks profile widening and aborts before physical argument effects, package install, block mutation, or Call publication. Semantic BodyEffect is separately classified and never authorizes physical lowering."
smallest_next_slice = "Hand the in-boundary Selected/Constructor lineage and exact-target relation to the existing root-lineage exact-target loan design row; keep all parked cohorts outside this observation contract and do not widen a profile gate."
non_claims = [
  "this row does not implement observation, open a gate, or issue a target/Callee",
  "caller-zero is not inferred from absent text callers; old no-brand remains parked with a reopen trigger",
  "exact-i64 and FullFunction are not silently folded into ordinary SelectedCallable inventory",
]

[entrance_matrix]
selected_callable = "production source-bound resolver; ordinary FunctionCall is gate-closed, while catalog-brand FunctionCall is an explicit non-ordinary exception; any ordinary observation needs co-seal."
instance_constructor = "production semantic constructor issuer and separate physical admission; ConstructorSourceIdV1 exists, but raw lineage/site is not in the resolver input and must be bridged or parked."
main_direct_call = "production normal Main source-preparation through main_direct_call_source.rs and canonical_core_dispatch/callable.rs; exact-i64 is a downstream capability cohort, not the name of the whole entrance."
full_function = "production FullFunction splits facts-only resolve_forest in main_resolved_source.rs/instance_function_plan.rs from target-bearing resolved_callable_module.rs with callable index; keep both explicit before any ordinary inventory claim."
legacy_no_brand = "old normal_callable_semantic_source.rs has no confirmed non-test caller; ParkedSealed with reopen trigger is the only safe current classification, not caller-zero."
raw_bridge = "raw function_call_brand_source_demand.rs and raw_expression_dispatch/mod.rs consume the callable semantic ledger and bridge to physical lowering; they are not target/observation issuers, and caller=None collapse is forbidden."
post_effect_planners = "loop_body_lowering_associated_input.rs, control_flow/plan/features/*, and trivial_ssa/lowerer.rs are explicit legacy/planner producers to classify as blockers or outside owners; they cannot silently widen ordinary inventory."

[effect_boundary]
semantic_body_effect = "shadow/expr.rs BodyEffect(Call) is a semantic observation fact, not physical argument EffectMask or block mutation; its permitted ordering must be explicit and separately guarded."
physical_effect = "argument descent, MIR EffectMask emission, block mutation, and Call publication remain forbidden until owner/site/disposition and package co-seal are complete."
required_order = "entrance census -> semantic observation fact (if permitted) -> source identity/site/lineage bridge -> disposition -> same-session co-seal -> physical arguments/effects"
forbidden_order = "semantic BodyEffect used as target authority; physical effects before co-seal; argument descent before unresolved disposition; second resolver after effects"

[lineage_boundary]
semantic_input_gap = "SelectedCallableResolverInputV1 and ConstructorSourceIdV1 do not currently carry RawInvocationRootLineageV1; D0 must either define an existing typed loan or keep raw lineage at a separately owned pre-physical boundary."
allowed = "RawInvocationRootLineageV1 may be borrowed as provenance through an existing typed bridge; it may not be reconstructed from name, arity, box/key, or physical symbol."
missing = "No bridge is a typed blocker, not caller=None, empty inventory, or a new public semantic receipt."
sole_mapper = "All RawInvocationRootLineageV1 construction must delegate to one owner-specific mapper; duplicated key-to-lineage matches remain an open old-edge blocker until removed or explicitly delegated."

