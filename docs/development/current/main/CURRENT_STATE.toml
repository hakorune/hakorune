D20 decided: the SSA dominance family is a loop-carrier binding
desync, not missing phi emission. Carrier header/step/after phis
are emitted and patched for every failing function (both the
callable LoopCond port and the legacy-port JoinIR route funnel
into `lower_loop_generalized`), but carrier reads resolve through
