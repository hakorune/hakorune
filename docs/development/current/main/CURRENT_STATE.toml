verify-clean wrong-code case (entry-value replay, dead update
statement). S8 wires carrier publication into the read authority
the lowering actually resolves.
NOTE: EXE/VM smokes need `NYASH_BIN=target/debug/hakorune`;
bare runs use stale `target/release` and report phantom
terminals.
"""
