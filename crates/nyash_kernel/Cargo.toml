[package]
name = "nyash_kernel"
version = "0.1.0"
edition = "2021"

[features]
default = ["legacy-entry"]
legacy-entry = []
lifecycle-core = []
perf-observe = ["nyash-rust/perf-observe"]
perf-trace = []
promotion-test-support = ["nyash-rust/promotion-test-support"]

[lib]
name = "nyash_kernel"
crate-type = ["staticlib", "rlib"]

[dependencies]
nyash-rust = { path = "../../" }
serde_json = "1.0"  # Phase 285LLVM-1.1: For parsing fields JSON
# Match the compiler's std/alloc cohort; the redundant default marker forks
# memchr plus serde_json/regex and forces another compiler-library build.
memchr = { version = "2", default-features = false, features = ["std"] }
parking_lot = "0.12"

[build-dependencies]
cc = "1"
