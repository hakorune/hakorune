name: min-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CI feedback tier policy guard
        run: bash tools/checks/run_row_guard.sh --only ci-feedback-tier-policy

      - name: Guard registry structural ratchet
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          bash tools/checks/run_row_guard.sh
          --only guard-manifest-inventory
          --level l0
          --base ${{ github.event.pull_request.base.sha }}

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (for guards)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Cargo check (default features)
        run: cargo check --all-targets -q

      - name: ABI lane guard
        run: bash tools/checks/abi_lane_guard.sh

      - name: Failure/Outcome semantic manifest drift
        run: python3 tools/docs/failure_outcome_semantic_site_graph.py --check

      - name: Language v1 sensitive-change FULL gate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        run: >-
          bash tools/checks/language_v1_full_gate_for_changes.sh
          --base ${{ github.event.pull_request.base.sha }}
