name: portability-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    name: macOS build (release)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build hakorune (release)
        run: cargo build --release --bin hakorune -q

  windows-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    name: Windows check
    runs-on: windows-latest
    # The llvmlite-enabled lib test links the full Rust test binary on the
    # Windows runner; keep the memory-safe job width while allowing that
    # acceptance command to reach its test body.
    timeout-minutes: 45
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check hakorune
        run: cargo check --bin hakorune -q
      - name: Check temporary-input provider lifetime
        env:
          CARGO_BUILD_JOBS: 2
        run: >-
          cargo test --profile quick --features llvmlite-compat --lib
          host_providers::llvm_codegen::provider_keep::tests::provider_wrapper_exercises_missing_tool_invalid_input_child_failure_and_success
          -- --exact
      - name: Check harness log reservation on Windows
        shell: pwsh
        run: |
          $compiler = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $compiler) {
            $compiler = Get-Command gcc -ErrorAction SilentlyContinue
          }
          if (-not $compiler) {
            throw "a native C compiler (clang or gcc) is required for harness-log acceptance"
          }
          $output = Join-Path $env:RUNNER_TEMP "hako-harness-log-ownership.exe"
          $arguments = @(
            "-std=c11", "-Wall", "-Wextra", "-Werror",
            "lang/c-abi/tests/harness_log_ownership_test.c", "-o", $output
          )
          & $compiler.Source @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "harness-log ownership fixture compilation failed"
          }
          & $output
          if ($LASTEXITCODE -ne 0) {
            throw "harness-log ownership fixture failed"
          }

  plugin-recovery-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    name: Plugin recovery check (${{ matrix.os }} / ${{ matrix.plugin.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        plugin:
          - name: array
            manifest: plugins/nyash-array-plugin/Cargo.toml
          - name: map
            manifest: plugins/nyash-map-plugin/Cargo.toml
          - name: string
            manifest: plugins/nyash-string-plugin/Cargo.toml
          - name: console
            manifest: plugins/nyash-console-plugin/Cargo.toml
          - name: filebox
            manifest: plugins/nyash-filebox-plugin/Cargo.toml
          - name: path
            manifest: plugins/nyash-path-plugin/Cargo.toml
          - name: math
            manifest: plugins/nyash-math-plugin/Cargo.toml
          - name: net
            manifest: plugins/nyash-net-plugin/Cargo.toml
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check plugin crate
        run: cargo check --manifest-path ${{ matrix.plugin.manifest }} -q
